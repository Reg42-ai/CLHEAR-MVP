name: deploy-l1

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Deploy tested code, request a full L1 cycle, run one bounded queue/DLQ recovery pass, or record the private POC permission/inventory review through the deployed L0 worker'
        type: choice
        options: [deploy, verify-l1, recover-queues, poc-private-review, approve-inventory]
        required: true
        default: deploy
      recovery_plan:
        description: 'Optional owner-reviewed capacity plan ID from infra/recovery (l1-RUN-ATTEMPT)'
        type: string
        required: false
        default: ''
      max_messages:
        description: 'recover-queues only: upper bound of messages for this bounded, resumable pass (default 5000, max 200000)'
        type: string
        required: false
        default: '5000'
      poc_action:
        description: 'poc-private-review only: activate or revoke the private-POC permission rows'
        type: choice
        options: [activate, revoke]
        required: false
        default: activate
      evidence_ref:
        description: 'poc-private-review / approve-inventory: operator evidence reference'
        type: string
        required: false
        default: 'poc:private-test-environment'
      inventory_hash:
        description: 'approve-inventory only: frozen SHA-256 inventory hash'
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  eligibility:
    if: github.repository == 'Reg42-ai/CLHEAR-MVP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check founder merge and exact completed main CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment_eligibility.py --stage precheck --output artifacts/eligibility-precheck.json
      - name: Retain eligibility decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-eligibility-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: artifacts/eligibility-precheck.json
  deploy:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true' && inputs.operation != 'verify-l1' && inputs.operation != 'recover-queues' && inputs.operation != 'poc-private-review' && inputs.operation != 'approve-inventory' && github.repository == 'Reg42-ai/CLHEAR-MVP' && github.ref == 'refs/heads/main'
    concurrency:
      group: clhear-l1-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: clhear-l1
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      CLHEAR_DEPLOY_ROLE_ARN: ${{ vars.CLHEAR_DEPLOY_ROLE_ARN }}
      CLHEAR_REVIEWER_EMAILS: ${{ vars.CLHEAR_REVIEWER_EMAILS }}
      CLHEAR_DEPLOY_ENVIRONMENT: clhear-l1
      CLHEAR_FAST_DEPLOY_ENABLED: ${{ vars.CLHEAR_FAST_DEPLOY_ENABLED }}
      CLHEAR_RECOVERY_PLAN: ${{ inputs.recovery_plan }}
      DEPLOY_BUCKET: clhear-deploy-730649732189
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Recheck eligibility after acquiring the deployment lock
        id: locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment_eligibility.py --stage locked --output artifacts/eligibility-locked.json
      - name: Require deployment authority and reviewer configuration
        if: steps.locked.outputs.eligible == 'true'
        shell: bash
        run: |
          [[ "$CLHEAR_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::730649732189:role/[A-Za-z0-9+=,.@_/-]+$ ]] || { echo 'Configure CLHEAR_DEPLOY_ROLE_ARN in the protected clhear-l1 environment.' >&2; exit 1; }
          test -n "$CLHEAR_REVIEWER_EMAILS" || { echo 'Configure the approved CLHEAR_REVIEWER_EMAILS in clhear-l1.' >&2; exit 1; }
          [[ -z "$CLHEAR_RECOVERY_PLAN" || "$CLHEAR_RECOVERY_PLAN" =~ ^l1-[0-9]+-[0-9]+$ ]] || { echo 'Recovery must name an owner-reviewed plan ID.' >&2; exit 1; }
      - uses: actions/setup-python@v5
        if: steps.locked.outputs.eligible == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
        if: steps.locked.outputs.eligible == 'true'
      - name: Configure dedicated CLHEAR deployment identity
        if: steps.locked.outputs.eligible == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CLHEAR_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 10800
      - name: Verify the assumed account before publishing code
        if: steps.locked.outputs.eligible == 'true'
        run: test "$(aws sts get-caller-identity --query Account --output text)" = '730649732189'
      - name: Select viewer or full deployment against verified live code
        if: steps.locked.outputs.eligible == 'true'
        id: scope
        run: python scripts/viewer_release.py select --sha "$GITHUB_SHA" --output artifacts/deployment-scope.json
      - name: Reuse verified backend package for presentation changes
        if: steps.locked.outputs.eligible == 'true' && steps.scope.outputs.lane == 'viewer'
        run: python scripts/viewer_release.py package --selection artifacts/deployment-scope.json --output artifacts/lambda/webui.zip
      - uses: docker/setup-buildx-action@v3
        if: steps.locked.outputs.eligible == 'true' && steps.scope.outputs.lane == 'full'
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.locked.outputs.eligible == 'true' && steps.scope.outputs.lane == 'full'
      - name: Build immutable worker image
        if: steps.locked.outputs.eligible == 'true' && steps.scope.outputs.lane == 'full'
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: 730649732189.dkr.ecr.us-east-1.amazonaws.com/clhear-workers:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=clhear-worker-main
          cache-to: type=gha,mode=max,scope=clhear-worker-main
      - name: Build Lambda code with compatible native dependencies
        if: steps.locked.outputs.eligible == 'true' && steps.scope.outputs.lane == 'full'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.webui
          platforms: linux/amd64
          outputs: type=local,dest=artifacts/lambda
          cache-from: type=gha,scope=clhear-viewer-main
          cache-to: type=gha,mode=max,scope=clhear-viewer-main
      - name: Upload immutable UI code
        if: steps.locked.outputs.eligible == 'true'
        id: ui
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import boto3
          root = Path('artifacts/lambda')
          manifest = json.loads((root / 'webui.json').read_text())
          key = f"webui/deployments/{os.environ['GITHUB_SHA']}/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}/webui.zip"
          with (root / 'webui.zip').open('rb') as body:
              result = boto3.client('s3').put_object(Bucket=os.environ['DEPLOY_BUCKET'], Key=key,
                  Body=body, IfNoneMatch='*', ServerSideEncryption='AES256',
                  Metadata={'sha256': manifest['sha256'], 'git-sha': os.environ['GITHUB_SHA'], 'kind': 'application-code'})
          version = result.get('VersionId')
          if not version or version == 'null':
              raise RuntimeError('Deployment bucket must have versioning enabled')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"key={key}\nversion={version}\nsha256={manifest['sha256']}\n")
          PY
      - name: Recheck eligibility immediately before applying deployment
        id: apply_guard
        if: steps.locked.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment_eligibility.py --stage apply --output artifacts/eligibility-apply.json
      - name: Deploy code and execute CLHEAR L0/L1 verification
        if: steps.locked.outputs.eligible == 'true' && steps.apply_guard.outputs.eligible == 'true'
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          UI_KEY: ${{ steps.ui.outputs.key }}
          UI_VERSION: ${{ steps.ui.outputs.version }}
          UI_SHA256: ${{ steps.ui.outputs.sha256 }}
        run: |
          if [ '${{ steps.scope.outputs.lane }}' = viewer ]; then
            python scripts/apply_viewer_release.py --target live --sha "$GITHUB_SHA" --selection artifacts/deployment-scope.json --output artifacts/deployment-result.json
          else
            python scripts/deploy_l1.py \
              --sha "$GITHUB_SHA" \
              --image "730649732189.dkr.ecr.us-east-1.amazonaws.com/clhear-workers@$WORKER_DIGEST" \
              --ui-key "$UI_KEY" --ui-version "$UI_VERSION" --ui-sha256 "$UI_SHA256" \
              --deployment-id "l1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --reviewer-emails "$CLHEAR_REVIEWER_EMAILS" \
              --recovery-plan "$CLHEAR_RECOVERY_PLAN" \
              --output artifacts/deployment-result.json --apply
          fi
      - name: Record verified viewer and worker code independently
        if: steps.locked.outputs.eligible == 'true' && steps.apply_guard.outputs.eligible == 'true' && env.CLHEAR_FAST_DEPLOY_ENABLED == 'true'
        run: python scripts/viewer_release.py publish --selection artifacts/deployment-scope.json --report artifacts/deployment-result.json --output artifacts/viewer-release.json
      - name: Retain code deployment evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-deployment-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/deployment-result.json
            artifacts/recovery-plan.json
            artifacts/lambda/webui.json
            artifacts/eligibility-locked.json
            artifacts/eligibility-apply.json
            artifacts/deployment-scope.json
            artifacts/viewer-release.json
  verify-l1:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-l1'
    concurrency:
      group: clhear-l1-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: clhear-l1
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      CLHEAR_DEPLOY_ROLE_ARN: ${{ vars.CLHEAR_DEPLOY_ROLE_ARN }}
      CLHEAR_DEPLOY_ENVIRONMENT: clhear-l1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - name: Recheck owner merge and CI under the shared rollout lock
        id: locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/deployment_eligibility.py --stage locked --output artifacts/verification-eligibility.json
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.locked.outputs.eligible == 'true'
        with:
          role-to-assume: ${{ env.CLHEAR_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Submit full corpus verification through deployed L0
        if: steps.locked.outputs.eligible == 'true'
        run: python scripts/deploy_l1.py verify --sha "$GITHUB_SHA" --verification-id "l1-cycle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output artifacts/l1-cycle-submission.json
      - name: Retain submission receipt; acceptance is in CLHEAR worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-cycle-submission-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/l1-cycle-submission.json
            artifacts/verification-eligibility.json

  recover-queues:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true' && github.event_name == 'workflow_dispatch' && inputs.operation == 'recover-queues'
    concurrency:
      group: clhear-l1-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: clhear-l1
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      CLHEAR_DEPLOY_ROLE_ARN: ${{ vars.CLHEAR_DEPLOY_ROLE_ARN }}
      CLHEAR_DEPLOY_ENVIRONMENT: clhear-l1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - name: Recheck owner merge and CI under the shared rollout lock
        id: locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/deployment_eligibility.py --stage locked --output artifacts/recovery-eligibility.json
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.locked.outputs.eligible == 'true'
        with:
          role-to-assume: ${{ env.CLHEAR_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Run one bounded queue and dead-letter recovery pass through deployed L0
        if: steps.locked.outputs.eligible == 'true'
        run: python scripts/deploy_l1.py recover-queues --sha "$GITHUB_SHA" --recovery-id "l1-queues-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --max-messages "${{ inputs.max_messages }}" --output artifacts/queue-recovery.json
      - name: Retain the recovery receipt; dispositions are in the deferred-delivery ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-queue-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/queue-recovery.json
            artifacts/recovery-eligibility.json

  poc-private-review:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true' && github.event_name == 'workflow_dispatch' && inputs.operation == 'poc-private-review'
    concurrency:
      group: clhear-l1-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: clhear-l1
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      CLHEAR_DEPLOY_ROLE_ARN: ${{ vars.CLHEAR_DEPLOY_ROLE_ARN }}
      CLHEAR_DEPLOY_ENVIRONMENT: clhear-l1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - name: Recheck owner merge and CI under the shared rollout lock
        id: locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/deployment_eligibility.py --stage locked --output artifacts/poc-review-eligibility.json
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.locked.outputs.eligible == 'true'
        with:
          role-to-assume: ${{ env.CLHEAR_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Record private-POC permission rows through deployed L0
        if: steps.locked.outputs.eligible == 'true'
        run: python scripts/deploy_l1.py poc-private-review --sha "$GITHUB_SHA" --verification-id "l1-poc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --action "${{ inputs.poc_action }}" --evidence-ref "${{ inputs.evidence_ref }}" --output artifacts/poc-private-review.json
      - name: Retain the POC review receipt; rows are in source_permissions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-poc-review-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/poc-private-review.json
            artifacts/poc-review-eligibility.json

  approve-inventory:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true' && github.event_name == 'workflow_dispatch' && inputs.operation == 'approve-inventory'
    concurrency:
      group: clhear-l1-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: clhear-l1
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      CLHEAR_DEPLOY_ROLE_ARN: ${{ vars.CLHEAR_DEPLOY_ROLE_ARN }}
      CLHEAR_DEPLOY_ENVIRONMENT: clhear-l1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - name: Recheck owner merge and CI under the shared rollout lock
        id: locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/deployment_eligibility.py --stage locked --output artifacts/inventory-review-eligibility.json
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.locked.outputs.eligible == 'true'
        with:
          role-to-assume: ${{ env.CLHEAR_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Record the frozen inventory scope review through deployed L0
        if: steps.locked.outputs.eligible == 'true'
        run: python scripts/deploy_l1.py approve-inventory --sha "$GITHUB_SHA" --verification-id "l1-inventory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --inventory-hash "${{ inputs.inventory_hash }}" --evidence-ref "${{ inputs.evidence_ref }}" --output artifacts/inventory-review.json
      - name: Retain the inventory review receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-inventory-review-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/inventory-review.json
            artifacts/inventory-review-eligibility.json
