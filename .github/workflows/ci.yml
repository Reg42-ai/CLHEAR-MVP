name: ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read
  actions: read

# Tests may be superseded; a live deployment has its own non-cancelling lock.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: clhear-test-only
          POSTGRES_DB: clhear_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clhear_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CLHEAR_TEST_POSTGRES_URL: postgresql+psycopg://postgres:clhear-test-only@127.0.0.1:5432/clhear_test_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Classify the complete change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/viewer_release.py ci --output artifacts/ci-scope.json
      - name: Presentation, permissions, and snapshot regressions
        if: steps.scope.outputs.lane == 'viewer'
        run: >-
          pytest tests/test_l1_demo_ui.py tests/test_review_access.py
          tests/test_l1_evidence_api.py tests/test_lambda_snapshot_access.py
          tests/test_lambda_packaging.py tests/test_preview.py -v
      - name: Full application suite
        if: steps.scope.outputs.lane != 'viewer'
        run: pytest tests/ -v
      - name: HLD v2 requirement trace is honest
        run: python scripts/trace_check.py --summary
      - name: Rights similarity guard (7.3) — no derived output quotes restricted text beyond its basis
        run: python -m app.clhear.l1.guard
      - name: WCAG 2.2 AA static rules (every public page)
        run: python scripts/a11y_check.py

  # WCAG 2.2 AA in a real browser (HLD v2 §5 design rules): axe-core against
  # every public page in both themes on a seeded offline corpus, plus the
  # NYC demo journey from a fresh browser. Serious/critical findings fail.
  a11y-axe:
    runs-on: ubuntu-latest
    env:
      CLHEAR_HTTP_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock playwright
      - run: playwright install --with-deps chromium
      - name: axe-core audit, dark + light
        run: python scripts/a11y_axe.py --json a11y-axe.json
      - name: NYC demo — describe → blueprint from a fresh browser
        run: python scripts/nyc_demo.py --synthetic-corpus --api --e2e --artifacts nyc-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-and-demo
          path: |
            a11y-axe.json
            nyc-demo/

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra fmt -check

  # Release preparation/signing/promotion belongs to the L0 worker in release.yml.
  # CI never manufactures an operational corpus or automatically exports text.
