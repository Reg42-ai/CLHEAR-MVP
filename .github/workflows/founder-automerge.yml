name: founder-automerge

# Enables GitHub auto-merge on pull requests opened from the agent's
# cursor/*-325d branches, using a fine-grained token owned by the repository
# founder (Reg42-ai). GitHub then performs the merge as the founder once the
# required checks pass, so deploy-l1's exact-founder-merge eligibility holds
# unchanged. Nothing here bypasses branch protection or the required checks.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  enable:
    if: >-
      github.repository == 'Reg42-ai/CLHEAR-MVP'
      && startsWith(github.event.pull_request.head.ref, 'cursor/')
      && endsWith(github.event.pull_request.head.ref, '-325d')
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge as the founder
        env:
          GH_TOKEN: ${{ secrets.FOUNDER_AUTOMERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          test -n "$GH_TOKEN" || { echo 'FOUNDER_AUTOMERGE_TOKEN is not configured; nothing to do.'; exit 0; }
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
