<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLHEAR · Security</title>
<link rel="stylesheet" href="/static/theme.css" />
<style>
  /* Security posture page (HLD v2 §7.1): how to report a vulnerability (VDP, RFC 9116
     security.txt), what is in and out of pen-test scope, the SOC 2 Type I readiness
     pack, supply-chain controls (SBOM, Sigstore, pinning), identity, the audit log
     and data handling. Reads /security.json so the page and the machine-readable
     posture never drift apart. */
  main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: clamp(26px, 4vw, 36px); margin: 0 0 6px; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0 0 16px; max-width: 820px; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 8px; font-size: 17px; }
  .card p, .card li { color: var(--muted); font-size: 14px; line-height: 1.65; }
  .card ul { margin: 6px 0 0; padding-left: 18px; }
  .mono { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
  dl.kv { display: grid; grid-template-columns: 190px 1fr; gap: 4px 12px; font-size: 13.5px; margin: 8px 0; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } dl.kv { grid-template-columns: 1fr; } }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; border: 1px solid var(--edge); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  #h-av + p .badge { margin: 2px; }
  #h-docs + ul li { padding-block: 3px; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 12px 0; }
  .note { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="root"></div>
<script type="module">
import React, { useState, useEffect } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(React.createElement);

function useTheme() {
  const [theme, setTheme] = useState(localStorage.getItem("clhear_theme") || "dark");
  useEffect(() => { document.documentElement.dataset.theme = theme; localStorage.setItem("clhear_theme", theme); }, [theme]);
  return [theme, () => setTheme(theme === "dark" ? "light" : "dark")];
}

const DOCS = "https://github.com/Reg42-ai/CLHEAR-MVP/blob/main/";

function App() {
  const [theme, toggleTheme] = useTheme();
  const [p, setP] = useState(null);
  useEffect(() => { fetch("/security.json").then((r) => r.json()).then(setP).catch(() => setP({})); }, []);
  const doc = (path) => html`<a class="navlink mono" href=${DOCS + path}>${path}</a>`;
  return html`<div>
    <header class="appbar">
      <div class="wordmark"><b>CLHEAR</b><span>security</span></div><div class="spacer"></div>
      <nav aria-label="Modes"><a class="navlink" href="/">Start</a><a class="navlink" href="/explore">Explore</a><a class="navlink" href="/evals">Evals</a><a class="navlink active" href="/security">Security</a><a class="navlink" href="/status">Status</a><a class="navlink" href="/stack">Stack</a></nav>
      <button class="themebtn" onClick=${toggleTheme} aria-label="Toggle colour theme">${theme === "dark" ? "◐ pearl" : "◑ dark"}</button>
    </header>
    <main id="main">
      <h1>Security you can audit, not admire.</h1>
      <p class="lead">Tier-1 firms adopt what their second line, internal audit and regulator will accept. This page is the index of that evidence: how to report a flaw, what gets tested, what is signed, who did what, and where the SOC 2 pack lives.</p>
      ${!p ? html`<p class="empty">Loading…</p>` : html`
        <section class="card" id="report" aria-labelledby="h-report">
          <h2 id="h-report">Report a vulnerability</h2>
          <p>Email <a class="navlink mono" href=${"mailto:" + p.contact}>${p.contact}</a> or read <a class="navlink mono" href="/.well-known/security.txt">/.well-known/security.txt</a> (RFC 9116). Good-faith research within the policy is authorised and will not be pursued: safe harbour <span class="badge ok">${p.vdp && p.vdp.safe_harbour ? "yes" : "no"}</span>.</p>
          <dl class="kv">
            <dt>Triage acknowledgement</dt><dd>within ${p.vdp ? p.vdp.triage_sla_hours : "—"} hours</dd>
            <dt>Fix targets</dt><dd>${p.vdp ? Object.entries(p.vdp.fix_sla_days).map(([k, v]) => `${k} ${v} d`).join(" · ") : "—"}</dd>
            <dt>Policy</dt><dd>${p.vdp ? doc(p.vdp.policy) : "—"}</dd>
          </dl>
          <p class="note" id="hall-of-thanks">Hall of thanks: researchers who reported under the policy are credited in the VDP document with their consent.</p>
        </section>
        <div class="grid">
          <section class="card" aria-labelledby="h-pt">
            <h2 id="h-pt">Penetration testing</h2>
            <p>${p.pen_test ? p.pen_test.cadence : ""} engagement against the published scope; the executive summary is published after remediation.</p>
            <p>Scope: ${p.pen_test ? doc(p.pen_test.scope) : "—"}</p>
          </section>
          <section class="card" aria-labelledby="h-soc">
            <h2 id="h-soc">SOC 2 and ISO 27001</h2>
            <p>${p.soc2 ? p.soc2.target : ""}</p>
            <p>Readiness pack: ${p.soc2 ? doc(p.soc2.readiness_pack) : "—"}</p>
          </section>
          <section class="card" aria-labelledby="h-sc">
            <h2 id="h-sc">Supply chain</h2>
            <dl class="kv">
              <dt>SBOM</dt><dd>${p.supply_chain && p.supply_chain.sbom}</dd>
              <dt>Signing</dt><dd>${p.supply_chain && p.supply_chain.signing}</dd>
              <dt>Pinning</dt><dd>${p.supply_chain && p.supply_chain.pinning}</dd>
              <dt>Verify a release</dt><dd>${p.supply_chain ? doc(p.supply_chain.verify) : "—"}</dd>
            </dl>
          </section>
          <section class="card" aria-labelledby="h-id">
            <h2 id="h-id">Identity</h2>
            <dl class="kv">
              <dt>Public users</dt><dd>${p.identity && p.identity.public}</dd>
              <dt>Enterprise</dt><dd>${p.identity && p.identity.enterprise}</dd>
              <dt>Integrations</dt><dd>${p.identity && p.identity.api}</dd>
            </dl>
          </section>
          <section class="card" aria-labelledby="h-audit">
            <h2 id="h-audit">Audit log</h2>
            <ul>${(p.audit ? p.audit.what : []).map((w) => html`<li key=${w}>${w}</li>`)}</ul>
            <p class="note">Retention: ${p.audit && p.audit.retention}. Access: <span class="mono">${p.audit && p.audit.access}</span>.</p>
          </section>
          <section class="card" aria-labelledby="h-data">
            <h2 id="h-data">Data handling</h2>
            <dl class="kv">
              <dt>Agnostic store</dt><dd>${p.data_handling && p.data_handling.agnostic_store}</dd>
              <dt>Member benchmarks</dt><dd>${p.data_handling && p.data_handling.benchmarks}</dd>
            </dl>
          </section>
        </div>
        <section class="card" aria-labelledby="h-av">
          <h2 id="h-av">Availability and recovery</h2>
          <p>Live objectives on the <a class="navlink" href="/status">status page</a>: ${(p.availability ? p.availability.slos : []).map((s) => html`<span key=${s} class="badge">${s}</span>`)}. Disaster recovery: ${p.availability && p.availability.dr}.</p>
        </section>
        <section class="card" aria-labelledby="h-docs">
          <h2 id="h-docs">Documents</h2>
          <ul>${(p.documents || []).map((d) => html`<li key=${d}>${doc("docs/security/" + d)}</li>`)}</ul>
        </section>`}
    </main></div>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
