<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLHEAR · The Stack</title>
<link rel="stylesheet" href="/static/theme.css" />
<style>
  /* Page-specific styles; shared tokens + chrome live in /static/theme.css. */
  html { scroll-behavior: smooth; }
  main { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 30px 22px 90px; }

  /* --------------------------------------------------------------- home */
  .hero { text-align: center; margin: 34px 0 8px; }
  .hero h1 { font-size: clamp(26px, 4.4vw, 44px); margin: 0 0 10px; font-weight: 800; letter-spacing: -0.01em; }
  .hero h1 .grad {
    background: linear-gradient(92deg, var(--ind-400), var(--mint-400));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { color: var(--muted); max-width: 720px; margin: 0 auto; font-size: 15.5px; }
  .stackwrap { position: relative; max-width: 860px; margin: 44px auto 0; }
  .flowline { /* animated derivation current, L0 up to L8 */
    position: absolute; left: -26px; top: 8px; bottom: 8px; width: 2px;
    background: linear-gradient(180deg, rgba(52,211,153,0.5), rgba(99,102,241,0.45) 55%, transparent);
    border-radius: 2px;
  }
  .flowline::after {
    content: ""; position: absolute; left: -2.5px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--mint-400); box-shadow: 0 0 12px var(--mint-400);
    animation: rise 5.5s linear infinite;
  }
  @keyframes rise { from { bottom: 0; opacity: 0.2; } 12% { opacity: 1; } to { bottom: 100%; opacity: 0; } }
  .slab {
    display: grid; grid-template-columns: 84px 1fr auto; gap: 18px; align-items: center;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
    padding: 17px 22px; margin-bottom: 12px; cursor: pointer; position: relative;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    animation: enter .5s ease both;
  }
  .slab:nth-child(odd) { animation-delay: .04s; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
  .slab:hover { transform: translateY(-2px) scale(1.008); border-color: var(--edge-bright); box-shadow: var(--glow); }
  .slab .code { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--faint); letter-spacing: 0.04em; }
  .slab:hover .code { color: var(--accent); }
  .slab h3 { margin: 0 0 3px; font-size: 16.5px; }
  .slab .purpose { font-size: 13px; color: var(--muted); max-width: 640px; }
  .slab .right { text-align: right; display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }
  .slab .countline { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* -------------------------------------------------------- layer pages */
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .crumbs a { cursor: pointer; }
  .layerhead { display: flex; align-items: center; gap: 20px; margin-bottom: 6px; flex-wrap: wrap; }
  .layerhead .bigcode { font-family: var(--mono); font-size: 40px; font-weight: 800; color: var(--accent); }
  .layerhead h2 { margin: 0; font-size: 27px; letter-spacing: -0.01em; }
  .purposeline { color: var(--muted); max-width: 840px; margin: 6px 0 24px; font-size: 15px; }
  .grid2 { display: grid; grid-template-columns: minmax(320px, 5fr) 7fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .reasonpanel { position: sticky; top: 76px; }
  .regsearch { width: 100%; border: 1px solid var(--edge); background: var(--panel-strong);
               color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .regmeta { font-family: var(--mono); font-size: 12px; color: var(--faint); margin: 4px 2px 12px; }
  .chip.sel { background: rgba(99,102,241,0.25); color: var(--ink); border-color: var(--edge-bright); }
  .pipeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .pipestep { display: flex; gap: 12px; align-items: flex-start; }
  .pipenum { font-family: var(--mono); font-weight: 800; color: var(--accent); border: 1px solid var(--edge-bright);
             border-radius: 10px; min-width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
  .codeblock { background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 10px;
               padding: 12px 14px; font-family: var(--mono); font-size: 11.5px; overflow-x: auto;
               color: var(--ink); white-space: pre; }
  .votebtns { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .votebtn { border: 1px solid var(--edge); background: var(--panel-strong); color: var(--muted);
             border-radius: 8px; padding: 5px 13px; font-size: 12.5px; cursor: pointer; }
  .votebtn:hover { border-color: var(--edge-bright); color: var(--ink); }
  .votebtn.confirm.on { background: rgba(52,211,153,0.16); color: var(--ok); border-color: var(--ok); }
  .votebtn.dispute.on { background: rgba(251,113,133,0.16); color: var(--bad); border-color: var(--bad); }
  footer.sitefoot { position: relative; z-index: 1; border-top: 1px solid var(--edge); margin-top: 40px;
                    padding: 22px 26px; display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline;
                    font-size: 12.5px; color: var(--faint); }
  footer.sitefoot a { color: var(--muted); }
  .reasonpanel .method { font-size: 13.5px; color: var(--ink); opacity: 0.92; margin-bottom: 14px; }
  .kv { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip.linky { cursor: pointer; color: var(--accent); border-color: rgba(129,140,248,0.4); }
  .chip.linky:hover { background: rgba(99,102,241,0.14); }
  .gatelist { margin: 0; padding: 0; list-style: none; }
  .gatelist li { font-size: 13px; color: var(--muted); padding: 6px 0 6px 22px; position: relative; }
  .gatelist li::before { content: "▸"; position: absolute; left: 4px; color: var(--mint-400); }
  .gatelist.evidence li::before { content: "⬢"; color: var(--ind-400); font-size: 10px; top: 8px; }
  .demobanner {
    display: flex; gap: 12px; align-items: flex-start; border: 1px solid rgba(251,191,36,0.35);
    background: rgba(251,191,36,0.07); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px;
    font-size: 13px; color: var(--amber-400);
  }
  [data-theme="light"] .demobanner { color: var(--amber-600); }
  .demobanner b { letter-spacing: 0.1em; }

  /* -------------------------------- AI-native visuals */
  .funnel { display: flex; flex-direction: column; gap: 8px; }
  .funnelrow { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center;
               background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 12px; }
  .funnelrow .tier { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .funnelbar { height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; }
  .funnelbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint-400), var(--ind-400));
                 animation: grow .8s ease both; }
  @keyframes grow { from { width: 0; } }
  .loop { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin: 12px 0; }
  .loopstep { border: 1px solid var(--edge); background: var(--panel-strong); border-radius: 999px;
              padding: 6px 12px; font-size: 12px; color: var(--muted); animation: pulse 2.8s ease infinite; }
  .loopstep:nth-child(odd) { animation-delay: .4s; }
  .loopstep.on { border-color: var(--mint-400); color: var(--mint-400); }
  @keyframes pulse { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
  .matrix { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .matrix th, .matrix td { border-bottom: 1px solid var(--edge); padding: 8px 10px; text-align: left; vertical-align: top; }
  .matrix th { color: var(--faint); font-weight: 600; letter-spacing: .08em; font-size: 11px; }
  .bench { display: flex; flex-direction: column; gap: 8px; }
  .benchrow { display: grid; grid-template-columns: 48px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
  .persona { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: start;
             background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .avatar { width: 48px; height: 48px; border-radius: 14px; background: conic-gradient(from 120deg, var(--ind-400), var(--mint-400), var(--ind-500));
            box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--canvas) 55%, transparent); }
  .avatar.human { background: linear-gradient(135deg, #334155, #64748b); }
  .leddot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .leddot.ok { background: var(--mint-400); box-shadow: 0 0 8px var(--mint-400); }
  .leddot.idle { background: var(--faint); }
  .leddot.bad { background: var(--rose-400); }
  .teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .opsitem { border-left: 2px solid var(--ind-400); padding: 8px 12px; margin-bottom: 8px; }
  .opsitem .why { font-size: 13.5px; color: var(--ink); }
  .genbox { border: 1px dashed rgba(129,140,248,0.35); border-radius: 10px; padding: 10px 12px; margin: 10px 0 14px; }
  .genbox h5 { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; color: var(--faint); }

  /* items */
  .card {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px; cursor: pointer;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { border-color: var(--edge-bright); transform: translateY(-1px); box-shadow: var(--glow); }
  .card .id { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .card h5 { margin: 3px 0 5px; font-size: 15px; }
  .card .sum { font-size: 13px; color: var(--muted); }
  .card .tags { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px; }
  .lockicon { color: var(--rose-400); font-size: 12px; }

  /* coverage matrix */
  .covrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--edge); font-size: 13px; }
  .covrow:last-child { border-bottom: none; }
  .covrow .ob { font-family: var(--mono); font-size: 11.5px; flex: 1; color: var(--muted); }
  .state { border-radius: 6px; padding: 1px 9px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
  .state.covered { background: rgba(52,211,153,0.14); color: var(--mint-400); }
  .state.partial { background: rgba(251,191,36,0.14); color: var(--amber-400); }
  .state.gap { background: rgba(251,113,133,0.16); color: var(--rose-400); }

  /* risk */
  .score { font-family: var(--mono); font-size: 34px; font-weight: 800; }
  .score.low { color: var(--mint-400); } .score.elevated { color: var(--amber-400); } .score.high { color: var(--rose-400); }
  .bar { height: 6px; border-radius: 4px; background: var(--panel-strong); overflow: hidden; margin: 4px 0 10px; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--ind-500), var(--mint-400)); }
  .comprow { font-size: 12px; color: var(--muted); font-family: var(--mono); display: flex; justify-content: space-between; }

  /* L8 locked */
  .blurred { filter: blur(0px); font-family: var(--mono); color: var(--muted); background: var(--panel-strong);
             padding: 8px 12px; border-radius: 8px; letter-spacing: 0.06em; }

  /* --------------------------------------------------------- lineage drawer */
  .scrim { position: fixed; inset: 0; background: rgba(4,4,16,0.55); backdrop-filter: blur(3px); z-index: 60; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(660px, 94vw); z-index: 61;
    background: color-mix(in srgb, var(--canvas) 92%, #000 0%);
    border-left: 1px solid var(--edge-bright); box-shadow: -30px 0 80px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; animation: slidein .22s ease;
  }
  [data-theme="light"] .drawer { background: #fbfaf7; }
  @keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
  .drawer header { position: static; display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--edge); background: transparent; }
  .drawer header h3 { margin: 0; font-size: 15px; flex: 1; }
  .drawer header .x { cursor: pointer; color: var(--muted); font-size: 20px; padding: 2px 10px; }
  .drawer .body { overflow-y: auto; padding: 18px 20px 40px; flex: 1; }
  .lnode { border-left: 2px solid var(--edge); margin: 0 0 10px 6px; padding: 8px 0 8px 16px; position: relative; }
  .lnode::before { content: ""; position: absolute; left: -6px; top: 14px; width: 10px; height: 10px; border-radius: 50%;
                   background: var(--canvas); border: 2px solid var(--accent); }
  .lnode.l1::before { border-color: var(--mint-400); }
  .lnode.locked::before { border-color: var(--rose-400); }
  .lnode .laytag { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; color: var(--faint); }
  .lnode h6 { margin: 2px 0 3px; font-size: 13.5px; }
  .lnode .det { font-size: 12.5px; color: var(--muted); }
  .verbatim {
    font-size: 12.5px; background: var(--panel-strong); border: 1px solid var(--edge);
    border-left: 3px solid var(--mint-400); border-radius: 8px; padding: 10px 13px; margin-top: 8px;
    max-height: 220px; overflow-y: auto; white-space: pre-wrap; color: var(--ink);
  }
  .verbatim.lockedtext { border-left-color: var(--rose-400); color: var(--muted); font-style: italic; }
  .provline { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 6px; word-break: break-all; }
  .provline a { color: var(--accent); }
  .foldbtn { cursor: pointer; font-size: 11px; color: var(--accent); user-select: none; }

  /* L0/L1 dashboards */
  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 14px 16px; }
  .stat .n { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--ink); }
  .stat .lbl { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase; margin-top: 2px; }
  .feeditem { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--edge); font-size: 13px; align-items: baseline; }
  .feeditem:last-child { border: none; }
  .feeditem .dot { min-width: 8px; height: 8px; border-radius: 50%; position: relative; top: 2px; }
  .dot.success { background: var(--mint-400); } .dot.failure { background: var(--rose-400); }
  .dot.warning { background: var(--amber-400); } .dot.info, .dot.running { background: var(--ind-400); }
  .feeditem .when { font-family: var(--mono); font-size: 11px; color: var(--faint); min-width: 74px; }
  .feeditem .what { color: var(--muted); }
  .minitable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .minitable th { text-align: left; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); padding: 6px 8px; border-bottom: 1px solid var(--edge); }
  .minitable td { padding: 7px 8px; border-bottom: 1px solid var(--edge); color: var(--muted); }
  .minitable td:first-child { color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>

<!-- no-build frontend: React 18 + htm, per repo convention -->
<script type="module">
import React, { useState, useEffect, useMemo } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(React.createElement);
const jget = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(`${r.status} ${url}`); return r.json(); });

/* ------------------------------------------------------------------ shell */

function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash || "#/");
  useEffect(() => {
    const onHash = () => setHash(window.location.hash || "#/");
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return hash.replace(/^#/, "");
}
const nav = (path) => { window.location.hash = path; };

function useTheme() {
  const [theme, setTheme] = useState(localStorage.getItem("clhear_theme") || "dark");
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem("clhear_theme", theme);
  }, [theme]);
  return [theme, () => setTheme(theme === "dark" ? "light" : "dark")];
}

const STATUS_LED = {
  live: "LIVE", derived: "DERIVED", curated: "CURATED", computed: "COMPUTED",
  locked: "LOCKED", validated: "VALIDATED", demo: "DEMO",
};
const Led = ({ status }) => html`<span class="led ${status}"><i></i>${STATUS_LED[status] || status}</span>`;

/* ------------------------------------------------------------------- home */

const COUNT_LABELS = {
  events: "events", runs: "runs", proposals: "proposals", llm_calls: "LLM calls",
  families: "families", sources: "sources", sources_ingested: "ingested",
  clauses: "clauses", clauses_public: "public clauses", change_events: "changes",
  obligations: "obligations", validated: "validated", derived_unreviewed: "unreviewed",
  stale: "stale", building_blocks: "blocks", profile_attributes: "attributes",
  sample_profiles: "sample profiles", activities: "activities",
  sample_programs: "sample programs", blueprints_requested: "blueprints requested",
  risk_areas: "risk areas", benchmark_definitions: "definitions", aggregates_published: "published",
};
function countline(counts, pick) {
  return (pick || Object.keys(counts)).filter((k) => counts[k] !== undefined)
    .map((k) => `${counts[k]} ${COUNT_LABELS[k] || k}`).join(" · ");
}
const HOME_COUNTS = {
  L0: ["events", "runs", "proposals"], L1: ["sources_ingested", "clauses", "change_events"],
  L2: ["obligations", "validated"], L4: ["profile_attributes", "sample_profiles"],
  L6: ["sample_programs", "blueprints_requested"],
};

function Home({ layers }) {
  const ordered = [...layers].sort((a, b) => b.layer.localeCompare(a.layer, undefined, { numeric: true }));
  return html`
    <div>
      <div class="hero">
        <h1>Regulatory truth, <span class="grad">layer by layer</span></h1>
        <p>CLHEAR builds compliance from the ground up: immutable verbatim law at the bottom,
           derived knowledge above it — and every claim, at every layer, traceable back to the
           exact clause that justifies it.</p>
      </div>
      <div class="stackwrap">
        <div class="flowline"></div>
        ${ordered.map((l) => html`
          <div class="slab" key=${l.layer} onClick=${() => nav(`/layer/${l.slug}`)}>
            <div class="code">${l.layer}</div>
            <div>
              <h3>${l.name}</h3>
              <div class="purpose">${l.purpose}</div>
            </div>
            <div class="right">
              <${Led} status=${l.status} />
              <div class="countline">${countline(l.counts, HOME_COUNTS[l.layer])}</div>
            </div>
          </div>`)}
      </div>
    </div>`;
}

/* ------------------------------------------------- derivation ("reasoning") */

function ReasonPanel({ meta }) {
  const d = meta.derivation || {};
  const g = d.generation || {};
  return html`
    <div class="panel reasonpanel">
      <h4>How this layer knows what it knows</h4>
      <div class="method">${d.method}</div>
      ${g.nature && html`
        <div class="genbox">
          <h5>FIT-TO-PURPOSE · ${g.technique ? g.technique.split("—")[0] : "AI METHOD"}</h5>
          <div class="sum" style=${{ fontSize: "12.5px", marginBottom: "6px" }}><b>Nature.</b> ${g.nature}</div>
          <div class="sum" style=${{ fontSize: "12.5px", marginBottom: "6px" }}><b>Guarantee.</b> ${g.guarantee}</div>
          <div class="kv">
            ${(g.may || []).map((x, i) => html`<span class="chip" key=${"m"+i}>may: ${x}</span>`)}
            ${(g.must_not || []).map((x, i) => html`<span class="chip" key=${"n"+i} style=${{ color: "var(--rose-400)" }}>never: ${x}</span>`)}
          </div>
          <div class="provline" style=${{ marginTop: "8px", cursor: "pointer" }}
               onClick=${() => nav("/ops")}>see it live in AI Operations →</div>
        </div>`}
      ${(d.inputs || []).length > 0 && html`
        <h4>Derived from</h4>
        <div class="kv">
          ${d.inputs.map((code) => html`
            <span class="chip linky" key=${code} onClick=${() => nav(`/layer/${code.toLowerCase()}`)}>${code} ↧</span>`)}
        </div>`}
      ${(d.inputs || []).length === 0 && html`
        <h4>Derived from</h4>
        <div class="kv"><span class="chip">ground layer — nothing below</span></div>`}
      <h4>Human & eval gates</h4>
      <ul class="gatelist">${(d.gates || []).concat(g.gates || []).map((x, i) => html`<li key=${i}>${x}</li>`)}</ul>
      <h4>Evidence you can inspect</h4>
      <ul class="gatelist evidence">${(d.evidence || []).map((e, i) => html`<li key=${i}>${e}</li>`)}</ul>
    </div>`;
}

const StatusBanner = ({ banner }) => banner
  ? html`<div class="demobanner"><b>${(banner.data_status || "").toUpperCase()}</b><span>${banner.notice}</span></div>` : null;

/* ------------------------------------------------------------ layer items */

function ItemCard({ layer, item, onOpen }) {
  const title = item.title || item.name || item.area || item.id;
  const summary = item.summary || item.statement || item.description || item.definition || "";
  return html`
    <div class="card" onClick=${() => onOpen(item)}>
      <div class="id">${item.id}</div>
      <h5>${title}</h5>
      <div class="sum">${summary}</div>
      ${layer === "L3" && html`
        <div class="tags">
          ${(item.satisfies || []).map((sel, i) => html`
            <span class="chip" key=${i}>${sel.source_key} · ${(sel.refs || []).join(", ")}</span>`)}

function VoteButtons({ item, auth }) {
  const [tally, setTally] = useState(item.community || { confirm: 0, dispute: 0 });
  const [my, setMy] = useState(null);
  const [note, setNote] = useState("");
  const cast = async (vote, e) => {
    e.stopPropagation();
    if (!auth?.user) { nav(`/contribute`); return; }
    const r = await fetch(`/api/clhear/community/obligations/${encodeURIComponent(item.id)}/vote`, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ vote }),
    });
    if (!r.ok) return;
    const body = await r.json();
    setMy(vote);
    setTally({ confirm: body.confirm ?? tally.confirm, dispute: body.dispute ?? tally.dispute });
    if (body.queued) setNote("recorded — appears after the next snapshot publish");
    else setNote("");
  };
  return html`
    <div class="votebtns" onClick=${(e) => e.stopPropagation()}>
      <button class=${"votebtn confirm" + (my === "confirm" ? " on" : "")} onClick=${(e) => cast("confirm", e)}
              title=${auth?.user ? "This is a real obligation, correctly anchored" : "Sign in to validate"}>
        ✓ Confirm ${tally.confirm > 0 ? tally.confirm + (my === "confirm" && note ? "+1" : "") : ""}</button>
      <button class=${"votebtn dispute" + (my === "dispute" ? " on" : "")} onClick=${(e) => cast("dispute", e)}
              title=${auth?.user ? "Wrong, misanchored, or not an obligation" : "Sign in to dispute"}>
        ✗ Dispute ${tally.dispute > 0 ? tally.dispute : ""}</button>
      <span class="chip linky" onClick=${(e) => { e.stopPropagation(); sessionStorage.setItem("clhear_prefill", JSON.stringify({ kind: "correction", target_layer: "L2", target_id: item.id, title: `Correction: ${item.id}` })); nav("/contribute"); }}>⚑ flag</span>
      ${tally.promotion_suggested && html`<span class="chip" style=${{ color: "var(--mint-400)" }}>promotion suggested</span>`}
      ${note && html`<span class="provline">${note}</span>`}
    </div>`;
}

function ObligationCard({ item, onOpen, auth }) {

function ConceptCard({ concept, selected, onOpen }) {
  const facets = {};
  for (const m of concept.members || []) {
    (facets[m.jurisdiction || "?"] = facets[m.jurisdiction || "?"] || []).push(m);
  }
  const jurs = Object.keys(facets).sort();
  const covered = jurs.filter((j) => selected.size === 0 || selected.has(j));
  const excluded = jurs.filter((j) => selected.size > 0 && !selected.has(j));
  const weight = covered.reduce((n, j) => n + facets[j].length, 0);
  return html`
    <div class="card" onClick=${() => onOpen({ id: concept.id })}>
      <div class="id">${concept.id}
        <span class="led curated" style=${{ marginLeft: "8px" }}><i></i>${(concept.status || "").toUpperCase()}</span>
      </div>
      <h5>${concept.name}</h5>
      <div class="sum">${concept.canonical_statement}</div>
      <div class="tags" style=${{ marginTop: "10px" }}>
        ${covered.map((j) => html`
          <span class="chip" key=${j} style=${{ color: "var(--mint-400)", borderColor: "rgba(52,211,153,0.4)" }}>
            ${j} · ${facets[j].length} clause-anchored</span>`)}
        ${excluded.map((j) => html`
          <span class="chip" key=${j} style=${{ opacity: 0.45, textDecoration: "line-through" }}
                title="Not in your selected jurisdictions — this facet does not apply">${j} · ${facets[j].length}</span>`)}
        <span class="chip">resolved weight: ${weight} obligation${weight === 1 ? "" : "s"}</span>
      </div>
      <div class="provline" style=${{ marginTop: "8px" }}>
        drafted by ${concept.drafted_by}${concept.approved_by ? ` · approved by ${concept.approved_by}` : ""} ·
        scoped claim: covers the cited clauses for ${covered.join(", ") || "none of your jurisdictions"} — never "global".
      </div>
    </div>`;
}

function ConsolidatedView({ concepts, onOpen }) {
  const allJurs = [...new Set(concepts.flatMap((c) => c.jurisdictions || []))].sort();
  const [selected, setSelected] = useState(new Set());
  const toggle = (j) => {
    const next = new Set(selected);
    next.has(j) ? next.delete(j) : next.add(j);
    setSelected(next);
  };
  return html`
    <div>
      <div class="panel" style=${{ marginBottom: "14px" }}>
        <h4>View as — pick your entity's jurisdictions</h4>
        <div class="tags">
          ${allJurs.map((j) => html`
            <span class=${"chip linky" + (selected.has(j) ? " sel" : "")} key=${j} onClick=${() => toggle(j)}>${j}</span>`)}
          ${selected.size > 0 && html`<span class="chip linky" onClick=${() => setSelected(new Set())}>clear (show all)</span>`}
        </div>
        <div class="provline" style=${{ marginTop: "8px" }}>
          A consolidated CLHEAR obligation is exactly as heavy as the jurisdictions you select: a UK-only
          entity sees only UK facets; a US+EU+UK group gets the full union. Facets you don't select are
          crossed out — not silently merged into your build.
        </div>
      </div>
      ${concepts.length === 0 && html`<div class="spin">NO CONCEPTS YET — the nightly consolidation proposes candidates for maintainer review.</div>`}
      ${concepts.map((c) => html`<${ConceptCard} concept=${c} selected=${selected} key=${c.id} onOpen=${onOpen} />`)}
    </div>`;
}

function ObligationRegistry({ onOpen, auth }) {
  const [data, setData] = useState(null);
  const [q, setQ] = useState("");
  const [sourceKey, setSourceKey] = useState("");
  const [offset, setOffset] = useState(0);
  const [items, setItems] = useState([]);
  useEffect(() => {
    const params = new URLSearchParams();
    if (q) params.set("q", q);
    if (sourceKey) params.set("source_key", sourceKey);
    params.set("offset", String(offset));
    jget(`/api/clhear/layers/l2?${params}`).then((d) => {
      setData(d.registry);
      setItems((prev) => (offset === 0 ? d.registry.items : [...prev, ...d.registry.items]));
    }).catch(() => setData({ total: 0, items: [], per_source: [] }));
  }, [q, sourceKey, offset]);
  const search = (value) => { setQ(value); setOffset(0); };
  const pick = (key) => { setSourceKey(key === sourceKey ? "" : key); setOffset(0); };
  return html`
    <div>
      <div class="panel" style=${{ marginBottom: "14px" }}>
        <h4>Search the registry</h4>
        <input class="regsearch" placeholder="search obligations (e.g. due diligence, breach, safeguard)"
               value=${q} onInput=${(e) => search(e.target.value)} />
        <div class="tags" style=${{ marginTop: "10px", maxHeight: "92px", overflowY: "auto" }}>
          ${(data?.per_source || []).map((s) => html`
            <span class=${"chip linky" + (s.source_key === sourceKey ? " sel" : "")} key=${s.source_key}
                  onClick=${() => pick(s.source_key)}>${s.source_key} (${s.count})</span>`)}
        </div>
      </div>
      ${data === null && html`<div class="spin">DERIVING VIEW…</div>`}
      ${data && html`<div class="regmeta">${data.total} obligation(s)${sourceKey ? ` in ${sourceKey}` : ""}${q ? ` matching "${q}"` : ""} — machine-derived, basis-anchored</div>`}
      ${items.map((item) => html`<${ObligationCard} item=${item} key=${item.id} onOpen=${onOpen} auth=${auth} />`)}
      ${data && items.length < data.total && html`
        <button class="bigbtn" style=${{ width: "100%" }} onClick=${() => setOffset(items.length)}>
          Load more (${items.length} / ${data.total})
        </button>`}
    </div>`;
}

function LineageNode({ node, depth }) {
  const [open, setOpen] = useState(depth < 2);
  const isClause = node.kind === "clause";
  const meta = node.meta || {};
  const locked = isClause && meta.locked;
  return html`
    <div class="lnode ${node.layer === "L1" ? "l1" : ""} ${locked ? "locked" : ""}">
      <div class="laytag">${node.layer} · ${node.kind.replace("_", " ").toUpperCase()}</div>
      <h6>${node.title}</h6>
      ${node.detail && html`<div class="det">${node.detail}</div>`}
      ${isClause && meta.resolved && meta.text && html`
        <div class="verbatim">${meta.text}</div>
        <div class="provline">
          sha256 ${meta.text_hash} · ${meta.version_label} · retrieved ${String(meta.retrieved_at).slice(0, 19)}<br/>
          original: ${meta.s3_uri || "—"} · <a href=${meta.permalink}>open in Sources Explorer →</a>
        </div>`}
      ${isClause && meta.resolved && !meta.text && html`
        <div class="verbatim lockedtext">⛨ Verbatim text withheld — ${meta.license} license. Ref + hash prove the anchor without exposing the text.</div>
        <div class="provline">sha256 ${meta.text_hash || "—"} · ${meta.version_label || ""}</div>`}
      ${isClause && !meta.resolved && html`
        <div class="verbatim lockedtext">${meta.note || "not resolvable in this corpus snapshot"}</div>`}
      ${!isClause && meta.derivation && html`
        <div class="provline">derivation: ${meta.derivation.status || ""} · ${meta.derivation.method || ""}</div>`}
      ${node.kind === "live_input" && html`<div class="provline">computed live from l1_sources.change_events at request time</div>`}
      ${(node.children || []).length > 0 && html`
        <div style=${{ margin: "8px 0 2px" }}>
          <span class="foldbtn" onClick=${() => setOpen(!open)}>
            ${open ? "▾ collapse" : `▸ expand ${node.children.length} underlying node${node.children.length > 1 ? "s" : ""}`}
          </span>
        </div>
        ${open && node.children.map((c, i) => html`<${LineageNode} node=${c} depth=${depth + 1} key=${i} />`)}`}
    </div>`;
}

function Drawer({ layer, item, onClose }) {
  const [chain, setChain] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    setChain(null);
    jget(`/api/clhear/layers/${layer.toLowerCase()}/items/${encodeURIComponent(item.id)}/lineage`)
      .then((d) => setChain(d.lineage)).catch((e) => setErr(String(e)));
  }, [layer, item.id]);
  return html`
    <div>
      <div class="scrim" onClick=${onClose}></div>
      <div class="drawer">
        <header>
          <h3>Lineage — why does this exist?</h3>
          <span class="x" onClick=${onClose}>✕</span>
        </header>
        <div class="body">
          ${err && html`<div class="demobanner">${err}</div>`}
          ${!chain && !err && html`<div class="spin">TRACING…</div>`}
          ${chain && html`<${LineageNode} node=${chain} depth=${0} />`}
          ${chain && html`<div class="provline" style=${{ marginTop: "14px" }}>
            Every chain terminates in L1: verbatim clause text (open sources), or ref + hash (restricted).
            Nothing above L1 is ever the source of truth.</div>`}
        </div>
      </div>
    </div>`;
}

function SignIn({ auth, onDone }) {
  const [email, setEmail] = useState("");
  const [state, setState] = useState("idle"); // idle | sending | sent | error
  const [debugLink, setDebugLink] = useState(null);
  const send = async () => {
    setState("sending");
    const r = await fetch("/auth/email", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email, website: "" }),
    });
    if (!r.ok) { setState("error"); return; }
    const body = await r.json();
    if (body.debug_link) setDebugLink(body.debug_link);
    setState("sent");
  };
  return html`
    <div class="panel" style=${{ maxWidth: "480px" }}>
      <h4>Join the movement</h4>
      <p style=${{ fontSize: "13.5px", color: "var(--muted)", marginTop: 0 }}>
        Compliance officer, lawyer, PM or developer — no GitHub account needed.
        Sign in to open cases and validate outputs.</p>
      ${state !== "sent" && html`
        <input class="regsearch" type="email" placeholder="you@company.com"
               value=${email} onInput=${(e) => setEmail(e.target.value)}
               onKeyDown=${(e) => e.key === "Enter" && send()} />
        <div style=${{ display: "flex", gap: "10px", marginTop: "12px", flexWrap: "wrap" }}>
          <button class="bigbtn" disabled=${state === "sending" || !email.includes("@")} onClick=${send}>
            ${state === "sending" ? "Sending…" : "Email me a sign-in link"}
          </button>
          ${auth.providers.google
            ? html`<a class="bigbtn" style=${{ background: "var(--panel-strong)", color: "var(--ink)", border: "1px solid var(--edge)" }} href="/auth/google">Continue with Google</a>`
            : html`<span class="chip" title="Google OAuth client not configured yet">Google — coming online</span>`}
          ${!auth.providers.apple && html`<span class="chip" title="Requires an Apple Developer Service ID">Apple — coming online</span>`}
        </div>
        ${state === "error" && html`<div class="demobanner" style=${{ marginTop: "10px" }}>Could not send — try again.</div>`}`}
      ${state === "sent" && html`
        <div style=${{ color: "var(--mint-400)", fontSize: "14px" }}>
          ✓ Check your inbox — the link expires in 15 minutes.
          ${debugLink && html`<div class="provline"><a href=${debugLink}>dev: open the link</a></div>`}
        </div>`}
      <div class="provline" style=${{ marginTop: "14px" }}>
        By contributing you accept the <a href="/terms">contribution license (CC BY 4.0 + DCO)</a>.
      </div>
    </div>`;
}

const CASE_KINDS = [
  ["missing_data", "Missing data", "A source we cover is missing a version, clause, or amendment"],
  ["correction", "Correction", "Something derived or curated is wrong — tell us what and why"],
  ["new_source", "New verbatim source", "A law, regulation or standard CLHEAR should track"],

function CaseForm({ prefill, onSubmitted }) {
  const [kind, setKind] = useState(prefill?.kind || "correction");
  const [title, setTitle] = useState(prefill?.title || "");
  const [body, setBody] = useState("");
  const [evidence, setEvidence] = useState("");
  const [state, setState] = useState("idle");
  const [note, setNote] = useState("");
  const submit = async () => {
    setState("sending");
    const r = await fetch("/api/clhear/community/submissions", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        kind, title, body, evidence_url: evidence, website: "",
        target_layer: prefill?.target_layer || "", target_id: prefill?.target_id || "",
      }),
    });
    if (!r.ok) { setState("error"); setNote((await r.json()).detail || ""); return; }
    const out = await r.json();
    setNote(out.note || "Case opened — a maintainer will review it.");
    setState("done");
    onSubmitted && onSubmitted();
  };
  if (state === "done") return html`<div class="panel"><h4>Thank you</h4>
    <div style=${{ color: "var(--mint-400)", fontSize: "14px" }}>✓ ${note}</div></div>`;
  return html`
    <div class="panel">
      <h4>Open a case ${prefill?.target_id ? html`<span class="chip">on ${prefill.target_id}</span>` : ""}</h4>
      <div class="tags" style=${{ marginBottom: "12px" }}>
        ${CASE_KINDS.map(([k, label, hint]) => html`
          <span class=${"chip linky" + (kind === k ? " sel" : "")} key=${k} title=${hint}
                onClick=${() => setKind(k)}>${label}</span>`)}
      </div>
      <input class="regsearch" placeholder="One-line summary (5-200 chars)" value=${title}
             onInput=${(e) => setTitle(e.target.value)} />
      <textarea class="regsearch" rows="4" style=${{ marginTop: "10px", resize: "vertical", fontFamily: "inherit" }}
                placeholder="Details: what is missing/wrong, why it matters, how you know. Never paste licensed standard text (ISO/TSC/PCI/IFRS)."
                value=${body} onInput=${(e) => setBody(e.target.value)}></textarea>
      <input class="regsearch" style=${{ marginTop: "10px" }} placeholder="Evidence link (official URL, optional)"
             value=${evidence} onInput=${(e) => setEvidence(e.target.value)} />
      <div style=${{ marginTop: "12px" }}>
        <button class="bigbtn" disabled=${title.trim().length < 5 || state === "sending"} onClick=${submit}>
          ${state === "sending" ? "Submitting…" : "Submit case"}</button>
      </div>
      ${state === "error" && html`<div class="demobanner" style=${{ marginTop: "10px" }}>${note || "Could not submit."}</div>`}
    </div>`;
}

      <div class="statgrid">
        <div class="stat"><div class="n">${(data.dashboard && data.dashboard.llm_calls) || 0}</div><div class="lbl">llm calls</div></div>
        <div class="stat"><div class="n">${(data.dashboard && data.dashboard.ai_ops) || 0}</div><div class="lbl">ops entries</div></div>
        <div class="stat"><div class="n">$${(data.dashboard && data.dashboard.frontier_spend_usd) || 0}</div><div class="lbl">frontier spend</div></div>
      </div>
      <div class="kv" style=${{ margin: "12px 0" }}>
        ${kinds.map((k) => html`<span class=${"chip linky" + (kind === k ? " sel" : "")} key=${k} onClick=${() => setKind(k)}>${k}</span>`)}
      </div>
      ${vis.map((i) => html`
        <div class="opsitem" key=${i.id}>
          <div class="why">${i.reasoning}</div>
          <div class="provline">${i.ts} · ${i.kind} · ${i.layer} · ${i.fleet}</div>
          <details><summary class="mono">detail</summary><pre class="codeblock">${JSON.stringify(i.detail, null, 2)}</pre></details>
        </div>`)}
    </div>`;
}

function EvalPage({ auth }) {
  const [data, setData] = useState(null);
  const [note, setNote] = useState("");
  const load = () => jget("/api/clhear/eval").then(setData).catch(() => setData(null));
  useEffect(() => { load(); }, [auth.user]);
  const vote = async (id, agrees) => {
    const r = await fetch(`/api/clhear/eval/${id}/vote`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ agrees, comment: agrees ? "agree" : "disagree" }),
    });
    if (!r.ok) { setNote("Sign in to vote."); return; }
    setNote(agrees ? "Recorded — credited as a confirmation." : "Disagreement opened a correction case.");
    load();
  };
  if (!data) return html`<div class="spin">LOADING EVAL STUDIO…</div>`;
  const bench = data.scores && data.scores.by_layer || {};
  return html`
    <div>
      <div class="hero" style=${{ margin: "10px 0 26px" }}>
        <h1>Eval <span class="grad">Studio</span></h1>
        <p>Sampled tasks, human vs AI. Agreement scores feed the router quality table.</p>
      </div>
      ${note && html`<div class="demobanner">${note}</div>`}
      <div class="bench" style=${{ marginBottom: "18px" }}>
        ${Object.entries(bench).map(([ly, s]) => html`
          <div class="benchrow" key=${ly}><b>${ly}</b>
            <div class="bar"><i style=${{ width: Math.round((s.score || 0) * 100) + "%" }}></i></div>
            <span class="chip">${Math.round((s.score || 0) * 100)}% · ${s.n}</span></div>`)}
      </div>
      ${(data.open || []).map((t) => html`
        <div class="panel" key=${t.id} style=${{ marginBottom: "12px" }}>
          <div class="id">${t.layer} · ${t.kind} · ${t.subject_ref}</div>
          <h5>${t.prompt}</h5>
          <pre class="codeblock">${JSON.stringify(t.ai_output, null, 2).slice(0, 800)}</pre>
          <div class="votebtns">
            <button class="votebtn confirm" onClick=${() => vote(t.id, true)}>Agree with AI</button>
            <button class="votebtn dispute" onClick=${() => vote(t.id, false)}>Disagree — open correction</button>
          </div>
        </div>`)}
      ${(data.open || []).length === 0 && html`<div class="sum">No open eval tasks in this snapshot — the nightly fleet seeds them.</div>`}
    </div>`;
}

            <li>Send <span class="chip">X-App-Id</span> + <span class="chip">Authorization: Bearer …</span> on every call.</li>
            <li>Feature-detect via <span class="chip">GET /v1/layers</span> — branch on <b>layer_status</b>

            <li>Interactive OpenAPI schema at <a href="/docs" target="_blank">/docs</a> ·

          </ol>
        </div>

          <h4>The blueprint call</h4>
          <pre class="codeblock">POST /v1/blueprint
{
  "attributes": {
    "jurisdictions": ["EU"],
    "authorisations": ["CASP (MiCA)"],

}</pre>
          <div class="sum" style=${{ fontSize: "12.5px" }}>
            Returns triggered obligations (basis-anchored, status-labeled), recommended blocks,
            a coverage matrix with explicit gaps, release pin, per-source attributions and the

        </div>
      </div>
      <div class="panel" style=${{ marginTop: "18px" }}>
        <h4>Read endpoints</h4>
        <div class="covrow"><span class="ob">GET /v1/layers</span><span class="sum" style=${{ flex: 2 }}>the 8-layer contract: statuses + derivation contracts</span></div>
        <div class="covrow"><span class="ob">GET /v1/releases/latest</span><span class="sum" style=${{ flex: 2 }}>current release manifest</span></div>
        <div class="covrow"><span class="ob">GET /v1/releases/{"{id}"}/l1/families · /sources · /clauses · /change-events · /snapshot</span><span class="sum" style=${{ flex: 2 }}>the verbatim corpus</span></div>
        <div class="covrow"><span class="ob">GET /v1/releases/{"{id}"}/l2/obligations</span><span class="sum" style=${{ flex: 2 }}>the derived obligation registry</span></div>

/* -------------------------------------------------------------------- app */

function App() {
  const route = useHashRoute();
  const [theme, toggleTheme] = useTheme();
  const [auth, refreshAuth] = useAuth();
  const [layers, setLayers] = useState(null);
  useEffect(() => { jget("/api/clhear/layers").then((d) => setLayers(d.layers)).catch(() => setLayers([])); }, []);
  const layerMatch = route.match(/^\/layer\/(l[0-8])$/);
  const page = route.startsWith("/contribute") ? "contribute"
    : route.startsWith("/how") ? "how"
    : route.startsWith("/docs") ? "docs"
    : route.startsWith("/team") ? "team"
    : route.startsWith("/ops") ? "ops"
    : route.startsWith("/eval") ? "eval"
    : layerMatch ? "layer" : "home";
  let prefill = null;
  try { prefill = JSON.parse(sessionStorage.getItem("clhear_prefill") || "null"); } catch {}
  if (page !== "contribute") sessionStorage.removeItem("clhear_prefill");
  return html`
    <div>
      <header class="appbar">
        <div class="wordmark" onClick=${() => nav("/")}>
          <b>CLHEAR</b><span>the compliance stack</span>
        </div>
        <div class="spacer"></div>
        <span class=${"navlink" + (page === "home" || page === "layer" ? " active" : "")} onClick=${() => nav("/")}>Stack</span>
        <a class="navlink" href="/sources">Explorer</a>
        <span class=${"navlink" + (page === "how" ? " active" : "")} onClick=${() => nav("/how")}>How it works</span>
        <span class=${"navlink" + (page === "team" ? " active" : "")} onClick=${() => nav("/team")}>Team</span>
        <span class=${"navlink" + (page === "ops" ? " active" : "")} onClick=${() => nav("/ops")}>AI Ops</span>
        <span class=${"navlink" + (page === "eval" ? " active" : "")} onClick=${() => nav("/eval")}>Eval</span>
        <span class=${"navlink" + (page === "docs" ? " active" : "")} onClick=${() => nav("/docs")}>API</span>
        <span class=${"navlink" + (page === "contribute" ? " active" : "")} onClick=${() => nav("/contribute")}>
          ${auth.user ? `☺ ${auth.user.display_name}` : "Contribute"}</span>
        <button class="themebtn" onClick=${toggleTheme}>${theme === "dark" ? "◐ pearl" : "◑ dark"}</button>
      </header>
      <main>
        ${page === "contribute" && html`<${ContributePage} auth=${auth} refreshAuth=${refreshAuth} prefill=${prefill} />`}
        ${page === "how" && html`<${HowPage} />`}
        ${page === "team" && html`<${TeamPage} />`}
        ${page === "ops" && html`<${OpsPage} />`}
        ${page === "eval" && html`<${EvalPage} auth=${auth} />`}
        ${page === "docs" && html`<${DocsPage} />`}
        ${page === "layer" && html`<${LayerPage} slug=${layerMatch[1]} key=${layerMatch[1]} auth=${auth} />`}
        ${page === "home" && (layers === null
          ? html`<div class="spin">BOOTING THE STACK…</div>`
          : html`<${Home} layers=${layers} />`)}
      </main>
      <footer class="sitefoot">
        <span>CLHEAR by Reg42 — the open compliance stack.</span>
        <a href="/disclaimer">Disclaimer</a>
        <a href="/terms">Terms</a>
        <a href="#/how" onClick=${() => nav("/how")}>How it works</a>
        <a href="https://github.com/Reg42-ai/CLHEAR-MVP" target="_blank" rel="noopener">GitHub</a>
        <span style=${{ flex: 1 }}></span>
        <span>Not legal advice. Verify against the official source linked with every clause.</span>
      </footer>
    </div>`;
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
