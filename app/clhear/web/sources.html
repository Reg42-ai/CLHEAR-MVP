<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLHEAR · L1 Sources</title>
<link rel="stylesheet" href="/static/theme.css" />
<style>
  /* Page-specific styles; shared tokens + chrome live in /static/theme.css.
     Alias block: legacy token names → dark-glass tokens (identical in both themes;
     the underlying tokens flip via [data-theme="light"] in theme.css). */
  :root, [data-theme="light"] {
    --indigo-900: var(--ind-900); --indigo-700: var(--accent); --indigo-500: var(--ind-500);
    --indigo-100: rgba(129,140,248,0.16);
    --pearl: var(--panel); --pearl-dark: var(--edge);
    --mint-100: rgba(52,211,153,0.14); --rose-100: rgba(251,113,133,0.14); --amber-100: rgba(251,191,36,0.14);
    --mint-600: var(--ok); --rose-600: var(--bad); --amber-600: var(--warn);
  }
  main { position: relative; z-index: 1; max-width: 1600px; margin: 24px auto; padding: 0 20px 60px; }
  header.appbar input {
    border: 1px solid var(--edge); border-radius: 8px; padding: 7px 12px; font-size: 13px;
    width: 340px; background: var(--panel-strong); color: var(--ink);
  }
  header.appbar input::placeholder { color: var(--faint); }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .crumbs a { cursor: pointer; }
  .family { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
            padding: 18px 20px; margin-bottom: 16px; }
  .family h2 { margin: 0 0 4px; font-size: 16px; }
  .charter { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .schedbar { font-size: 12.5px; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px; margin: 8px 0 16px; }
  .scheditem { display: inline-block; margin: 2px 10px 2px 0; padding: 2px 8px; border: 1px solid var(--edge); border-radius: 999px; background: var(--panel-strong); white-space: nowrap; }
  table.members { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.members th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
                     padding: 6px 8px; border-bottom: 1px solid var(--edge); }
  table.members td { padding: 8px; border-bottom: 1px solid var(--edge); vertical-align: top; }
  .srcname { cursor: pointer; color: var(--indigo-700); font-weight: 600; }
  .srcname.stub { color: var(--ink); font-weight: 500; cursor: default; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; white-space: nowrap; }
  .badge.open { background: var(--mint-100); color: var(--mint-600); }
  .badge.restricted { background: var(--rose-100); color: var(--rose-600); }
  .badge.binding { background: var(--indigo-100); color: var(--indigo-700); }
  .badge.guidance { background: var(--amber-100); color: var(--amber-600); }
  .badge.citator { background: var(--amber-100); color: var(--amber-600); }
  .badge.root { background: var(--ind-800); color: var(--ind-100); border: 1px solid var(--edge); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .meta-grid { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--muted);
               margin: 8px 0 16px; }
  .meta-grid b { color: var(--ink); font-weight: 600; }
  .locked { background: var(--rose-100); border: 1px solid rgba(251,113,133,0.35); border-radius: 10px;
            padding: 14px 18px; color: var(--bad); margin-bottom: 12px; font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 46px 0; }
  .result { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
            padding: 12px 16px; margin-bottom: 10px; cursor: pointer; }
  .result:hover { border-color: var(--edge-bright); }
  .result .where { font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  .result mark { background: rgba(129,140,248,0.28); color: var(--ink); border-radius: 3px; padding: 0 2px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button { border: 1px solid var(--edge); background: var(--panel); border-radius: 999px;
                 padding: 6px 16px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .tabs button.active { background: linear-gradient(92deg, var(--ind-700), var(--ind-500));
                        border-color: var(--ind-500); color: white; }
  .change { background: var(--panel); border: 1px solid var(--edge); border-left: 4px solid var(--ok);
            border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; font-size: 13.5px; }

  /* ---------------------- current text + provenance ------------------------ */

  .toc { position: sticky; top: 72px; width: 300px; flex-shrink: 0; max-height: calc(100vh - 100px);

  .toc a:hover { background: var(--indigo-100); color: var(--accent); }

  .readerbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .readerbar input { border: 1px solid var(--edge); border-radius: 8px; padding: 6px 12px;
                     font-size: 13px; width: 300px; background: var(--panel-strong); color: var(--ink); }
  .readerbar .count { font-size: 12px; color: var(--muted); }
  .catchip { border: 1px solid var(--edge); background: var(--panel); border-radius: 999px;

  .annot { margin: 4px 0 10px; padding: 8px 12px; background: var(--panel-strong); border-left: 3px solid var(--ind-500);

  /* ------------------------------ document view ------------------------------ */
  .layout { display: flex; gap: 22px; align-items: flex-start; }

  .n { position: relative; border-radius: 3px; }

  .n.amended { background: var(--amber-100); }
  .n.selected { outline: 2px solid var(--ind-500); outline-offset: 2px; }
  .n.title { text-align: center; font-weight: 700; margin: 6px 0; }
  .n.title.docfirst { font-size: 17px; letter-spacing: 0.01em; }
  .n.part { margin: 34px 0 10px; text-align: center; font-family: -apple-system, "Segoe UI", sans-serif;

  .n.chapter { margin: 30px 0 8px; text-align: center; }
  .n.chapter .lab { display: block; font-family: -apple-system, "Segoe UI", sans-serif;
                    font-size: 15px; letter-spacing: 0.14em; font-weight: 600; color: var(--accent); }
  .n.chapter .hd { display: block; font-size: 17px; font-weight: 700; font-style: italic; }
  .n.group { margin: 22px 0 6px; text-align: center; }
  .n.group .lab { display: block; font-size: 13.5px; letter-spacing: 0.12em; font-weight: 600; color: var(--muted); }
  .n.group .hd { display: block; font-size: 15.5px; font-weight: 700; font-style: italic; }
  .n.heading { margin: 18px 0 6px; font-size: 15.5px; font-weight: 700;

  .n.schedule { margin: 36px 0 10px; text-align: center; }
  .n.schedule .lab { display: block; font-size: 14px; letter-spacing: 0.1em; font-weight: 700; }

  .n.article { margin: 22px 0 6px; text-align: center; }
  .n.article .lab { display: block; font-weight: 700; }

  .n.provision, .n.section, .n.control, .n.enhancement { margin: 14px 0 4px; }
  .n.provision .hd, .n.section .hd, .n.control .hd, .n.enhancement .hd { font-weight: 700; }
  .n.subsection { margin: 8px 0 2px; }
  .n.subsection .hd { font-weight: 700; font-size: 15px; }
  .n.paragraph, .n.subparagraph, .n.statement { margin: 4px 0; }
  .n.point { margin: 3px 0; }
  .n.recital { margin: 5px 0; }
  .n.recital .lab, .n.point .lab { display: inline-block; min-width: 2.4em; font-weight: 400; }
  .n.preamble { margin: 6px 0; }
  .n.signature { margin: 14px 0 2px; font-style: italic; }
  .n.note { margin: 4px 0; font-size: 13.5px; color: var(--muted); }
  .lab { font-weight: 700; margin-right: 0.55em; font-variant-numeric: lining-nums; }
  .hd { font-weight: 600; }
  .float {
    position: absolute; top: -11px; right: 0; z-index: 2;
    font: 11px/1.3 ui-monospace, Menlo, monospace; background: var(--ind-800); color: var(--ind-100);
    border: 1px solid var(--edge); border-radius: 6px; padding: 3px 8px;
    pointer-events: none; white-space: nowrap;
  }
  .inspector {
    position: sticky; top: 72px; width: 380px; flex-shrink: 0;
    max-height: calc(100vh - 100px); overflow-x: hidden; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    padding: 16px 18px; font-size: 13px;

  .inspector h3 { margin: 0 0 8px; font-size: 14px; }
  .inspector dt { color: var(--muted); font-size: 11.5px; margin-top: 8px; }

  .inspector button { border: 1px solid var(--edge-bright); color: var(--accent); background: var(--panel);
                      border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; margin-top: 10px; }
  .mode { margin-bottom: 12px; }

  /* ------------------------------ activity feed ------------------------------ */
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }

  .dayhead { margin: 20px 0 8px; font-size: 12.5px; font-weight: 700; color: var(--muted);
             text-transform: uppercase; letter-spacing: 0.06em; }
  .act { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
         padding: 10px 14px; margin-bottom: 8px; font-size: 13.5px; display: flex;
         align-items: flex-start; gap: 8px; }
  .act .fleetbadge { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
                     background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 6px;
                     padding: 2px 8px; white-space: nowrap; }
  .act .when { color: var(--muted); font-size: 12px; white-space: nowrap; margin-left: auto; }
  .act .body { flex: 1; min-width: 0; }
  .act .links a { margin-right: 10px; cursor: pointer; font-size: 12.5px; }
  .act details { margin-top: 4px; }
  .act details pre { background: var(--panel-strong); border-radius: 8px; padding: 8px 10px; font-size: 11.5px;
                     overflow: auto; max-height: 220px; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--edge); background: var(--panel); border-radius: 999px;

  .filters button.on { border-color: var(--edge-bright); color: var(--accent); font-weight: 600; }

  /* ------------------------------ fleet view -------------------------------- */
  table.fleet { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel);
                border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; }
  table.fleet th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px;

  table.fleet td { padding: 10px 12px; border-bottom: 1px solid var(--edge); vertical-align: middle; }
  .stagechip { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 11px;

  .stagechip.success { background: var(--mint-100); color: var(--ok); }

  .rolecard { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 18px; }

  .recordbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  @media (max-width: 960px) { .layout { flex-wrap: wrap; } .toc { position: static; width: 100%; max-height: 200px; box-sizing: border-box; } .doc { max-width: none; } .inspector { position: static; width: 100%; max-height: none; box-sizing: border-box; } header.appbar input { width: 210px; } }
  @media (max-width: 600px) { main { padding: 0 12px 40px; } .doc { padding: 20px 16px; } .curbadge { flex-wrap: wrap; } .meta-grid { gap: 8px; overflow-wrap: anywhere; } }
</style>

<!-- no-build frontend: React 18 + htm, per repo convention -->
<script type="module">
import React, { useState, useEffect, useRef } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(React.createElement);
const api = async (p) => {
  const r = await fetch(p, { credentials: "same-origin" });
  if (!r.ok) {
    const message = r.status === 401 ? "Sign in to access this L1 workspace." : r.status === 403 ? "Your account does not have access to this record." : r.status === 404 ? "This source, version or record was not found." : `Unable to load this record (${r.status}).`;
    const error = new Error(message); error.status = r.status; throw error;
  }
  return r.json();
};
const ws = (s) => (s || "").split(/\s+/).join(" ").trim();
const sourcePath = (key) => `/api/clhear/sources/${key.split("/").map(encodeURIComponent).join("/")}`;
function sourceUrl(key, version, nodeId, ref) {
  const q = new URLSearchParams({ source: key });
  if (version) q.set("version", version);
  if (nodeId) q.set("node", String(nodeId));
  if (ref) q.set("ref", ref);
  return `/l1?${q}`;
}
function recordMatches(info, sourceKey, doc) {
  return info && info.source_key === sourceKey && info.version_label === doc.version &&
    (doc.source_version_id == null || info.source_version_id == null || info.source_version_id === doc.source_version_id);
}
function ErrorNotice({ error }) {
  return html`<div class="locked" role="alert">${error.message || String(error)}${error.status === 401 && html` <a href="/signin">Sign in →</a>`}</div>`;
}

let _meta = null;
const getMeta = () => (_meta ? Promise.resolve(_meta) : api("/api/clhear/meta").then((m) => (_meta = m)));
const kindLabel = (meta, kind) => (meta && meta.version_kinds && meta.version_kinds[kind] ? meta.version_kinds[kind].label : kind);
const kindDef = (meta, kind) => (meta && meta.version_kinds && meta.version_kinds[kind] ? meta.version_kinds[kind].definition : "");

function initialView() {
  const p = new URLSearchParams(location.search);
  if (p.get("source")) {
    return { page: "source", key: p.get("source"), nodeId: p.get("node") ? Number(p.get("node")) : null, ref: p.get("ref"), version: p.get("version") || p.get("version_label") };
  }
  if (p.get("view")) return { page: p.get("view") };
  return { page: "library" };
}

function useTheme() {
  const [theme, setTheme] = useState(localStorage.getItem("clhear_theme") || "dark");
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem("clhear_theme", theme);
  }, [theme]);
  return [theme, () => setTheme(theme === "dark" ? "light" : "dark")];
}

function App() {
  const [view, setView] = useState(initialView);
  const [families, setFamilies] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [query, setQuery] = useState("");
  const [theme, toggleTheme] = useTheme();

  useEffect(() => { api("/api/clhear/sources").then(setFamilies).catch(setLoadError); }, []);
  useEffect(() => {
    const input = document.getElementById("q");
    const handler = (e) => {
      if (e.key === "Enter" && input.value.trim().length >= 2) {
        setQuery(input.value.trim());
        setView({ page: "search" });
      }
    };
    input.addEventListener("keydown", handler);
    const home = document.getElementById("home");
    const goHome = () => { history.replaceState({}, "", "/l1"); setView({ page: "library" }); };
    home.addEventListener("click", goHome);
    return () => { input.removeEventListener("keydown", handler); home.removeEventListener("click", goHome); };
  }, []);

  const openSource = (key, ref, nodeId, version) => {
    history.replaceState({}, "", sourceUrl(key, version, nodeId, ref));
    setView({ page: "source", key, ref, version, nodeId: nodeId || null });
  };
  const go = (page) => {
    history.replaceState({}, "", page === "library" ? "/l1" : `/l1?view=${page}`);
    setView({ page });
  };

  let page;
  if (loadError) page = html`<${ErrorNotice} error=${loadError} />`;
  else if (families === null) page = html`<div class="spin">Loading corpus…</div>`;
  else {
    const tabs = html`
      <div class="tabs">
        <button class=${view.page === "library" || view.page === "source" ? "active" : ""} onClick=${() => go("library")}>Sources</button>
        <button class=${view.page === "fleet" || view.page === "activity" ? "active" : ""} onClick=${() => go("fleet")}>Fleet</button>
        <button class=${view.page === "evidence" ? "active" : ""} onClick=${() => go("evidence")}>Evals</button>
        <button class=${view.page === "changes" ? "active" : ""} onClick=${() => go("changes")}>Changes</button>
      </div>`;
    if (view.page === "source") page = html`<div>${tabs}<${SourceView} key=${view.key + (view.version || "") + (view.nodeId || "")} sourceKey=${view.key} back=${() => go("library")} openRef=${view.ref} openNodeId=${view.nodeId} initialVersion=${view.version} /></div>`;
    else if (view.page === "search") page = html`<${SearchView} q=${query} open=${openSource} back=${() => go("library")} />`;
    else if (view.page === "changes") page = html`<div>${tabs}<${ChangesView} open=${openSource} /></div>`;
    else if (view.page === "activity") page = html`<div>${tabs}<${ActivityView} open=${openSource} /></div>`;
    else if (view.page === "fleet") page = html`<div>${tabs}<${FleetView} open=${openSource} /></div>`;
    else if (view.page === "evidence") page = html`<div>${tabs}<${EvidenceIndex} families=${families} open=${openSource} /></div>`;
    else page = html`<div>${tabs}<${Library} families=${families} open=${openSource} /></div>`;
  }
  return html`
    <div>
      <header class="appbar">
        <div class="wordmark" id="home">
          <b>CLHEAR</b><span>L1 · sources</span>
        </div>
        <input id="q" aria-label="Search verbatim clause text" placeholder="Search verbatim clause text (e.g. customer due diligence)…" />
        <div class="spacer"></div>
        <a class="navlink" href="/">Start</a><a class="navlink" href="/stack">Stack</a>
        <span class="navlink active">L1 Sources</span>
        <a class="navlink" href="/review">Review</a>
        <button class="themebtn" onClick=${toggleTheme}>${theme === "dark" ? "◐ pearl" : "◑ dark"}</button>
      </header>
      <main id="main"><h1 class="visually-hidden">Sources</h1>${page}</main>
    </div>`;
}

function Library({ families, open }) {
  const [meta, setMeta] = useState(_meta);
  useEffect(() => { getMeta().then(setMeta).catch(() => {}); }, []);
  const allMembers = families.flatMap((f) => f.members);
  const ingested = allMembers.filter((m) => m.library_status === "ingested" || m.latest_version);
  const failed = allMembers.filter((m) => m.library_status === "failed-today");
  const never = allMembers.filter((m) => m.library_status === "never-fetched" || m.library_status === "schedule-missed");
  const locked = allMembers.filter((m) => m.library_status === "locked-restricted");
  return html`
    <div>
      ${meta && meta.schedules && html`
        <div class="schedbar">
          <strong>Configured schedules</strong> · recorded execution is shown in Fleet
          ${Object.entries(meta.schedules).map(([k, s]) => html`
            <span class="scheditem" key=${k} title=${s.covers}>
              <span class="mono">${k}</span> ${s.cadence} · ${s.utc_time} UTC
            </span>`)}
        </div>`}
      ${families.length === 0 && html`<div class="empty">No sources ingested yet.</div>`}
      ${families.map((f) => html`
        <div class="family" key=${f.key}>
          <h2>${f.name}</h2>
          ${f.scope_charter && f.scope_charter.binding && html`
            <div class="charter">charter — binding: ${f.scope_charter.binding}${f.scope_charter.out ? ` · out of scope: ${[].concat(f.scope_charter.out).join(", ")}` : ""}</div>`}
          ${f.scope_charter && f.scope_charter.registry && html`
            <div class="charter">${f.scope_charter.registry}${f.scope_charter.partner ? ` · partner: ${f.scope_charter.partner}` : ""}</div>`}
          <table class="members">
            <thead><tr><th>source</th><th>relation</th><th>tier</th><th>license</th><th>version</th><th>clauses</th><th>added via</th></tr></thead>
            <tbody>
            ${f.members.map((m) => html`
              <tr key=${m.key}>
                <td>
                  <a class="srcname" title=${m.name} href=${sourceUrl(m.key, m.latest_version)}
                        onClick=${(e) => { e.preventDefault(); open(m.key, null, null, m.latest_version); }}>${m.short_name || m.name}</a>
                  ${m.short_name && html`<div class="charter" style=${{ margin: 0 }}>${m.name}</div>`}
                  <div class="mono">${m.key}</div>
                  ${m.about && html`<div class="about" style=${{ margin: "4px 0 0" }}>${m.about.slice(0, 220)}${m.about.length > 220 ? "…" : ""}
                    ${(m.topics || []).map((t) => html`<span class="topic" key=${t}>${t}</span>`)}</div>`}
                </td>
                <td><span class="badge ${m.relation === "root" ? "root" : "binding"}">${m.relation}</span></td>
                <td><span class="badge ${m.tier}">${m.tier}</span></td>
                <td><span class="badge ${m.license}">${m.license}</span></td>
                <td class="mono">${m.latest_version || m.library_status || "never-fetched"}</td>
                <td class="mono">${m.clauses ?? "—"}</td>
                <td>${m.added_via === "citator" ? html`<span class="badge citator">citator</span>` : m.added_via}</td>
              </tr>`)}
            </tbody>
          </table>
        </div>`)}
      <div class="charter" style=${{ textAlign: "center" }}>
        ${ingested.length} ingested · ${failed.length} failed-today · ${never.length} never-fetched · ${locked.length} locked-restricted
        · scope is the source registry; inspect each version’s recorded evidence in Evals.
      </div>
    </div>`;
}

/* ------------------------------- document view ------------------------------ */
function SourceView({ sourceKey, back, openRef, openNodeId, initialVersion }) {
  const [detail, setDetail] = useState(null);
  const [doc, setDoc] = useState(null);
  const [version, setVersion] = useState(initialVersion || null);
  const [inspect, setInspect] = useState(true);
  const [evidence, setEvidence] = useState(false);
  const [scorecard, setScorecard] = useState(null);
  const [hoverId, setHoverId] = useState(null);
  const [selectedId, setSelectedId] = useState(openNodeId || null);
  const [info, setInfo] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [infoError, setInfoError] = useState(null);
  const [scoreError, setScoreError] = useState(null);
  const [meta, setMeta] = useState(_meta);
  const [legend, setLegend] = useState(false);
  const [explain, setExplain] = useState(false);
  const [filter, setFilter] = useState("");
  const [category, setCategory] = useState(null);
  const scrolled = useRef(false);
  const nodeCache = useRef(new Map());
  const activeId = hoverId || selectedId;
  const chooseVersion = (label) => {
    const next = label || ((detail && detail.versions) || []).find((v) => v.status === "in_force")?.version_label || null;
    setSelectedId(null); setHoverId(null); setInfo(null); setVersion(next);
    history.replaceState({}, "", sourceUrl(sourceKey, next));
  };
  const pinNode = (id) => {
    setInspect(true); setSelectedId(id);
    history.replaceState({}, "", sourceUrl(sourceKey, doc.version, id));
  };

  useEffect(() => { getMeta().then(setMeta).catch(() => {}); }, []);
  useEffect(() => {
    let cancelled = false;
    setDetail(null); setDoc(null); setLoadError(null); setInfo(null); setInfoError(null);
    setScorecard(null); setScoreError(null); nodeCache.current.clear();
    scrolled.current = false; setFilter(""); setCategory(null);
    const load = async () => {
      let requested = version;
      // Old node links have no version. Resolve that immutable node's version
      // before requesting text so a new current version cannot replace it.
      if (!requested && openNodeId && selectedId === openNodeId) {
        const linked = await api(`/api/clhear/nodes/${openNodeId}`);
        if (linked.source_key !== sourceKey) throw new Error("This node belongs to a different source.");
        requested = linked.version_label;
      }
      const q = requested ? `?version_label=${encodeURIComponent(requested)}` : "";
      const [details, document] = await Promise.all([api(sourcePath(sourceKey)), api(`${sourcePath(sourceKey)}/document${q}`)]);
      if (requested && document.version !== requested) throw new Error("The returned document does not match the requested version.");
      if (cancelled) return;
      setDetail(details); setDoc(document);
      history.replaceState({}, "", sourceUrl(sourceKey, document.version, selectedId, openRef));
      if (document.version) {
        api(`${sourcePath(sourceKey)}/evals?version_label=${encodeURIComponent(document.version)}`)
          .then((card) => { if (!cancelled) setScorecard(card); })
          .catch((error) => { if (!cancelled) setScoreError(error); });
      }
    };
    load().catch((error) => { if (!cancelled) setLoadError(error); });
    return () => { cancelled = true; };
  }, [sourceKey, version]);

  useEffect(() => {
    let cancelled = false;
    setInfo(null); setInfoError(null);
    if (!inspect || !doc || !activeId) return;
    if (!doc.nodes.some((n) => n.id === activeId)) {
      setInfoError(new Error("This node is not part of the selected version.")); return;
    }
    const key = `${sourceKey}:${doc.version}:${activeId}`;
    if (nodeCache.current.has(key)) { setInfo(nodeCache.current.get(key)); return; }
    const timer = setTimeout(() => {
      const q = new URLSearchParams({ source_key: sourceKey, version_label: doc.version });
      api(`/api/clhear/nodes/${activeId}?${q}`).then((record) => {
        if (cancelled) return;
        if (!recordMatches(record, sourceKey, doc)) throw new Error("The record does not match this source version.");
        nodeCache.current.set(key, record); setInfo(record);
      }).catch((error) => { if (!cancelled) setInfoError(error); });
    }, hoverId ? 140 : 0);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [activeId, doc, inspect]);

  useEffect(() => {
    if (!doc || scrolled.current) return;
    const target = openNodeId && (!initialVersion || initialVersion === doc.version) && doc.nodes.some((n) => n.id === openNodeId)
      ? document.getElementById("node-" + openNodeId)
      : (openRef && doc.nodes.find((n) => n.ref === openRef)
          ? document.getElementById("node-" + doc.nodes.find((n) => n.ref === openRef).id)
          : null);
    if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      scrolled.current = true;
      if (!selectedId) pinNode(Number(target.id.replace("node-", "")));
    }
  }, [doc]);

  if (loadError) return html`<div><div class="crumbs"><a onClick=${back}>Sources</a> / ${sourceKey}</div><${ErrorNotice} error=${loadError} /></div>`;
  if (!detail || !doc) return html`<div class="spin">Loading ${sourceKey}…</div>`;
  const amended = new Set(doc.amended_refs || []);
  const toc = buildToc(doc.nodes);
  const { visible, matches } = computeVisible(doc.nodes, filter, category);
  const selectedNode = activeId && doc.nodes.find((n) => n.id === activeId);
  const annotationHit = selectedNode ? inheritAnnotation(doc.nodes, selectedNode) : { annotation: null, from: null };
  const selectedAnnotation = annotationHit.annotation;
  const annotationFrom = annotationHit.from;
  // Container nodes (TITLE/CHAPTER) have no raw_text of their own: show every
  // descendant's stored label/heading/body, not a truncated preview.
  let containsPreview = null;
  if (selectedNode && !ws(selectedNode.raw_text || "")) {
    const kids = [];
    const collect = (parentId) => {
      for (const n of doc.nodes) {
        if (n.parent_id !== parentId) continue;
        kids.push(n);
        collect(n.id);
      }
    };
    collect(selectedNode.id);
    const text = kids.map((k) => ws(`${k.label || ""} ${k.heading || ""} ${k.raw_text || ""}`)).filter(Boolean).join("\n");
    if (text) containsPreview = { count: kids.length, text };
  }

  return html`
    <div>
      <div class="crumbs"><a onClick=${back}>Sources</a> / ${detail.short_name || detail.name}</div>
      <h2 style=${{ margin: "0 0 2px" }}>${detail.short_name || detail.name}</h2>
      ${detail.short_name && html`<div class="charter" style=${{ marginBottom: "8px" }}>${detail.name}</div>`}
      <div class="meta-grid">
        <span>issuer <b>${detail.issuer}</b></span>
        <span>jurisdiction <b>${detail.jurisdiction}</b></span>
        <span>license <span class="badge ${detail.license}">${detail.license}</span> ${detail.license_ref}</span>
        <span>adapter <b>${detail.adapter}</b></span>
        ${detail.canonical_url && html`<span><a href=${detail.canonical_url} target="_blank" rel="noreferrer">publisher source ↗</a></span>`}
      </div>
      ${(doc.notice || detail.notice) && html`<div class="notice">${doc.notice || detail.notice}</div>`}
      ${doc.real_publisher_verified === false && html`<div class="notice">Publisher verification is not recorded for this version. Source registration and stored text alone do not establish complete or accurate coverage.</div>`}
      ${detail.about && html`
        <div class="about">${detail.about}
          ${(detail.topics || []).map((t) => html`<span class="topic" key=${t}>${t}</span>`)}
        </div>`}
      <${CurrentTextBadge} detail=${detail} doc=${doc} meta=${meta}
        viewing=${doc.version} reset=${() => chooseVersion(null)} toggleLegend=${() => setLegend(!legend)} />
      <div class="recordbar" style=${{ marginBottom: "12px" }}>
        <label for="source-version">Stored version </label>
        <select id="source-version" value=${doc.version || ""} onChange=${(e) => chooseVersion(e.target.value)} disabled=${!(detail.versions || []).length}>
          ${!(detail.versions || []).length && html`<option value="">No stored version</option>`}
          ${(detail.versions || []).map((v) => html`<option key=${v.version_label} value=${v.version_label}>${v.version_label} · ${v.status}</option>`)}
        </select>
        ${doc.source_version_id != null && html`<span class="mono">source version #${doc.source_version_id}</span>`}
        ${doc.dataset_kind && html`<span class="badge">${doc.dataset_kind}</span>`}
      </div>
      ${legend && html`<${KindLegend} meta=${meta} />`}
      <${ProvenancePanel} detail=${detail} meta=${meta} viewing=${doc.version} openVersion=${chooseVersion} />
      ${doc.as_published_sibling && html`
        <div class="notice">
          You are reading the <b>${kindLabel(meta, doc.version_kind)}</b> text — enacting terms only.
          The preamble and recitals are part of the original act:${" "}
          <a onClick=${() => chooseVersion(doc.as_published_sibling)}>open the as-published version →</a>
        </div>`}
      <div class="meta-grid">
        <span>retrieved <b>${doc.retrieved_at || "not recorded"}</b></span>
        <span>sha256 <span class="mono" title=${doc.content_hash}>${doc.content_hash ? doc.content_hash.slice(0, 16) + "…" : "not recorded"}</span></span>
        <span>archived original <span class="mono">${doc.s3_uri || "not recorded"}</span></span>
        <span><b>${doc.total}</b> nodes</span>
      </div>
      <div class="tabs mode">
        <button class=${!inspect && !evidence ? "active" : ""} onClick=${() => { setInspect(false); setEvidence(false); }}>Original text</button>
        <button class=${inspect ? "active" : ""} onClick=${() => { setInspect(true); setEvidence(false); }}>Text + encoded records</button>
        <button class=${explain ? "active" : ""} onClick=${() => setExplain(!explain)}>explain</button>
        <button class=${evidence ? "active" : ""} onClick=${() => { setEvidence(true); setInspect(false); }}>Evals</button>
      </div>
      ${(detail.changes || []).length > 0 && html`
        <div class="change">
          latest recorded source change (may differ from selected version): <span class=${"kind-" + detail.changes[0].kind}>${detail.changes[0].kind}</span>
          ${detail.changes[0].old_version ? ` ${detail.changes[0].old_version} → ` : " → "}${detail.changes[0].new_version}
          ${detail.changes[0].clause_refs.length > 0 && html`
            <div class="refs">${detail.changes[0].clause_refs.length} clause(s): ${detail.changes[0].clause_refs.slice(0, 25).join(", ")}${detail.changes[0].clause_refs.length > 25 ? " …" : ""}</div>`}
        </div>`}
      ${doc.locked === true && html`<div class="locked">Original text is withheld for this account. ${doc.permission_reason || "Permission to view this version has not been established."} Available references and integrity records are shown below.</div>`}
      ${doc.locked !== true && doc.permission_reason && html`<div class="notice">Access: ${doc.permission_reason}</div>`}
      ${!doc.nodes.length && html`<div class="empty">${doc.version ? "This version has no document nodes available. No source text is displayed." : "No version has been imported for this source."}</div>`}
      ${evidence && html`<${EvidencePanel} card=${scorecard} error=${scoreError} sourceKey=${sourceKey} version=${doc.version} />`}
      <div class="readerbar">
        <input aria-label="Filter this document" placeholder="Filter this document… (e.g. risk assessment)"
               value=${filter} onInput=${(e) => setFilter(e.target.value)} />
        ${((meta && meta.annotation_categories) || []).map((c) => html`
          <button key=${c} class=${"catchip" + (category === c ? " on" : "")}
                  onClick=${() => setCategory(category === c ? null : c)}>${c}</button>`)}
        ${(filter.trim().length >= 2 || category) && html`
          <span class="count">${matches} matching clause${matches === 1 ? "" : "s"}</span>
          <button class="catchip" onClick=${() => { setFilter(""); setCategory(null); }}>clear</button>`}
      </div>
      <div class="layout">
        ${toc.length > 1 && html`
          <nav class="toc">
            <h3>Contents</h3>
            ${toc.map((t) => html`
              <a key=${t.id} class=${t.level === 1 ? "lvl1" : "lvl2"} title=${t.text}
                 onClick=${() => { const el = document.getElementById("node-" + t.id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }}>
                ${t.text}
              </a>`)}
          </nav>`}
        <div class="doc">
          ${visible !== null && visible.size === 0 && html`
            <div class="empty">No clause in this document matches
              ${filter.trim().length >= 2 ? html` “${filter.trim()}”` : ""}${category ? html` (type: ${category})` : ""}.
              Try the global search box above — it covers every source.</div>`}
          ${doc.nodes.map((n, i) => (visible === null || visible.has(n.id)) && html`
            <${DocLine} key=${n.id} n=${n} first=${i === 0} amended=${amended.has(n.ref)}
              inspect=${inspect} explain=${explain} hover=${hoverId === n.id} selected=${selectedId === n.id}
              onEnter=${() => inspect && setHoverId(n.id)}
              onLeave=${() => hoverId === n.id && setHoverId(null)}
              onClick=${() => pinNode(n.id)} />`)}
        </div>
        ${inspect && html`<${Inspector} info=${info} error=${infoError} loading=${!!activeId && !info && !infoError} pinned=${!!selectedId && activeId === selectedId} clearPin=${() => { setSelectedId(null); history.replaceState({}, "", sourceUrl(sourceKey, doc.version)); }} annotation=${selectedAnnotation} annotationFrom=${annotationFrom} contains=${containsPreview} />`}
      </div>
    </div>`;
}

const TOC_SPINE = new Set(["part", "chapter", "section", "group"]);
const TOC_ARTICLE = new Set(["article", "provision", "control"]);

function tocLabel(n) {
  const label = ws(n.label || "");
  const heading = ws(n.heading || "");
  if (label && heading && heading !== label) return `${label} — ${heading}`;
  return label || heading || ws(n.raw_text || "");
}

function buildToc(nodes) {
  const labeled = (n) => !!(ws(n.heading || "") || ws(n.label || ""));
  const spine = nodes.filter((n) => labeled(n) && TOC_SPINE.has(n.node_type));
  const annexes = nodes.filter((n) => n.node_type === "schedule" && labeled(n));
  const articles = nodes.filter((n) =>
    TOC_ARTICLE.has(n.node_type) && (n.heading || (n.label && n.node_type !== "provision"))
  );
  // Keep every labeled article. A previous 140-row wipe dropped MiCA's 149
  // articles when the OJ parser had not yet emitted TITLE/CHAPTER nodes.
  const picked = new Set([...spine, ...articles, ...annexes].map((n) => n.id));
  return nodes
    .filter((n) => picked.has(n.id))
    .map((n) => ({
      id: n.id,
      level: TOC_SPINE.has(n.node_type) || n.node_type === "schedule" ? 1 : 2,
      text: tocLabel(n),
    }));
}

function computeVisible(nodes, filter, category) {
  // Subtree-aware filtering. Categories live on clause-grain nodes while the
  // text lives in their descendants, so:
  //   1. category eligibility propagates DOWN from annotated clause nodes,
  //   2. a node matches if it or ANY DESCENDANT contains the term,
  //   3. visible = matches + their ancestors (headings) + their descendants
  //      (the actual text).
  const term = filter.trim().toLowerCase();
  const active = term.length >= 2 || category;
  if (!active) return { visible: null, matches: 0 };
  const byId = {};
  const children = {};
  for (const n of nodes) {
    byId[n.id] = n;
    if (n.parent_id) (children[n.parent_id] = children[n.parent_id] || []).push(n.id);
  }
  // 1. category eligibility (inherited downward from the annotated clause)
  const eligible = new Set();
  if (category) {
    const markSubtree = (id) => {
      if (eligible.has(id)) return;
      eligible.add(id);
      for (const c of children[id] || []) markSubtree(c);
    };
    for (const n of nodes) if (n.annotation && n.annotation.category === category) markSubtree(n.id);
  }
  const catOk = (n) => !category || eligible.has(n.id);
  // 2. text hits (per node)
  const selfHit = (n) =>
    term.length < 2 ||
    `${n.label || ""} ${n.heading || ""} ${n.raw_text || ""}`.toLowerCase().includes(term);
  // 3. matched = annotated-clause units (or any node when no category is set)
  //    whose subtree contains the term
  const visible = new Set();
  const matchedClauses = new Set();
  let rawHits = 0;
  const addAncestors = (n) => {
    let parent = n.parent_id;
    while (parent && !visible.has(parent)) { visible.add(parent); parent = byId[parent] && byId[parent].parent_id; }
  };
  const addSubtree = (id) => {
    if (!visible.has(id)) visible.add(id);
    for (const c of children[id] || []) addSubtree(c);
  };
  const clauseOf = (n) => {
    let cur = n;
    while (cur) {
      if (cur.annotation) return cur.id;
      cur = cur.parent_id ? byId[cur.parent_id] : null;
    }
    return null;
  };
  for (const n of nodes) {
    if (!catOk(n) || !selfHit(n)) continue;
    rawHits += 1;
    const clause = clauseOf(n);
    if (clause) matchedClauses.add(clause);
    visible.add(n.id);
    addAncestors(n);
    addSubtree(n.id);
  }
  return { visible: visible.size ? visible : new Set(), matches: matchedClauses.size || rawHits };
}

function CurrentTextBadge({ detail, doc, meta, viewing, reset, toggleLegend }) {
  const inForce = (detail.versions || []).find((v) => v.status === "in_force");
  const viewingCurrent = inForce && viewing === inForce.version_label;
  const shown = (detail.versions || []).find((v) => v.version_label === viewing) || inForce;
  if (!shown) return null;
  const when = shown.as_of_date || shown.version_label.split(":").pop();
  return html`
    <div class="curbadge" style=${viewingCurrent ? {} : { borderLeftColor: "var(--amber-600)" }}>
      ${viewingCurrent
        ? html`<span>Current stored text</span>`
        : html`<span>Viewing <b>${shown.status}</b> text</span>`}

function DocLine({ n, first, amended, inspect, explain, hover, selected, onEnter, onLeave, onClick }) {
  const centered = ["title", "part", "chapter", "group", "schedule", "article"].includes(n.node_type);
  const indent = centered ? 0 : Math.max(0, n.depth - 1) * 18;
  const classes = ["n", n.node_type, first && n.node_type === "title" && "docfirst",
                   amended && "amended", selected && "selected"].filter(Boolean).join(" ");
  const body = n.raw_text || "";
  // Official-layout dedup: never print the label when the visible text already
  // begins with it (the data-level invariant forbids it too; this is defense).
  const dupIn = (text) => text && ws(text).startsWith(ws(n.label)) && !/^[A-Za-z0-9]/.test(ws(text).slice(ws(n.label).length, ws(n.label).length + 1));
  const showLabel = n.label && !dupIn(n.heading) && !dupIn(body);
  const a = explain ? n.annotation : null;
  return html`
    <div id=${"node-" + n.id} class=${classes} style=${{ paddingLeft: indent + "px" }} tabindex="0" role="button"
         aria-label=${`Inspect ${n.ref || n.node_type} record ${n.id}`} aria-pressed=${!!selected}
         onMouseEnter=${onEnter} onMouseLeave=${onLeave} onFocus=${onEnter} onBlur=${onLeave} onClick=${onClick}
         onKeyDown=${(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onClick(); } }}>
      ${showLabel && html`<span class="lab">${n.label}</span>`}
      ${n.heading && html`<span class="hd">${n.heading}</span>`}
      ${body && html`<span class="rawbody">${showLabel || n.heading ? " " : ""}${body}</span>`}
      ${inspect && hover && html`
        <span class="float">
          node #${n.id} · ${n.ref || n.node_type} · ${(n.text_hash || "").slice(0, 8)} · click to pin
          ${amended ? " · amended" : ""}
        </span>`}
      ${a && (a.summary || a.category) && html`
        <div class="annot">
          <span class="tag">${a.origin === "llm" ? "AI-generated explainer — not legal text" : "classification"}</span>
          ${a.category && html`<span class="cat">${a.category}</span>`}
          ${(a.topics || []).map((t) => html`<span class="cat" key=${t}>${t}</span>`)}
          ${a.summary && html`<div style=${{ marginTop: "4px" }}>${a.summary}</div>`}
        </div>`}
    </div>`;
}

function ancestorLabel(a) {
  const label = (a.label || "").trim();
  const heading = (a.heading || "").trim();
  if (label && heading && heading !== label) return `${label} — ${heading}`;
  return label || heading || a.ref || a.node_type;
}

function inheritAnnotation(nodes, selected) {
  const byId = {};
  for (const n of nodes) byId[n.id] = n;
  let cur = selected;
  while (cur) {
    if (cur.annotation && (cur.annotation.summary || cur.annotation.category)) {
      return { annotation: cur.annotation, from: cur === selected ? null : cur };
    }
    cur = cur.parent_id ? byId[cur.parent_id] : null;
  }
  return { annotation: null, from: null };
}

function Inspector({ info, error, loading, pinned, clearPin, annotation, annotationFrom, contains }) {
  const [copied, setCopied] = useState("");
  useEffect(() => { setCopied(""); }, [info && info.id]);
  if (!info) return html`<aside class="inspector"><h3>Encoded record</h3>${error ? html`<${ErrorNotice} error=${error} />` : html`<div class="charter">${loading ? "Loading this version’s record…" : "Hover over text to preview its stored record. Click or press Enter to pin it. The original text stays beside its source, version, node and clause identifiers."}</div>`}</aside>`;
  const permalink = sourceUrl(info.source_key, info.version_label, info.id);
  const copy = () => navigator.clipboard.writeText(location.origin + permalink).then(() => setCopied("Link copied")).catch(() => setCopied("Copy unavailable — use the record link below."));
  const encoded = {
    source_key: info.source_key, source_version_id: info.source_version_id, version_label: info.version_label,
    node_id: info.id, node_type: info.node_type, ref: info.ref, seq: info.seq, depth: info.depth,
    label: info.label, heading: info.heading, raw_text: info.raw_text, text_hash: info.text_hash,
    clauses: info.clauses || [], dataset_kind: info.dataset_kind,
  };
  return html`
    <aside class="inspector">
      <div class="charter">${pinned ? "Pinned record" : "Hover preview · click text to pin"}${pinned && html` <button onClick=${clearPin}>Unpin</button>`}</div>
      <h3>${info.node_type}${info.ref ? ` · ${info.ref}` : ""}</h3>
      ${annotation && (annotation.summary || annotation.category) && html`
        <div class="annot">
          <span class="tag">${annotation.origin === "llm" ? "AI-generated explainer — not legal text" : "heuristic classification"}${annotationFrom ? ` · inherited from ${ancestorLabel(annotationFrom)}` : ""}</span>
          ${annotation.category && html`<span class="cat">${annotation.category}</span>`}
          ${(annotation.topics || []).map((t) => html`<span class="cat" key=${t}>${t}</span>`)}
          ${annotation.summary && html`<div style=${{ marginTop: "4px" }}>${annotation.summary}</div>`}
        </div>`}
      <dl>
        <dt>source key</dt><dd class="mono">${info.source_key}</dd>
        <dt>source version id</dt><dd class="mono">${info.source_version_id ?? "not recorded"}</dd>
        <dt>node id · sequence · depth</dt><dd class="mono">${info.id} · ${info.seq ?? "—"} · ${info.depth ?? "—"}</dd>
        <dt>reference</dt><dd class="mono">${info.ref || "—"}</dd>
        <dt>label</dt><dd>${info.label || "—"}</dd>
        <dt>sha256</dt><dd class="mono">${info.text_hash}</dd>
        <dt>version</dt><dd>${info.version_label}<div class="mono">retrieved ${info.retrieved_at}</div></dd>
        <dt>immutable original</dt><dd class="mono">${info.s3_uri}</dd>
        ${info.indexed_as && html`<dt>indexed as</dt><dd>${info.indexed_as}</dd>`}
        <dt>ancestors</dt>
        <dd>${!(info.ancestors || []).length ? "—" : info.ancestors.map((a) => ancestorLabel(a)).join(" › ")}</dd>
        ${(info.changes || []).length > 0 && html`
          <dt>changes touching this ref</dt>
          <dd>${info.changes.map((c) => html`<div class=${"kind-" + c.kind}>${c.kind} ${c.old_version || ""} → ${c.new_version}</div>`)}</dd>`}
      </dl>
      ${info.permission_reason && html`<div class="charter">${info.permission_reason}</div>`}
      <h4>Linked clauses</h4>
      ${(info.clauses || []).length ? (info.clauses || []).map((c) => html`<details class="prov" key=${c.id}>
        <summary>Clause #${c.id} · ${c.ref || "no ref"}</summary>
        <dl><dt>source version id</dt><dd class="mono">${c.source_version_id ?? "—"}</dd>
        <dt>path · ordering</dt><dd class="mono">${typeof c.path === "string" ? c.path : JSON.stringify(c.path)} · ${c.ordering ?? "—"}</dd>
        <dt>stored character span</dt><dd class="mono">${c.span_start ?? "—"} → ${c.span_end ?? "—"}</dd>
        <dt>sha256</dt><dd class="mono">${c.text_hash || "not recorded"}</dd></dl>
      </details>`) : html`<div class="charter">No clause link returned for this node.</div>`}
      ${contains && html`
        <div class="annot">
          <span class="tag">contains — ${contains.count} element${contains.count === 1 ? "" : "s"} (scroll for full stored text)</span>
          <div class="contains" style=${{ marginTop: "4px" }}>${contains.text}</div>
        </div>`}
      ${info.raw_text && html`<dt style=${{ marginTop: "10px" }}>raw text</dt><pre tabindex="0">${info.raw_text}</pre>`}
      ${info.source_fragment && html`<dt>source fragment</dt><pre tabindex="0">${info.source_fragment}</pre>`}
      <details class="prov"><summary>Encoded record · JSON</summary><pre tabindex="0">${JSON.stringify(encoded, null, 2)}</pre></details>
      <a href=${permalink}>Open version-pinned record ↗</a><br />
      <button onClick=${copy}>Copy record link</button><div role="status" class="charter">${copied}</div>
    </aside>`;
}

function EvidencePanel({ card, sourceKey, version, error }) {
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (!version) return html`<div class="empty">No imported version is available to evaluate.</div>`;
  if (!card) return html`<div class="spin">Loading this version’s recorded checks…</div>`;
  const evidenceVersion = card.version || card.latest_version;
  if (evidenceVersion && evidenceVersion !== version) return html`<div class="notice">The returned scorecard belongs to ${evidenceVersion}, not selected version ${version}. No pass result is shown for this version.</div>`;
  const suites = card.scorecard && card.scorecard.suites ? card.scorecard.suites : {};
  const order = ["e1_fidelity", "e2_completeness", "e3_roundtrip", "e4_change_replay", "e5_provenance", "e6_retrievability", "e7_closure"];
  const labels = {
    e1_fidelity: "E1 Fidelity",
    e2_completeness: "E2 Completeness",
    e3_roundtrip: "E3 Round-trip",
    e4_change_replay: "E4 Change replay",
    e5_provenance: "E5 Provenance",
    e6_retrievability: "E6 Retrievability",
    e7_closure: "E7 Closure",
  };
  return html`
    <div class="family" style=${{ marginBottom: "16px" }}>
      <h3 style=${{ margin: "0 0 8px" }}>Evals — ${sourceKey}</h3>
      <div class="charter">Selected version: <span class="mono">${version}</span>. These checks describe this stored document, not completeness of the publisher’s entire rulebook.</div>
      <div class="rolegrid">
        <div><b>Complete</b><p class="charter">${suites.e2_completeness ? (suites.e2_completeness.passed ? "Recorded completeness check passed." : "Recorded completeness check failed.") : "No completeness check recorded."} Scope and counts appear in the evidence below.</p></div>
        <div><b>Accurate</b><p class="charter">${suites.e1_fidelity ? (suites.e1_fidelity.passed ? "Recorded source fidelity check passed." : "Recorded source fidelity check failed.") : "No source fidelity check recorded."} Review provenance and round-trip results alongside fidelity.</p></div>
        <div><b>On time</b><p class="charter">${card.last_run ? `Last recorded check: ${card.last_run.ts}.` : "No source check recorded."} A configured schedule alone does not prove an on-time check.</p></div>
      </div>
      <div class="charter">Last fetch ${card.last_run ? card.last_run.ts : "never"} ·
        artifact <span class="mono">${card.s3_uri || "—"}</span> ·
        run ${card.last_run ? "#" + card.last_run.run_id : "—"}
        ${card.last_run && card.last_run.error ? html` · <span style=${{ color: "var(--rose-600)" }}>${card.last_run.error}</span>` : ""}
        ${card.last_run && card.last_run.note ? html` · ${card.last_run.note}` : ""}
      </div>
      <table class="members">
        <thead><tr><th>suite</th><th>status</th><th>score</th></tr></thead>
        <tbody>
          ${order.map((s) => {
            const row = suites[s];
            const scores = row && row.scores ? row.scores : {};
            const score = scores.score != null ? scores.score : (scores.note || "");
            const ok = row ? row.passed : null;
            return html`<tr key=${s}>
              <td>${labels[s]}</td>
              <td><span class=${"badge " + (ok === true ? "open" : ok === false ? "restricted" : "guidance")}>${ok === true ? "pass" : ok === false ? "fail" : "not run"}</span></td>
              <td class="mono">${score === "" ? JSON.stringify(scores) : score}</td>
            </tr>`;
          })}
        </tbody>
      </table>
      <div class="charter">Reported downstream readiness: ${card.l2_ready === true ? "ready" : card.l2_ready === false ? "not ready" : "not recorded"}. ${card.readiness_reason || "Missing checks remain unverified."}</div>
    </div>`;
}

const STATUS_FILTERS = ["all", "success", "warning", "failure", "info"];

function ActivityView({ open }) {
  const [items, setItems] = useState(null);
  const [filter, setFilter] = useState("all");
  const [kind, setKind] = useState("all");
  const [error, setError] = useState(null);
  useEffect(() => { api("/api/clhear/activity?limit=200").then(setItems).catch(setError); }, []);
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (items === null) return html`<div class="spin">Loading the audit trail…</div>`;
  const visible = items.filter((i) => (filter === "all" || i.status === filter) && (kind === "all" || i.type === kind || i.kind === kind));
  const days = [];
  for (const item of visible) {
    const day = (item.ts || "").slice(0, 10);
    if (!days.length || days[days.length - 1].day !== day) days.push({ day, items: [] });
    days[days.length - 1].items.push(item);
  }
  return html`
    <div>
      <h2 style=${{ margin: "0 0 4px" }}>Recorded activity</h2>
      <div class="charter">Recorded runs, routing decisions, checks and decisions from the run ledger and AI operations feed.</div>
      <div class="filters">
        ${STATUS_FILTERS.map((s) => html`
          <button key=${s} class=${filter === s ? "on" : ""} onClick=${() => setFilter(s)}>${s}</button>`)}
        ${TYPE_FILTERS.map((s) => html`
          <button key=${"t"+s} class=${kind === s ? "on" : ""} onClick=${() => setKind(s)}>${s}</button>`)}
      </div>
      ${visible.length === 0 && html`<div class="empty">No activity recorded${filter !== "all" ? ` with status “${filter}”` : ""}.</div>`}
      ${days.map((d) => html`
        <div key=${d.day}>
          <div class="dayhead">${d.day}</div>
          ${d.items.map((i, idx) => html`
            <div class="act" key=${idx}>
              <span class=${"dot " + i.status} title=${i.status}></span>
              <div class="body">
                <span class="fleetbadge">${i.actor}</span>
                ${i.short_name && html` <b>${i.short_name}</b> —`}
                ${" "}${i.summary}
                <div class="links">
                  ${i.source_key && html`<a onClick=${() => open(i.source_key)}>open document</a>`}
                  ${i.links && i.links.review && html`<a href=${i.links.review}>review console</a>`}
                  ${i.run_id && html`<a href=${`/l1?view=fleet`}>fleet view</a>`}
                </div>
                ${i.details && Object.keys(i.details).length > 0 && html`
                  <details><summary class="mono">details</summary><pre tabindex="0">${JSON.stringify(i.details, null, 2)}</pre></details>`}
              </div>
              <span class="when">${(i.ts || "").slice(11, 19)}${i.duration_ms ? ` · ${(i.duration_ms / 1000).toFixed(1)}s` : ""}</span>
            </div>`)}
        </div>`)}
    </div>`;
}

function FleetView({ open }) {
  const [board, setBoard] = useState(null);
  const [job, setJob] = useState(null);
  const [mode, setMode] = useState("team");
  const [runId, setRunId] = useState(null);
  const [run, setRun] = useState(null);
  const [meta, setMeta] = useState(_meta);
  const [stageLegend, setStageLegend] = useState(false);
  const [boardError, setBoardError] = useState(null);
  const [jobError, setJobError] = useState(null);
  const [runError, setRunError] = useState(null);

  useEffect(() => { getMeta().then(setMeta).catch(() => {}); }, []);

  const load = () => {
    api("/api/clhear/fleet").then((value) => { setBoard(value); setBoardError(null); }).catch(setBoardError);
    api("/api/clhear/jobs/latest").then((value) => { setJob(value); setJobError(null); }).catch((error) => {
      if (error.status === 404) { setJob(false); setJobError(null); } else setJobError(error);
    });
  };
  useEffect(() => { load(); }, []);
  useEffect(() => {
    // real-time: poll while the latest job (or any run) is executing
    const active = (job && job.running) || (board && board.some((r) => r.last_run && r.last_run.status === "running"));
    if (!active) return;
    const t = setInterval(load, 2500);
    return () => clearInterval(t);
  }, [board, job]);
  useEffect(() => {
    setRunError(null);
    if (runId) { setRun(null); api(`/api/clhear/runs/${runId}`).then(setRun).catch(setRunError); }
    else setRun(null);
  }, [runId]);

  return html`
    <div>
      <h2 style=${{ margin: "0 0 4px" }}>Fleet · L1 team and runs</h2>
      <div class="charter">Meet the named roles, inspect their execution bindings, then follow recorded jobs through fetch, parse, validation, persistence and change detection. A persona describes a responsibility; the worker and run records show what executed.</div>

        <details class="schedbar">
          <summary>Configured schedules (UTC)</summary>
          ${Object.entries(meta.schedules).map(([k, s]) => html`
            <span class="scheditem" key=${k} title=${s.covers}>
              <span class="mono">${k}</span> ${s.cadence} · ${s.utc_time}
            </span>`)}
          <div class="charter" style=${{ margin: "4px 0 0" }}>

          </div>
        </details>`}
      <div class="tabs mode">
        <button class=${mode === "team" ? "active" : ""} onClick=${() => setMode("team")}>Team roles</button>
        <button class=${mode === "canvas" ? "active" : ""} onClick=${() => setMode("canvas")}>Workflow</button>
        <button class=${mode === "table" ? "active" : ""} onClick=${() => setMode("table")}>Source runs</button>
        <button class=${mode === "activity" ? "active" : ""} onClick=${() => setMode("activity")}>Activity</button>
        <button class=${stageLegend ? "active" : ""} onClick=${() => setStageLegend(!stageLegend)}>stages ⓘ</button>
      </div>
      ${stageLegend && html`<${StageLegend} meta=${meta} />`}
      ${mode === "team" && html`<${TeamRoles} selectRun=${(id) => { setRunId(id); }} />`}
      ${mode === "activity" && html`<${ActivityView} open=${open} />`}
      ${mode === "canvas" && (jobError ? html`<${ErrorNotice} error=${jobError} />` : job === null ? html`<div class="spin">Loading recorded workflow…</div>` : job
        ? html`<${JobCanvas} job=${job} selectRun=${setRunId} selectedRun=${runId} />`
        : html`<div class="empty">No fleet job has been recorded.</div>`)}
      ${runError && html`<${ErrorNotice} error=${runError} />`}
      ${run && html`<${RunDag} run=${run} close=${() => setRunId(null)} meta=${meta} />`}
      ${mode === "table" && (boardError ? html`<${ErrorNotice} error=${boardError} />` : board === null ? html`<div class="spin">Loading recorded source runs…</div>` : html`<${FleetTable} board=${board} open=${open} setRunId=${setRunId} meta=${meta} />`)}
    </div>`;
}

function TeamRoles({ selectRun }) {
  const [team, setTeam] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => { api("/api/clhear/team?layer=L1").then(setTeam).catch(setError); }, []);
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (!team) return html`<div class="spin">Loading L1 team roles…</div>`;
  return html`<div>
    <div class="charter">Role metadata checked ${team.as_of || "at an unrecorded time"}. Tool lists describe supported capabilities; recorded use appears only when execution evidence is available.</div>
    <div class="rolegrid">${(team.fleets || []).map((role) => html`<article class="rolecard" key=${role.id}>
      <h3>${role.name} <span class="badge">${role.layer}</span></h3>
      <div class="mono">${role.execution_kind || "descriptive role"}</div>
      <p>${role.mission}</p>
      <dl>
        <dt>Execution binding</dt><dd class="mono">${role.fleet || "not supplied"}${role.task_id ? ` · task ${role.task_id}` : ""}</dd>
        ${role.evidence_state && html`<dt>Execution evidence</dt><dd>${role.evidence_state === "recorded_run" ? "Recorded run available" : role.evidence_state === "no_recorded_run" ? "No recorded run" : role.evidence_state}</dd>`}
        ${role.implemented != null && html`<dt>Implementation</dt><dd>${role.implemented ? "Implemented" : "Not implemented"}</dd>`}
        ${role.enabled != null && html`<dt>Enabled</dt><dd>${role.enabled ? "Enabled by configuration" : "Disabled by configuration"}</dd>`}
        <dt>${role.tools_basis === "configured" ? "Configured tools" : "Supported tools"}</dt><dd>${(role.tools || []).join(" · ") || "Not supplied"}</dd>
        <dt>Last recorded run</dt><dd>${role.last_run ? html`${role.last_run.status} · ${role.last_run.ts || "timestamp unavailable"}${role.last_run.run_id && html` <button class="catchip" onClick=${() => selectRun(role.last_run.run_id)}>Run #${role.last_run.run_id}</button>`}` : "No execution recorded for this binding"}</dd>
        <dt>Model routing record</dt><dd>${role.model ? `${role.model.model || "No model selected"}${role.model.tier ? ` · ${role.model.tier}` : ""}` : "No model routing record supplied"}</dd>
      </dl>
      <details><summary>Role details and recorded metadata</summary>
        ${role.model && role.model.reason && html`<p>${role.model.reason}</p>`}
        <p>Configuration is separate from observed model use. Missing tool, model or prompt version evidence is not inferred from the role name.</p>
        <pre tabindex="0">${JSON.stringify(role, null, 2)}</pre>
      </details>
    </article>`)}</div>
    ${!(team.fleets || []).length && html`<div class="empty">No L1 roles are configured.</div>`}
  </div>`;
}

function FleetTable({ board, open, setRunId, meta }) {
  return html`
      <table class="fleet">
        <thead><tr>
          <th>source</th><th>adapter</th><th>version</th><th>last run</th><th>coverage</th><th>stages</th><th>schedule</th>
        </tr></thead>
        <tbody>
        ${board.map((r) => html`
          <tr key=${r.source_key}>
            <td><a href=${sourceUrl(r.source_key, r.current_version)} onClick=${(e) => { e.preventDefault(); open(r.source_key, null, null, r.current_version); }} title=${r.source_name}>${r.short_name || r.source_name}</a><div class="mono">${r.source_key}</div></td>
            <td class="mono">${r.adapter}</td>
            <td>
              ${r.current_version_kind && html`<span class="kindbadge ${r.current_version_kind}">${r.current_version_kind.replace("_", " ")}</span>`}
              <div class="mono">${r.current_version || "—"}</div>
              ${r.previous_version && html`<div class="mono" style=${{ opacity: 0.6 }}>prev: ${r.previous_version}</div>`}
              <div class="mono" style=${{ opacity: 0.6 }}>${r.versions} version${r.versions === 1 ? "" : "s"}</div>
            </td>
            <td>
              ${r.last_run ? html`
                <span class=${"dot " + r.last_run.status}></span>
                <span class="runlink" onClick=${() => setRunId(r.last_run.run_id)}>run #${r.last_run.run_id}</span>
                <div class="mono">${r.last_run.raw_status === "unchanged" || r.last_run.raw_status === "up-to-date" ? "probed, unchanged" : (r.last_run.note || r.last_run.raw_status || r.last_run.status)}</div>
                ${r.last_run.freshness === "stale" ? html`<div class="mono" style=${{ color: "var(--amber-600)" }}>stale last-good</div>` : ""}
                ${r.last_run.error ? html`<div class="mono" style=${{ color: "var(--rose-600)" }}>${r.last_run.error}</div>` : ""}
                <div class="mono">${r.last_run.ts}</div>` : html`<span class="mono" style=${r.library_status === "schedule-missed" ? { color: "var(--rose-600)" } : {}}>${r.library_status === "schedule-missed" ? "schedule missed — no run in 24h" : "never-fetched"}</span>`}
              ${!r.last_run && r.next_run_utc ? html`<div class="mono">next: ${r.next_run_utc.slice(0, 16)}Z</div>` : ""}
            </td>
            <td class="mono">${r.last_run && r.last_run.coverage != null ? (r.last_run.coverage * 100).toFixed(2) + "%" : "—"}</td>
            <td>${r.last_run ? r.last_run.stages.map((s, i) => html`
                <span key=${i} class=${"stagechip " + chipStatus(s, r.last_run.status)}
                      title=${meta && meta.stages ? meta.stages[s.stage] : ""}>${s.stage}${s.attempt > 1 ? `#${s.attempt}` : ""}</span>`) : "—"}</td>
            <td class="mono">${r.schedule}</td>
          </tr>`)}
        </tbody>
      </table>`;
}

/* Databricks-style job workflow canvas: lanes per source, task cards with
   live statuses, start/relay convergence, replay from the ledger. */
function JobCanvas({ job, selectRun, selectedRun }) {
  const allTasks = job.lanes.flatMap((l) => l.tasks).concat(job.relay ? [job.relay] : []);
  const ordered = [...allTasks].sort((a, b) => a.run_id - b.run_id);
  const [lit, setLit] = useState(new Set(ordered.map((t) => t.run_id)));
  const replay = () => {
    setLit(new Set());
    const total = Math.max(1, ordered.reduce((a, t) => a + (t.duration_ms || 1), 0));
    const scale = Math.min(1, 6000 / total);
    let t = 0;
    ordered.forEach((task) => {
      t += Math.max(200, (task.duration_ms || 1) * scale);
      setTimeout(() => setLit((prev) => new Set([...prev, task.run_id])), t);
    });
  };

  const W = 208, H = 66, GAPX = 54, LANEH = 86, LEFT = 96;
  const maxLen = Math.max(...job.lanes.map((l) => l.tasks.length));
  const relayX = LEFT + maxLen * (W + GAPX) + 30;
  const width = relayX + W + 30;
  const height = Math.max(2, job.lanes.length) * LANEH + 30;
  const midY = height / 2;
  const laneY = (i) => 20 + i * LANEH + H / 2;
  const pos = {};
  job.lanes.forEach((lane, li) =>
    lane.tasks.forEach((task, ti) => { pos[task.run_id] = { x: LEFT + ti * (W + GAPX), y: laneY(li) }; })
  );
  if (job.relay) pos[job.relay.run_id] = { x: relayX, y: midY };

  const statusColor = (task) =>
    !lit.has(task.run_id) ? "var(--pearl-dark)"
    : task.status === "failure" ? "var(--rose-600)"
    : task.status === "warning" ? "var(--amber-600)"
    : task.status === "running" ? "var(--indigo-500)"
    : task.status === "info" ? "var(--indigo-100)"
    : "var(--mint-600)";
  const counts = job.status_counts || {};

  const edgePath = (from, to) => {
    const x1 = from === 0 ? 44 : pos[from].x + W;
    const y1 = from === 0 ? midY : pos[from].y;
    const x2 = pos[to].x;
    const y2 = pos[to].y;
    const mx = (x1 + x2) / 2;
    return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
  };

  return html`
    <div class="dagwrap">
      <h3><span class="mono">${job.job_id}</span> · trigger ${job.trigger} · started ${job.started_at}
        · ${(job.total_duration_ms / 1000).toFixed(1)}s
        ${job.running ? html` · <span class="dot running"></span> running` : ""}</h3>
      <div class="charter">
        ${allTasks.length} tasks —
        ${["success", "warning", "failure", "running", "info"].filter((s) => counts[s])
          .map((s) => `${counts[s]} ${s}`).join(" · ")}
        · ${allTasks.reduce((a, t) => a + (t.nodes || 0), 0).toLocaleString()} nodes reported across tasks
        in ${(job.total_duration_ms / 1000).toFixed(1)}s recorded duration
        · click a task for its stage pipeline
      </div>
      <div style=${{ overflowX: "auto" }}>
        <svg width=${width} height=${height} style=${{ display: "block" }}>
          ${job.edges.map(([from, to], i) => {
            const on = (from === 0 || lit.has(from)) && lit.has(to);
            return html`<path key=${i} d=${edgePath(from, to)} fill="none"
              stroke=${on ? "var(--indigo-500)" : "var(--pearl-dark)"} stroke-width="1.8" />`;
          })}
          <circle cx="32" cy=${midY} r="13" fill="var(--ind-700)" />
          <text x="32" y=${midY + 4} text-anchor="middle" font-size="11" fill="white">▶</text>
          <text x="32" y=${midY + 30} text-anchor="middle" font-size="10.5" fill="var(--muted)">job start</text>
          ${allTasks.map((task) => {
            const p = pos[task.run_id];
            const selected = selectedRun === task.run_id;
            return html`
              <g key=${task.run_id} style=${{ cursor: "pointer" }} onClick=${() => selectRun(task.run_id)}>
                <rect x=${p.x} y=${p.y - H / 2} width=${W} height=${H} rx="10"
                      fill="var(--canvas)" stroke=${statusColor(task)} stroke-width=${selected ? 3.5 : 2.2} />
                <circle cx=${p.x + 14} cy=${p.y - H / 2 + 15} r="4.5" fill=${statusColor(task)} />
                <text x=${p.x + 26} y=${p.y - H / 2 + 19}
                      font-family="ui-monospace, Menlo, monospace" font-size="11" fill="var(--muted)">
                  ${task.fleet} · #${task.run_id}</text>
                <text x=${p.x + 12} y=${p.y + 6} font-size="12" font-weight="700" fill="var(--ink)">
                  ${(task.short_name || task.source || "").slice(0, 26)}</text>
                <text x=${p.x + 12} y=${p.y + 22} font-size="10.5" fill="var(--muted)">
                  ${task.step.slice(0, 30)}${task.coverage != null ? ` · ${(task.coverage * 100).toFixed(1)}%` : ""}${task.duration_ms != null ? ` · ${(task.duration_ms / 1000).toFixed(1)}s` : ""}</text>
              </g>`;
          })}
        </svg>
      </div>
      <button class="playbtn" onClick=${replay}>▶ Animate recorded job</button>
    </div>`;
}

function chipStatus(stage, runStatus) {
  if (stage.stage === "salvage" || stage.stage === "llm_repair" || stage.stage === "hints") return "warning";
  if (stage.stage === "gate" && stage.coverage != null && stage.coverage < 0.995) return runStatus === "failure" ? "failure" : "warning";
  return runStatus === "failure" ? "failure" : "success";
}

function RunDag({ run, close, meta }) {
  const [lit, setLit] = useState(run.stages.length); // all lit by default
  const stages = run.stages;
  const W = 148, H = 92, GAP = 26;
  const width = Math.max(600, stages.length * (W + GAP));
  const replay = () => {
    setLit(0);
    const total = Math.max(1, stages.reduce((a, s) => a + (s.ms || 1), 0));
    const scale = Math.min(1, 4000 / total); // compress to <= 4s
    let t = 0;
    stages.forEach((s, i) => {
      t += Math.max(120, (s.ms || 1) * scale);
      setTimeout(() => setLit(i + 1), t);
    });
  };
  const color = (s, i) => {
    if (i >= lit) return "var(--pearl-dark)";
    if (["salvage", "llm_repair", "hints"].includes(s.stage)) return "var(--amber-600)";
    if (s.stage === "gate" && s.coverage != null && s.coverage < 0.995) return "var(--amber-600)";
    return run.status === "failed" && i === stages.length - 1 ? "var(--rose-600)" : "var(--mint-600)";
  };
  return html`
    <div class="dagwrap">
      <h3>run #${run.id} · <span class="mono">${run.fleet}</span> · ${run.status}
        ${run.outputs.coverage != null && html` · coverage ${(run.outputs.coverage * 100).toFixed(2)}%`}
        ${run.outputs.version && html` · <span class="mono">${run.outputs.version}</span>`}
      </h3>
      <div class="charter">
        trigger ${run.trigger} · ${run.created_at} · ${(run.duration_ms / 1000).toFixed(1)}s total
        ${run.outputs.llm_assisted ? " · LLM-assisted repair (ratification pending)" : ""}
        ${run.outputs.hints_used ? ` · ${run.outputs.hints_used.length} learned hint(s) applied` : ""}
      </div>
      <div style=${{ overflowX: "auto" }}>
        <svg width=${width} height=${H + 40} style=${{ display: "block" }}>
          ${stages.map((s, i) => {
            const x = i * (W + GAP);
            const attemptLoop = i > 0 && STAGE_ORDER.indexOf(s.stage) <= STAGE_ORDER.indexOf(stages[i - 1].stage);
            return html`
              <g key=${i}>
                <title>${meta && meta.stages ? meta.stages[s.stage] || s.stage : s.stage}</title>
                ${i > 0 && html`
                  <line x1=${x - GAP} y1=${H / 2} x2=${x} y2=${H / 2}
                        stroke=${i < lit ? "var(--indigo-500)" : "var(--pearl-dark)"} stroke-width="2" />
                  <polygon points=${`${x},${H / 2} ${x - 7},${H / 2 - 4} ${x - 7},${H / 2 + 4}`}
                           fill=${i < lit ? "var(--indigo-500)" : "var(--pearl-dark)"} />`}
                ${attemptLoop && html`
                  <path d=${`M ${x + W / 2} ${H - 6} C ${x + W / 2 - 40} ${H + 28}, ${x - GAP - W / 2 + 40} ${H + 28}, ${x - GAP - W / 2} ${H - 6}`}
                        fill="none" stroke="var(--amber-600)" stroke-width="1.5" stroke-dasharray="4 3" />`}
                <rect x=${x} y=${H / 2 - 32} width=${W} height="64" rx="10"
                      fill="var(--canvas)" stroke=${color(s, i)} stroke-width="2.5" />
                <text x=${x + W / 2} y=${H / 2 - 8} text-anchor="middle"
                      font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700"
                      fill="var(--ink)">${s.stage}${s.attempt > 1 ? ` #${s.attempt}` : ""}</text>
                <text x=${x + W / 2} y=${H / 2 + 12} text-anchor="middle" font-size="11" fill="var(--muted)">
                  ${s.coverage != null ? `${(s.coverage * 100).toFixed(2)}% · ` : ""}${s.nodes ? `${s.nodes} nodes · ` : ""}${s.ms}ms
                </text>
                ${s.stage === "diff" && html`
                  <text x=${x + W / 2} y=${H / 2 + 26} text-anchor="middle" font-size="10.5" fill="var(--muted)">
                    +${s.added || 0} ~${s.amended || 0} −${s.removed || 0}
                  </text>`}
                ${s.stage === "persist" && s.version && html`
                  <text x=${x + W / 2} y=${H / 2 + 26} text-anchor="middle" font-size="10.5" fill="var(--muted)">
                    ${String(s.version).slice(0, 22)}
                  </text>`}
              </g>`;
          })}
        </svg>
      </div>
      <button class="playbtn" onClick=${replay}>▶ Animate recorded run</button>
      ${" "}
      <button class="playbtn" onClick=${close}>close</button>
    </div>`;
}

/* --------------------------------- search ----------------------------------- */
function SearchView({ q, open, back }) {
  const [results, setResults] = useState(null);
  const [category, setCategory] = useState(null);
  const [scope, setScope] = useState(null);
  const [families, setFamilies] = useState([]);
  const [meta, setMeta] = useState(_meta);
  const [error, setError] = useState(null);
  useEffect(() => { getMeta().then(setMeta).catch(() => {}); api("/api/clhear/sources").then(setFamilies).catch(() => {}); }, []);
  useEffect(() => {
    let cancelled = false;
    setResults(null); setError(null);
    const params = new URLSearchParams({ q });
    if (category) params.set("category", category);
    if (scope) params.set("scope", scope);
    api(`/api/clhear/search?${params}`).then((data) => { if (!cancelled) setResults(data); }).catch((err) => { if (!cancelled) setError(err); });
    return () => { cancelled = true; };
  }, [q, category, scope]);
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (results === null) return html`<div class="spin">Searching “${q}”…</div>`;
  const groups = [];
  for (const r of results) {
    if (!groups.length || groups[groups.length - 1].key !== r.source_key)
      groups.push({ key: r.source_key, name: r.short_name || r.source_name, items: [] });
    groups[groups.length - 1].items.push(r);
  }
  return html`
    <div>
      <div class="crumbs"><a onClick=${back}>Library</a> / search</div>
      <h2>“${q}” — ${results.length} hit${results.length === 1 ? "" : "s"} in public clause text</h2>
      <div class="readerbar">
        <span class="count">scope:</span>
        ${families.map((f) => html`
          <button key=${f.key} class=${"catchip" + (scope === f.key ? " on" : "")}
                  onClick=${() => setScope(scope === f.key ? null : f.key)}>${f.name.split(" (")[0]}</button>`)}
        <span class="count">type:</span>
        ${((meta && meta.annotation_categories) || []).map((c) => html`
          <button key=${c} class=${"catchip" + (category === c ? " on" : "")}
                  onClick=${() => setCategory(category === c ? null : c)}>${c}</button>`)}
      </div>
      ${results.length === 0 && html`<div class="empty">No public clause matches.</div>`}
      ${groups.map((g) => html`
        <div key=${g.key}>
          <div class="dayhead">${g.name} · ${g.items.length} hit${g.items.length === 1 ? "" : "s"}</div>
          ${g.items.map((r, i) => html`
            <div class="result" key=${i} onClick=${() => open(r.source_key, r.ref, r.doc_node_id, r.version_label)}>
              <div class="where">
                <span class="mono">${r.ref || r.grain}</span>
                ${r.context ? ` · ${r.context}` : ""}
              </div>
              <div dangerouslySetInnerHTML=${{ __html: highlight(r.snippet, q) }} />
            </div>`)}
        </div>`)}
    </div>`;
}

function ChangesView({ open }) {
  const [changes, setChanges] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => { api("/api/clhear/changes").then(setChanges).catch(setError); }, []);
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (changes === null) return html`<div class="spin">Loading changes…</div>`;
  return html`
    <div>
      <h2>Change events</h2>
      ${changes.length === 0 && html`<div class="empty">No changes detected yet.</div>`}
      ${changes.map((c) => html`
        <div class="change" key=${c.id}>
          <a href=${sourceUrl(c.source_key, c.new_version)} onClick=${(e) => { e.preventDefault(); open(c.source_key, null, null, c.new_version); }}>${c.source_name}</a> —
          <span class=${"kind-" + c.kind}>${c.kind}</span>
          ${c.old_version ? ` ${c.old_version} → ` : " → "}${c.new_version}
          <span style=${{ color: "var(--muted)" }}> · detected ${c.detected_at}</span>
          ${c.clause_refs.length > 0 && html`
            <div class="refs">${c.clause_refs.length} clause(s): ${c.clause_refs.slice(0, 30).join(", ")}${c.clause_refs.length > 30 ? " …" : ""}</div>`}
        </div>`)}
    </div>`;
}

const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function highlight(snippet, q) {
  const safe = esc(snippet);
  return safe.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
}

createRoot(document.getElementById("root")).render(React.createElement(App));
