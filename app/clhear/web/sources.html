<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLHEAR · Sources Explorer</title>
<style>
  /* Reg42 UI language: indigo / pearl / mint tokens (Solon reference) */
  :root {
    --indigo-900: #1e1b4b; --indigo-700: #4338ca; --indigo-500: #6366f1; --indigo-100: #e0e7ff;
    --pearl: #f8f7f4; --pearl-dark: #edeae3;
    --mint-600: #059669; --mint-100: #d1fae5;
    --rose-600: #e11d48; --rose-100: #ffe4e6;
    --amber-600: #d97706; --amber-100: #fef3c7;
    --ink: #17163a; --muted: #6b6a8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--pearl); color: var(--ink);
         font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: var(--indigo-900); color: var(--indigo-100); padding: 14px 28px;
           display: flex; align-items: baseline; gap: 14px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.04em; cursor: pointer; }
  header .sub { font-size: 13px; opacity: 0.75; flex: 1; }
  header input { border: none; border-radius: 8px; padding: 7px 12px; font-size: 13px; width: 340px;
                 background: rgba(255,255,255,0.12); color: white; }
  header input::placeholder { color: rgba(255,255,255,0.5); }
  main { max-width: 1600px; margin: 24px auto; padding: 0 20px; }
  a { color: var(--indigo-700); text-decoration: none; }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .crumbs a { cursor: pointer; }
  .family { background: white; border: 1px solid var(--pearl-dark); border-radius: 12px;
            padding: 18px 20px; margin-bottom: 16px; }
  .family h2 { margin: 0 0 4px; font-size: 16px; }
  .charter { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .schedbar { font-size: 12.5px; background: white; border: 1px solid var(--pearl-dark); border-radius: 8px; padding: 8px 12px; margin: 8px 0 16px; }
  .scheditem { display: inline-block; margin: 2px 10px 2px 0; padding: 2px 8px; border: 1px solid var(--pearl-dark); border-radius: 999px; background: var(--pearl); white-space: nowrap; }
  table.members { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.members th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
                     padding: 6px 8px; border-bottom: 1px solid var(--pearl-dark); }
  table.members td { padding: 8px; border-bottom: 1px solid var(--pearl); vertical-align: top; }
  .srcname { cursor: pointer; color: var(--indigo-700); font-weight: 600; }
  .srcname.stub { color: var(--ink); font-weight: 500; cursor: default; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; white-space: nowrap; }
  .badge.open { background: var(--mint-100); color: var(--mint-600); }
  .badge.restricted { background: var(--rose-100); color: var(--rose-600); }
  .badge.binding { background: var(--indigo-100); color: var(--indigo-700); }
  .badge.guidance { background: var(--amber-100); color: var(--amber-600); }
  .badge.citator { background: var(--amber-100); color: var(--amber-600); }
  .badge.root { background: var(--indigo-900); color: white; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .meta-grid { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--muted);
               margin: 8px 0 16px; }
  .meta-grid b { color: var(--ink); font-weight: 600; }
  .locked { background: var(--rose-100); border-radius: 10px; padding: 14px 18px; color: var(--rose-600);
            margin-bottom: 12px; font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 46px 0; }
  .result { background: white; border: 1px solid var(--pearl-dark); border-radius: 10px;
            padding: 12px 16px; margin-bottom: 10px; cursor: pointer; }
  .result .where { font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  .result mark { background: var(--indigo-100); color: var(--indigo-900); border-radius: 3px; padding: 0 2px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button { border: 1px solid var(--pearl-dark); background: white; border-radius: 999px;
                 padding: 6px 16px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .tabs button.active { background: var(--indigo-700); border-color: var(--indigo-700); color: white; }
  .change { background: white; border: 1px solid var(--pearl-dark); border-left: 4px solid var(--mint-600);
            border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; font-size: 13.5px; }
  .change .kind-amended { color: var(--amber-600); font-weight: 700; }
  .change .kind-added { color: var(--mint-600); font-weight: 700; }
  .change .refs { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted);
                  margin-top: 4px; word-break: break-all; }
  .spin { text-align: center; color: var(--muted); padding: 30px; }

  /* ---------------------- current text + provenance ------------------------ */
  .about { font-size: 13px; color: var(--muted); max-width: 860px; margin: -6px 0 12px; }
  .topic { display: inline-block; background: var(--indigo-100); color: var(--indigo-700);
           border-radius: 999px; padding: 1px 9px; font-size: 11px; margin-left: 6px; }
  .kindbadge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px;
               font-weight: 600; cursor: help; }
  .kindbadge.as_published { background: var(--indigo-100); color: var(--indigo-700); }
  .kindbadge.consolidated { background: var(--mint-100); color: var(--mint-600); }
  .kindbadge.edition { background: var(--amber-100); color: var(--amber-600); }
  .curbadge { display: flex; align-items: center; gap: 10px; background: white;
              border: 1px solid var(--pearl-dark); border-left: 4px solid var(--mint-600);
              border-radius: 10px; padding: 10px 16px; margin-bottom: 12px; font-size: 14px; }
  .curbadge b { font-size: 15px; }
  .curbadge .info { border: 1px solid var(--pearl-dark); background: white; color: var(--muted);
                    border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; margin-left: auto; }
  .legend { background: white; border: 1px solid var(--pearl-dark); border-radius: 10px;
            padding: 14px 18px; margin-bottom: 12px; font-size: 13px; }
  .legend dt { margin-top: 8px; }
  .legend dd { margin: 2px 0 0; color: var(--muted); }
  details.prov { background: white; border: 1px solid var(--pearl-dark); border-radius: 10px;
                 padding: 10px 16px; margin-bottom: 12px; font-size: 13.5px; }
  details.prov summary { cursor: pointer; font-weight: 600; color: var(--indigo-700); }
  .prov h4 { margin: 12px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase;
             letter-spacing: 0.05em; }
  .provrow { display: flex; align-items: center; gap: 10px; padding: 6px 0;
             border-bottom: 1px solid var(--pearl); }
  .provrow:last-child { border-bottom: none; }
  .provrow .open { cursor: pointer; color: var(--indigo-700); font-weight: 600; }
  .provrow.viewing { background: rgba(99,102,241,0.06); border-radius: 6px; }
  .notice { background: var(--indigo-100); color: var(--indigo-900); border-radius: 10px;
            padding: 10px 16px; margin-bottom: 12px; font-size: 13.5px; }
  .notice a { font-weight: 700; cursor: pointer; }

  /* ------------------------- TOC + reader tools --------------------------- */
  .toc { position: sticky; top: 72px; width: 300px; flex-shrink: 0; max-height: calc(100vh - 100px);
         overflow-x: hidden; overflow-y: auto; background: white; border: 1px solid var(--pearl-dark);
         border-radius: 12px; padding: 12px 10px; font-size: 12.5px; }
  .toc h3 { margin: 0 0 8px 6px; font-size: 11.5px; color: var(--muted); text-transform: uppercase;
            letter-spacing: 0.06em; }
  .toc a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--ink); cursor: pointer;
           white-space: normal; overflow: visible; overflow-wrap: anywhere; word-break: break-word;
           text-overflow: clip; }
  .toc a:hover { background: var(--indigo-100); color: var(--indigo-700); }
  .toc a.lvl1 { font-weight: 700; }
  .toc a.lvl2 { padding-left: 20px; color: var(--muted); }
  .readerbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .readerbar input { border: 1px solid var(--pearl-dark); border-radius: 8px; padding: 6px 12px;
                     font-size: 13px; width: 300px; background: white; }
  .readerbar .count { font-size: 12px; color: var(--muted); }
  .catchip { border: 1px solid var(--pearl-dark); background: white; border-radius: 999px;
             padding: 3px 11px; font-size: 11.5px; cursor: pointer; color: var(--muted); }
  .catchip.on { border-color: var(--indigo-700); color: var(--indigo-700); font-weight: 700; }
  .annot { margin: 4px 0 10px; padding: 8px 12px; background: var(--pearl); border-left: 3px solid var(--indigo-500);
           border-radius: 6px; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .annot .tag { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
                margin-right: 8px; }
  .annot .cat { display: inline-block; background: var(--indigo-100); color: var(--indigo-700);
                border-radius: 999px; padding: 1px 9px; font-size: 11px; margin-right: 5px; }

  /* ------------------------------ document view ------------------------------ */
  .layout { display: flex; gap: 22px; align-items: flex-start; }
  .doc {
    flex: 1; min-width: 0; background: white; border: 1px solid var(--pearl-dark);
    border-radius: 12px; padding: 44px 56px 72px; max-width: 860px;
    font: 16.5px/1.7 Georgia, "Times New Roman", serif; color: var(--ink);
  }
  .n { position: relative; border-radius: 3px; }
  .n:hover { background: rgba(99, 102, 241, 0.06); box-shadow: 0 1px 0 var(--indigo-500); cursor: pointer; }
  .n.amended { background: var(--amber-100); }
  .n.selected { outline: 2px solid var(--indigo-500); outline-offset: 2px; }
  .n.title { text-align: center; font-weight: 700; margin: 6px 0; }
  .n.title.docfirst { font-size: 17px; letter-spacing: 0.01em; }
  .n.part { margin: 34px 0 10px; text-align: center; font-family: -apple-system, "Segoe UI", sans-serif;
            font-size: 19px; font-weight: 700; letter-spacing: 0.02em; color: var(--indigo-900); }
  .n.chapter { margin: 30px 0 8px; text-align: center; }
  .n.chapter .lab { display: block; font-family: -apple-system, "Segoe UI", sans-serif;
                    font-size: 15px; letter-spacing: 0.14em; font-weight: 600; color: var(--indigo-700); }
  .n.chapter .hd { display: block; font-size: 17px; font-weight: 700; font-style: italic; }
  .n.group { margin: 22px 0 6px; text-align: center; }
  .n.group .lab { display: block; font-size: 13.5px; letter-spacing: 0.12em; font-weight: 600; color: var(--muted); }
  .n.group .hd { display: block; font-size: 15.5px; font-weight: 700; font-style: italic; }
  .n.heading { margin: 18px 0 6px; font-size: 15.5px; font-weight: 700;
               font-family: -apple-system, "Segoe UI", sans-serif; }
  .n.schedule { margin: 36px 0 10px; text-align: center; }
  .n.schedule .lab { display: block; font-size: 14px; letter-spacing: 0.1em; font-weight: 700; }
  .n.schedule .hd { display: block; font-size: 16px; font-weight: 700; }
  .n.article { margin: 22px 0 6px; text-align: center; }
  .n.article .lab { display: block; font-weight: 700; }
  .n.article .hd { display: block; font-style: italic; font-weight: 600; }
  .n.provision, .n.section, .n.control, .n.enhancement { margin: 14px 0 4px; }
  .n.provision .hd, .n.section .hd, .n.control .hd, .n.enhancement .hd { font-weight: 700; }
  .n.subsection { margin: 8px 0 2px; }
  .n.subsection .hd { font-weight: 700; font-size: 15px; }
  .n.paragraph, .n.subparagraph, .n.statement { margin: 4px 0; }
  .n.point { margin: 3px 0; }
  .n.recital { margin: 5px 0; }
  .n.recital .lab, .n.point .lab { display: inline-block; min-width: 2.4em; font-weight: 400; }
  .n.preamble { margin: 6px 0; }
  .n.signature { margin: 14px 0 2px; font-style: italic; }
  .n.note { margin: 4px 0; font-size: 13.5px; color: var(--muted); }
  .lab { font-weight: 700; margin-right: 0.55em; font-variant-numeric: lining-nums; }
  .hd { font-weight: 600; }
  .float {
    position: absolute; top: -11px; right: 0; z-index: 2;
    font: 11px/1.3 ui-monospace, Menlo, monospace; background: var(--indigo-900); color: var(--indigo-100);
    border-radius: 6px; padding: 3px 8px; pointer-events: none; white-space: nowrap;
  }
  .inspector {
    position: sticky; top: 72px; width: 380px; flex-shrink: 0;
    max-height: calc(100vh - 100px); overflow-x: hidden; overflow-y: auto;
    background: white; border: 1px solid var(--pearl-dark); border-radius: 12px;
    padding: 16px 18px; font-size: 13px;
  }
  .inspector h3 { margin: 0 0 8px; font-size: 14px; }
  .inspector dt { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .inspector dd { margin: 0; word-break: break-word; overflow-wrap: anywhere; }
  .inspector pre { background: var(--pearl); border-radius: 8px; padding: 8px 10px;
                   font-size: 11.5px; overflow: auto; max-height: min(40vh, 480px); white-space: pre-wrap;
                   overflow-wrap: anywhere; }
  .inspector .contains { max-height: min(40vh, 480px); overflow: auto; white-space: pre-wrap;
                         overflow-wrap: anywhere; }
  .inspector button { border: 1px solid var(--indigo-700); color: var(--indigo-700); background: white;
                      border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; margin-top: 10px; }
  .mode { margin-bottom: 12px; }

  /* ------------------------------ activity feed ------------------------------ */
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  .dot.success { background: var(--mint-600); }
  .dot.warning { background: var(--amber-600); }
  .dot.failure { background: var(--rose-600); }
  .dot.info { background: var(--indigo-100); border: 1px solid var(--indigo-500); }
  .dot.running { background: var(--indigo-500); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .dayhead { margin: 20px 0 8px; font-size: 12.5px; font-weight: 700; color: var(--muted);
             text-transform: uppercase; letter-spacing: 0.06em; }
  .act { background: white; border: 1px solid var(--pearl-dark); border-radius: 10px;
         padding: 10px 14px; margin-bottom: 8px; font-size: 13.5px; display: flex;
         align-items: flex-start; gap: 8px; }
  .act .fleetbadge { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
                     background: var(--pearl); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .act .when { color: var(--muted); font-size: 12px; white-space: nowrap; margin-left: auto; }
  .act .body { flex: 1; min-width: 0; }
  .act .links a { margin-right: 10px; cursor: pointer; font-size: 12.5px; }
  .act details { margin-top: 4px; }
  .act details pre { background: var(--pearl); border-radius: 8px; padding: 8px 10px; font-size: 11.5px;
                     overflow: auto; max-height: 220px; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--pearl-dark); background: white; border-radius: 999px;
                    padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .filters button.on { border-color: var(--indigo-700); color: var(--indigo-700); font-weight: 600; }

  /* ------------------------------ fleet view -------------------------------- */
  table.fleet { width: 100%; border-collapse: collapse; font-size: 13px; background: white;
                border: 1px solid var(--pearl-dark); border-radius: 12px; overflow: hidden; }
  table.fleet th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px;
                   text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 12px;
                   border-bottom: 1px solid var(--pearl-dark); background: var(--pearl); }
  table.fleet td { padding: 10px 12px; border-bottom: 1px solid var(--pearl); vertical-align: middle; }
  .stagechip { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 11px;
               font-family: ui-monospace, Menlo, monospace; margin-right: 4px; margin-bottom: 3px;
               background: var(--pearl); color: var(--muted); }
  .stagechip.success { background: var(--mint-100); color: var(--mint-600); }
  .stagechip.warning { background: var(--amber-100); color: var(--amber-600); }
  .stagechip.failure { background: var(--rose-100); color: var(--rose-600); }
  .runlink { cursor: pointer; color: var(--indigo-700); font-weight: 600; }
  .dagwrap { background: white; border: 1px solid var(--pearl-dark); border-radius: 12px;
             padding: 18px 20px; margin-bottom: 16px; }
  .dagwrap h3 { margin: 0 0 4px; font-size: 15px; }
  .playbtn { border: 1px solid var(--indigo-700); color: var(--indigo-700); background: white;
             border-radius: 999px; padding: 5px 16px; cursor: pointer; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1 id="home">CLHEAR</h1>
  <span class="sub">Sources Explorer — verbatim regulatory ground truth</span>
  <input id="q" placeholder="Search verbatim clause text (e.g. customer due diligence)…" />
</header>
<main id="root"></main>

<!-- no-build frontend: React 18 + htm, per repo convention -->
<script type="module">
import React, { useState, useEffect, useRef } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(React.createElement);
const api = (p) => fetch(p).then((r) => { if (!r.ok) throw new Error(r.statusText); return r.json(); });
const ws = (s) => (s || "").split(/\s+/).join(" ").trim();

let _meta = null;
const getMeta = () => (_meta ? Promise.resolve(_meta) : api("/api/clhear/meta").then((m) => (_meta = m)));
const kindLabel = (meta, kind) => (meta && meta.version_kinds[kind] ? meta.version_kinds[kind].label : kind);
const kindDef = (meta, kind) => (meta && meta.version_kinds[kind] ? meta.version_kinds[kind].definition : "");

function initialView() {
  const p = new URLSearchParams(location.search);
  if (p.get("source")) {
    return { page: "source", key: p.get("source"), nodeId: p.get("node") ? Number(p.get("node")) : null, ref: null };
  }
  if (p.get("view")) return { page: p.get("view") };
  return { page: "library" };
}

function App() {
  const [view, setView] = useState(initialView);
  const [families, setFamilies] = useState(null);
  const [query, setQuery] = useState("");

  useEffect(() => { api("/api/clhear/sources").then(setFamilies).catch(() => setFamilies([])); }, []);
  useEffect(() => {
    const input = document.getElementById("q");
    const handler = (e) => {
      if (e.key === "Enter" && input.value.trim().length >= 2) {
        setQuery(input.value.trim());
        setView({ page: "search" });
      }
    };
    input.addEventListener("keydown", handler);
    const home = document.getElementById("home");
    const goHome = () => { history.replaceState({}, "", "/sources"); setView({ page: "library" }); };
    home.addEventListener("click", goHome);
    return () => { input.removeEventListener("keydown", handler); home.removeEventListener("click", goHome); };
  }, []);

  const openSource = (key, ref, nodeId) => {
    const q = new URLSearchParams({ source: key });
    if (nodeId) q.set("node", String(nodeId));
    history.replaceState({}, "", `/sources?${q}`);
    setView({ page: "source", key, ref, nodeId: nodeId || null });
  };
  const go = (page) => {
    history.replaceState({}, "", page === "library" ? "/sources" : `/sources?view=${page}`);
    setView({ page });
  };

  if (families === null) return html`<div class="spin">Loading corpus…</div>`;
  const tabs = html`
    <div class="tabs">
      <button class=${view.page === "library" ? "active" : ""} onClick=${() => go("library")}>Library</button>
      <button class=${view.page === "activity" ? "active" : ""} onClick=${() => go("activity")}>Activity</button>
      <button class=${view.page === "fleet" ? "active" : ""} onClick=${() => go("fleet")}>Fleet</button>
      <button class=${view.page === "changes" ? "active" : ""} onClick=${() => go("changes")}>Change events</button>
      <button class=${view.page === "evidence" ? "active" : ""} onClick=${() => go("evidence")}>Evidence</button>
    </div>`;
  if (view.page === "source") return html`<${SourceView} sourceKey=${view.key} back=${() => go("library")} openRef=${view.ref} openNodeId=${view.nodeId} />`;
  if (view.page === "search") return html`<${SearchView} q=${query} open=${openSource} back=${() => go("library")} />`;
  if (view.page === "changes") return html`<div>${tabs}<${ChangesView} open=${(key) => openSource(key)} /></div>`;
  if (view.page === "activity") return html`<div>${tabs}<${ActivityView} open=${openSource} /></div>`;
  if (view.page === "fleet") return html`<div>${tabs}<${FleetView} open=${openSource} /></div>`;
  if (view.page === "evidence") return html`<div>${tabs}<${EvidenceIndex} families=${families} open=${(key) => openSource(key)} /></div>`;
  return html`<div>${tabs}<${Library} families=${families} open=${(key) => openSource(key)} /></div>`;
}

function Library({ families, open }) {
  const [meta, setMeta] = useState(_meta);
  useEffect(() => { getMeta().then(setMeta); }, []);
  const allMembers = families.flatMap((f) => f.members);
  const ingested = allMembers.filter((m) => m.library_status === "ingested" || m.latest_version);
  const failed = allMembers.filter((m) => m.library_status === "failed-today");
  const never = allMembers.filter((m) => m.library_status === "never-fetched");
  const locked = allMembers.filter((m) => m.library_status === "locked-restricted");
  return html`
    <div>
      ${meta && meta.schedules && html`
        <div class="schedbar">
          <strong>L1 fleet</strong> runs daily at 00:00 UTC
          ${Object.entries(meta.schedules).map(([k, s]) => html`
            <span class="scheditem" key=${k} title=${s.covers}>
              <span class="mono">${k}</span> ${s.cadence} · ${s.utc_time} UTC
            </span>`)}
        </div>`}
      ${families.length === 0 && html`<div class="empty">No sources ingested yet.</div>`}
      ${families.map((f) => html`
        <div class="family" key=${f.key}>
          <h2>${f.name}</h2>
          ${f.scope_charter && f.scope_charter.binding && html`
            <div class="charter">charter — binding: ${f.scope_charter.binding}${f.scope_charter.out ? ` · out of scope: ${[].concat(f.scope_charter.out).join(", ")}` : ""}</div>`}
          ${f.scope_charter && f.scope_charter.registry && html`
            <div class="charter">${f.scope_charter.registry}${f.scope_charter.partner ? ` · partner: ${f.scope_charter.partner}` : ""}</div>`}
          <table class="members">
            <thead><tr><th>source</th><th>relation</th><th>tier</th><th>license</th><th>version</th><th>clauses</th><th>added via</th></tr></thead>
            <tbody>
            ${f.members.map((m) => html`
              <tr key=${m.key}>
                <td>
                  <span class=${"srcname" + (m.latest_version || m.library_status === "locked-restricted" || m.library_status === "failed-today" ? "" : " stub")} title=${m.name}
                        onClick=${() => open(m.key)}>${m.short_name || m.name}</span>
                  ${m.short_name && html`<div class="charter" style=${{ margin: 0 }}>${m.name}</div>`}
                  <div class="mono">${m.key}</div>
                  ${m.about && html`<div class="about" style=${{ margin: "4px 0 0" }}>${m.about.slice(0, 220)}${m.about.length > 220 ? "…" : ""}
                    ${(m.topics || []).map((t) => html`<span class="topic" key=${t}>${t}</span>`)}</div>`}
                </td>
                <td><span class="badge ${m.relation === "root" ? "root" : "binding"}">${m.relation}</span></td>
                <td><span class="badge ${m.tier}">${m.tier}</span></td>
                <td><span class="badge ${m.license}">${m.license}</span></td>
                <td class="mono">${m.latest_version || m.library_status || "never-fetched"}</td>
                <td class="mono">${m.clauses || ""}</td>
                <td>${m.added_via === "citator" ? html`<span class="badge citator">citator</span>` : m.added_via}</td>
              </tr>`)}
            </tbody>
          </table>
        </div>`)}
      <div class="charter" style=${{ textAlign: "center" }}>
        ${ingested.length} ingested · ${failed.length} failed-today · ${never.length} never-fetched · ${locked.length} locked-restricted
        · every ingest passes a 99.5% fidelity gate against the official artifact · scorecards at https://clhear.reg42.ai
      </div>
    </div>`;
}

/* ------------------------------- document view ------------------------------ */
function SourceView({ sourceKey, back, openRef, openNodeId }) {
  const [detail, setDetail] = useState(null);
  const [doc, setDoc] = useState(null);
  const [version, setVersion] = useState(null);
  const [inspect, setInspect] = useState(false);
  const [evidence, setEvidence] = useState(false);
  const [scorecard, setScorecard] = useState(null);
  const [hoverId, setHoverId] = useState(null);
  const [selectedId, setSelectedId] = useState(openNodeId || null);
  const [info, setInfo] = useState(null);
  const [meta, setMeta] = useState(_meta);
  const [legend, setLegend] = useState(false);
  const [explain, setExplain] = useState(false);
  const [filter, setFilter] = useState("");
  const [category, setCategory] = useState(null);
  const scrolled = useRef(false);

  useEffect(() => { getMeta().then(setMeta); }, []);
  useEffect(() => {
    setDetail(null); setDoc(null); scrolled.current = false; setFilter(""); setCategory(null);
    api(`/api/clhear/sources/${sourceKey}`).then(setDetail);
    api(`/api/clhear/sources/${sourceKey}/evals`).then(setScorecard).catch(() => setScorecard(null));
    const q = version ? `?version_label=${encodeURIComponent(version)}` : "";
    api(`/api/clhear/sources/${sourceKey}/document${q}`).then(setDoc);
  }, [sourceKey, version]);

  useEffect(() => {
    if (selectedId) api(`/api/clhear/nodes/${selectedId}`).then(setInfo).catch(() => setInfo(null));
    else setInfo(null);
  }, [selectedId]);

  useEffect(() => {
    if (!doc || scrolled.current) return;
    const target = openNodeId
      ? document.getElementById("node-" + openNodeId)
      : (openRef && doc.nodes.find((n) => n.ref === openRef)
          ? document.getElementById("node-" + doc.nodes.find((n) => n.ref === openRef).id)
          : null);
    if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      scrolled.current = true;
      if (!selectedId) { setInspect(true); setSelectedId(Number(target.id.replace("node-", ""))); }
    }
  }, [doc]);

  if (!detail || !doc) return html`<div class="spin">Loading ${sourceKey}…</div>`;
  const amended = new Set(doc.amended_refs || []);
  const toc = buildToc(doc.nodes);
  const { visible, matches } = computeVisible(doc.nodes, filter, category);
  const selectedNode = selectedId && doc.nodes.find((n) => n.id === selectedId);
  const annotationHit = selectedNode ? inheritAnnotation(doc.nodes, selectedNode) : { annotation: null, from: null };
  const selectedAnnotation = annotationHit.annotation;
  const annotationFrom = annotationHit.from;
  // Container nodes (TITLE/CHAPTER) have no raw_text of their own: show every
  // descendant's stored label/heading/body, not a truncated preview.
  let containsPreview = null;
  if (selectedNode && !ws(selectedNode.raw_text || "")) {
    const kids = [];
    const collect = (parentId) => {
      for (const n of doc.nodes) {
        if (n.parent_id !== parentId) continue;
        kids.push(n);
        collect(n.id);
      }
    };
    collect(selectedNode.id);
    const text = kids.map((k) => ws(`${k.label || ""} ${k.heading || ""} ${k.raw_text || ""}`)).filter(Boolean).join("\n");
    if (text) containsPreview = { count: kids.length, text };
  }

  return html`
    <div>
      <div class="crumbs"><a onClick=${back}>Library</a> / ${detail.short_name || detail.name}</div>
      <h2 style=${{ margin: "0 0 2px" }}>${detail.short_name || detail.name}</h2>
      ${detail.short_name && html`<div class="charter" style=${{ marginBottom: "8px" }}>${detail.name}</div>`}
      <div class="meta-grid">
        <span>issuer <b>${detail.issuer}</b></span>
        <span>jurisdiction <b>${detail.jurisdiction}</b></span>
        <span>license <span class="badge ${detail.license}">${detail.license}</span> ${detail.license_ref}</span>
        <span>adapter <b>${detail.adapter}</b></span>
        <span><a href=${detail.canonical_url} target="_blank" rel="noreferrer">official source ↗</a></span>
      </div>
      ${detail.about && html`
        <div class="about">${detail.about}
          ${(detail.topics || []).map((t) => html`<span class="topic" key=${t}>${t}</span>`)}
        </div>`}
      <${CurrentTextBadge} detail=${detail} doc=${doc} meta=${meta}
        viewing=${doc.version} reset=${() => setVersion(null)} toggleLegend=${() => setLegend(!legend)} />
      ${legend && html`<${KindLegend} meta=${meta} />`}
      <${ProvenancePanel} detail=${detail} meta=${meta} viewing=${doc.version} openVersion=${setVersion} />
      ${doc.as_published_sibling && html`
        <div class="notice">
          You are reading the <b>${kindLabel(meta, doc.version_kind)}</b> text — enacting terms only.
          The preamble and recitals are part of the original act:${" "}
          <a onClick=${() => setVersion(doc.as_published_sibling)}>open the as-published version →</a>
        </div>`}
      <div class="meta-grid">
        <span>retrieved <b>${doc.retrieved_at}</b></span>
        <span>sha256 <span class="mono">${(doc.content_hash || "").slice(0, 16)}…</span></span>
        <span>original <span class="mono">${doc.s3_uri}</span></span>
        <span><b>${doc.total}</b> nodes</span>
      </div>
      <div class="tabs mode">
        <button class=${!inspect && !evidence ? "active" : ""} onClick=${() => { setInspect(false); setEvidence(false); }}>document</button>
        <button class=${inspect ? "active" : ""} onClick=${() => { setInspect(true); setEvidence(false); }}>inspect</button>
        <button class=${explain ? "active" : ""} onClick=${() => setExplain(!explain)}>explain</button>
        <button class=${evidence ? "active" : ""} onClick=${() => { setEvidence(true); setInspect(false); }}>evidence</button>
      </div>
      ${detail.changes.length > 0 && html`
        <div class="change">
          latest change: <span class=${"kind-" + detail.changes[0].kind}>${detail.changes[0].kind}</span>
          ${detail.changes[0].old_version ? ` ${detail.changes[0].old_version} → ` : " → "}${detail.changes[0].new_version}
          ${detail.changes[0].clause_refs.length > 0 && html`
            <div class="refs">${detail.changes[0].clause_refs.length} clause(s): ${detail.changes[0].clause_refs.slice(0, 25).join(", ")}${detail.changes[0].clause_refs.length > 25 ? " …" : ""}</div>`}
        </div>`}
      ${doc.locked && html`
        <div class="locked">This source is license-restricted: structure, references and integrity hashes are
        public, verbatim text is not until a BYOL file is in <span class="mono">restricted/${sourceKey}/</span>.</div>`}
      ${evidence && html`<${EvidencePanel} card=${scorecard} sourceKey=${sourceKey} />`}
      <div class="readerbar">
        <input placeholder="Filter this document… (e.g. risk assessment)"
               value=${filter} onInput=${(e) => setFilter(e.target.value)} />
        ${(meta ? meta.annotation_categories : []).map((c) => html`
          <button key=${c} class=${"catchip" + (category === c ? " on" : "")}
                  onClick=${() => setCategory(category === c ? null : c)}>${c}</button>`)}
        ${(filter.trim().length >= 2 || category) && html`
          <span class="count">${matches} matching clause${matches === 1 ? "" : "s"}</span>
          <button class="catchip" onClick=${() => { setFilter(""); setCategory(null); }}>clear</button>`}
      </div>
      <div class="layout">
        ${toc.length > 1 && html`
          <nav class="toc">
            <h3>Contents</h3>
            ${toc.map((t) => html`
              <a key=${t.id} class=${t.level === 1 ? "lvl1" : "lvl2"} title=${t.text}
                 onClick=${() => { const el = document.getElementById("node-" + t.id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }}>
                ${t.text}
              </a>`)}
          </nav>`}
        <div class="doc">
          ${visible !== null && visible.size === 0 && html`
            <div class="empty">No clause in this document matches
              ${filter.trim().length >= 2 ? html` “${filter.trim()}”` : ""}${category ? html` (type: ${category})` : ""}.
              Try the global search box above — it covers every source.</div>`}
          ${doc.nodes.map((n, i) => (visible === null || visible.has(n.id)) && html`
            <${DocLine} key=${n.id} n=${n} first=${i === 0} amended=${amended.has(n.ref)}
              inspect=${inspect} explain=${explain} hover=${hoverId === n.id} selected=${selectedId === n.id}
              onEnter=${() => inspect && setHoverId(n.id)}
              onLeave=${() => hoverId === n.id && setHoverId(null)}
              onClick=${() => { setInspect(true); setSelectedId(n.id); }} />`)}
        </div>
        ${inspect && html`<${Inspector} info=${info} annotation=${selectedAnnotation} annotationFrom=${annotationFrom} contains=${containsPreview} />`}
      </div>
    </div>`;
}

const TOC_SPINE = new Set(["part", "chapter", "section", "group"]);
const TOC_ARTICLE = new Set(["article", "provision", "control"]);

function tocLabel(n) {
  const label = ws(n.label || "");
  const heading = ws(n.heading || "");
  if (label && heading && heading !== label) return `${label} — ${heading}`;
  return label || heading || ws(n.raw_text || "");
}

function buildToc(nodes) {
  const labeled = (n) => !!(ws(n.heading || "") || ws(n.label || ""));
  const spine = nodes.filter((n) => labeled(n) && TOC_SPINE.has(n.node_type));
  const annexes = nodes.filter((n) => n.node_type === "schedule" && labeled(n));
  const articles = nodes.filter((n) =>
    TOC_ARTICLE.has(n.node_type) && (n.heading || (n.label && n.node_type !== "provision"))
  );
  // Keep every labeled article. A previous 140-row wipe dropped MiCA's 149
  // articles when the OJ parser had not yet emitted TITLE/CHAPTER nodes.
  const picked = new Set([...spine, ...articles, ...annexes].map((n) => n.id));
  return nodes
    .filter((n) => picked.has(n.id))
    .map((n) => ({
      id: n.id,
      level: TOC_SPINE.has(n.node_type) || n.node_type === "schedule" ? 1 : 2,
      text: tocLabel(n),
    }));
}

function computeVisible(nodes, filter, category) {
  // Subtree-aware filtering. Categories live on clause-grain nodes while the
  // text lives in their descendants, so:
  //   1. category eligibility propagates DOWN from annotated clause nodes,
  //   2. a node matches if it or ANY DESCENDANT contains the term,
  //   3. visible = matches + their ancestors (headings) + their descendants
  //      (the actual text).
  const term = filter.trim().toLowerCase();
  const active = term.length >= 2 || category;
  if (!active) return { visible: null, matches: 0 };
  const byId = {};
  const children = {};
  for (const n of nodes) {
    byId[n.id] = n;
    if (n.parent_id) (children[n.parent_id] = children[n.parent_id] || []).push(n.id);
  }
  // 1. category eligibility (inherited downward from the annotated clause)
  const eligible = new Set();
  if (category) {
    const markSubtree = (id) => {
      if (eligible.has(id)) return;
      eligible.add(id);
      for (const c of children[id] || []) markSubtree(c);
    };
    for (const n of nodes) if (n.annotation && n.annotation.category === category) markSubtree(n.id);
  }
  const catOk = (n) => !category || eligible.has(n.id);
  // 2. text hits (per node)
  const selfHit = (n) =>
    term.length < 2 ||
    `${n.label || ""} ${n.heading || ""} ${n.raw_text || ""}`.toLowerCase().includes(term);
  // 3. matched = annotated-clause units (or any node when no category is set)
  //    whose subtree contains the term
  const visible = new Set();
  const matchedClauses = new Set();
  let rawHits = 0;
  const addAncestors = (n) => {
    let parent = n.parent_id;
    while (parent && !visible.has(parent)) { visible.add(parent); parent = byId[parent] && byId[parent].parent_id; }
  };
  const addSubtree = (id) => {
    if (!visible.has(id)) visible.add(id);
    for (const c of children[id] || []) addSubtree(c);
  };
  const clauseOf = (n) => {
    let cur = n;
    while (cur) {
      if (cur.annotation) return cur.id;
      cur = cur.parent_id ? byId[cur.parent_id] : null;
    }
    return null;
  };
  for (const n of nodes) {
    if (!catOk(n) || !selfHit(n)) continue;
    rawHits += 1;
    const clause = clauseOf(n);
    if (clause) matchedClauses.add(clause);
    visible.add(n.id);
    addAncestors(n);
    addSubtree(n.id);
  }
  return { visible: visible.size ? visible : new Set(), matches: matchedClauses.size || rawHits };
}

function CurrentTextBadge({ detail, doc, meta, viewing, reset, toggleLegend }) {
  const inForce = detail.versions.find((v) => v.status === "in_force");
  const viewingCurrent = inForce && viewing === inForce.version_label;
  const shown = detail.versions.find((v) => v.version_label === viewing) || inForce;
  if (!shown) return null;
  const when = shown.as_of_date || shown.version_label.split(":").pop();
  return html`
    <div class="curbadge" style=${viewingCurrent ? {} : { borderLeftColor: "var(--amber-600)" }}>
      ${viewingCurrent
        ? html`<span>Current text</span>`
        : html`<span>Viewing <b>${shown.status}</b> text</span>`}
      <span class="kindbadge ${shown.version_kind}" title=${kindDef(meta, shown.version_kind)}>
        ${kindLabel(meta, shown.version_kind)}${shown.version_kind === "edition" ? ` ${when}` : ` · ${when}`}
      </span>
      ${!viewingCurrent && html`<a style=${{ cursor: "pointer" }} onClick=${reset}>back to current text</a>`}
      <button class="info" onClick=${toggleLegend}>version kinds ⓘ</button>
    </div>`;
}

function KindLegend({ meta }) {
  if (!meta) return null;
  return html`
    <div class="legend">
      <b>What the version kinds mean</b>
      <dl>
        ${Object.entries(meta.version_kinds).map(([kind, entry]) => html`
          <div key=${kind}>
            <dt><span class="kindbadge ${kind}">${entry.label}</span></dt>
            <dd>${entry.definition}</dd>
          </div>`)}
      </dl>
    </div>`;
}

function ProvenancePanel({ detail, meta, viewing, openVersion }) {
  const states = (detail.provenance && detail.provenance.text_states) || [];
  const instruments = (detail.provenance && detail.provenance.related_instruments) || [];
  if (states.length <= 1 && instruments.length === 0) return null;
  return html`
    <details class="prov" open=${states.length > 1}>
      <summary>Provenance — what led to today's text
        (${states.length} text state${states.length === 1 ? "" : "s"}, ${instruments.length} related instrument${instruments.length === 1 ? "" : "s"})</summary>
      <h4>Text states</h4>
      ${states.map((v) => html`
        <div class=${"provrow" + (v.version_label === viewing ? " viewing" : "")} key=${v.version_label}>
          <span class="kindbadge ${v.version_kind}" title=${kindDef(meta, v.version_kind)}>${kindLabel(meta, v.version_kind)}</span>
          <span class="mono">${v.as_of_date || v.version_label}</span>
          <span class="badge ${v.status === "in_force" ? "open" : "citator"}">${v.status === "in_force" ? "in force" : "superseded"}</span>
          <span class="mono" style=${{ opacity: 0.6 }}>sha ${v.content_hash.slice(0, 10)}</span>
          ${v.version_label === viewing
            ? html`<span class="mono">viewing</span>`
            : html`<span class="open" onClick=${() => openVersion(v.version_label)}>open</span>`}
        </div>`)}
      ${instruments.length > 0 && html`
        <h4>Instruments that shaped this text</h4>
        ${instruments.slice(0, 60).map((i) => html`
          <div class="provrow" key=${i.key}>
            <span class="badge ${i.relation === "root" ? "root" : "binding"}">${i.relation}</span>
            <span class="badge ${i.tier}">${i.tier}</span>
            <span>${i.name}</span>
            <span class="mono">${i.key}</span>
            ${i.added_via === "citator" && html`<span class="badge citator">citator</span>`}
            <a href=${i.canonical_url} target="_blank" rel="noreferrer">official ↗</a>
          </div>`)}
        ${instruments.length > 60 && html`<div class="mono">… ${instruments.length - 60} more</div>`}`}
    </details>`;
}

function DocLine({ n, first, amended, inspect, explain, hover, selected, onEnter, onLeave, onClick }) {
  const centered = ["title", "part", "chapter", "group", "schedule", "article"].includes(n.node_type);
  const indent = centered ? 0 : Math.max(0, n.depth - 1) * 18;
  const classes = ["n", n.node_type, first && n.node_type === "title" && "docfirst",
                   amended && "amended", selected && "selected"].filter(Boolean).join(" ");
  const body = n.raw_text || "";
  // Official-layout dedup: never print the label when the visible text already
  // begins with it (the data-level invariant forbids it too; this is defense).
  const dupIn = (text) => text && ws(text).startsWith(ws(n.label)) && !/^[A-Za-z0-9]/.test(ws(text).slice(ws(n.label).length, ws(n.label).length + 1));
  const showLabel = n.label && !dupIn(n.heading) && !dupIn(body);
  const a = explain ? n.annotation : null;
  return html`
    <div id=${"node-" + n.id} class=${classes} style=${{ paddingLeft: indent + "px" }}
         onMouseEnter=${onEnter} onMouseLeave=${onLeave} onClick=${onClick}>
      ${showLabel && html`<span class="lab">${n.label}</span>`}
      ${n.heading && html`<span class="hd">${n.heading}</span>`}
      ${body && html`${showLabel || n.heading ? " " : ""}${body}`}
      ${inspect && hover && html`
        <span class="float">
          ${n.ref || n.node_type} · ${n.text_hash.slice(0, 8)}
          ${amended ? " · amended" : ""}
        </span>`}
      ${a && (a.summary || a.category) && html`
        <div class="annot">
          <span class="tag">${a.origin === "llm" ? "AI-generated explainer — not legal text" : "classification"}</span>
          ${a.category && html`<span class="cat">${a.category}</span>`}
          ${(a.topics || []).map((t) => html`<span class="cat" key=${t}>${t}</span>`)}
          ${a.summary && html`<div style=${{ marginTop: "4px" }}>${a.summary}</div>`}
        </div>`}
    </div>`;
}

function ancestorLabel(a) {
  const label = (a.label || "").trim();
  const heading = (a.heading || "").trim();
  if (label && heading && heading !== label) return `${label} — ${heading}`;
  return label || heading || a.ref || a.node_type;
}

function inheritAnnotation(nodes, selected) {
  const byId = {};
  for (const n of nodes) byId[n.id] = n;
  let cur = selected;
  while (cur) {
    if (cur.annotation && (cur.annotation.summary || cur.annotation.category)) {
      return { annotation: cur.annotation, from: cur === selected ? null : cur };
    }
    cur = cur.parent_id ? byId[cur.parent_id] : null;
  }
  return { annotation: null, from: null };
}

function Inspector({ info, annotation, annotationFrom, contains }) {
  if (!info) return html`<aside class="inspector"><h3>Inspector</h3><div class="charter">Hover and click any element in the document to see its corpus record — id, hash, version, change history, permalink. This is the L2-ready layer.</div></aside>`;
  const copy = () => navigator.clipboard.writeText(location.origin + info.permalink);
  return html`
    <aside class="inspector">
      <h3>${info.node_type}${info.ref ? ` · ${info.ref}` : ""}</h3>
      ${annotation && (annotation.summary || annotation.category) && html`
        <div class="annot">
          <span class="tag">${annotation.origin === "llm" ? "AI-generated explainer — not legal text" : "heuristic classification"}${annotationFrom ? ` · inherited from ${ancestorLabel(annotationFrom)}` : ""}</span>
          ${annotation.category && html`<span class="cat">${annotation.category}</span>`}
          ${(annotation.topics || []).map((t) => html`<span class="cat" key=${t}>${t}</span>`)}
          ${annotation.summary && html`<div style=${{ marginTop: "4px" }}>${annotation.summary}</div>`}
        </div>`}
      <dl>
        <dt>record id</dt><dd class="mono">${info.id}</dd>
        <dt>label</dt><dd>${info.label || "—"}</dd>
        <dt>sha256</dt><dd class="mono">${info.text_hash}</dd>
        <dt>version</dt><dd>${info.version_label}<div class="mono">retrieved ${info.retrieved_at}</div></dd>
        <dt>immutable original</dt><dd class="mono">${info.s3_uri}</dd>
        ${info.indexed_as && html`<dt>indexed as</dt><dd>${info.indexed_as}</dd>`}
        <dt>ancestors</dt>
        <dd>${info.ancestors.length === 0 ? "—" : info.ancestors.map((a) => ancestorLabel(a)).join(" › ")}</dd>
        ${info.changes.length > 0 && html`
          <dt>changes touching this ref</dt>
          <dd>${info.changes.map((c) => html`<div class=${"kind-" + c.kind}>${c.kind} ${c.old_version || ""} → ${c.new_version}</div>`)}</dd>`}
      </dl>
      ${contains && html`
        <div class="annot">
          <span class="tag">contains — ${contains.count} element${contains.count === 1 ? "" : "s"} (scroll for full stored text)</span>
          <div class="contains" style=${{ marginTop: "4px" }}>${contains.text}</div>
        </div>`}
      ${info.raw_text && html`<dt style=${{ marginTop: "10px" }}>raw text</dt><pre>${info.raw_text}</pre>`}
      ${info.source_fragment && html`<dt>source fragment</dt><pre>${info.source_fragment}</pre>`}
      <button onClick=${copy}>copy permalink</button>
    </aside>`;
}

function EvidencePanel({ card, sourceKey }) {

function FleetView({ open }) {

  const [stageLegend, setStageLegend] = useState(false);

  useEffect(() => { getMeta().then(setMeta); }, []);

  const load = () => {
    api("/api/clhear/fleet").then(setBoard).catch(() => setBoard([]));
    api("/api/clhear/jobs/latest").then(setJob).catch(() => setJob(false));
  };
  useEffect(() => { load(); }, []);
  useEffect(() => {
    // real-time: poll while the latest job (or any run) is executing

    return () => clearInterval(t);

  useEffect(() => {
    if (runId) api(`/api/clhear/runs/${runId}`).then(setRun).catch(() => setRun(null));

  if (board === null) return html`<div class="spin">Loading fleet…</div>`;

      ${meta && meta.schedules && html`
        <div class="schedbar">

            full fidelity pipeline and appear in Changes + Activity automatically.
          </div>
        </div>`}
      <div class="tabs mode">
        <button class=${mode === "canvas" ? "active" : ""} onClick=${() => setMode("canvas")}>workflow</button>
        <button class=${mode === "table" ? "active" : ""} onClick=${() => setMode("table")}>table</button>

/* Databricks-style job workflow canvas: lanes per source, task cards with
   live statuses, start/relay convergence, replay from the ledger. */
function JobCanvas({ job, selectRun, selectedRun }) {
  const allTasks = job.lanes.flatMap((l) => l.tasks).concat(job.relay ? [job.relay] : []);
  const ordered = [...allTasks].sort((a, b) => a.run_id - b.run_id);
  const [lit, setLit] = useState(new Set(ordered.map((t) => t.run_id)));
  const replay = () => {
    setLit(new Set());
    const total = Math.max(1, ordered.reduce((a, t) => a + (t.duration_ms || 1), 0));
    const scale = Math.min(1, 6000 / total);
    let t = 0;
    ordered.forEach((task) => {
      t += Math.max(200, (task.duration_ms || 1) * scale);
      setTimeout(() => setLit((prev) => new Set([...prev, task.run_id])), t);
    });
  };

  const W = 208, H = 66, GAPX = 54, LANEH = 86, LEFT = 96;
  const maxLen = Math.max(...job.lanes.map((l) => l.tasks.length));
  const relayX = LEFT + maxLen * (W + GAPX) + 30;
  const width = relayX + W + 30;
  const height = Math.max(2, job.lanes.length) * LANEH + 30;
  const midY = height / 2;
  const laneY = (i) => 20 + i * LANEH + H / 2;
  const pos = {};
  job.lanes.forEach((lane, li) =>
    lane.tasks.forEach((task, ti) => { pos[task.run_id] = { x: LEFT + ti * (W + GAPX), y: laneY(li) }; })
  );
  if (job.relay) pos[job.relay.run_id] = { x: relayX, y: midY };

  const statusColor = (task) =>
    !lit.has(task.run_id) ? "var(--pearl-dark)"
    : task.status === "failure" ? "var(--rose-600)"
    : task.status === "warning" ? "var(--amber-600)"
    : task.status === "running" ? "var(--indigo-500)"
    : task.status === "info" ? "var(--indigo-100)"
    : "var(--mint-600)";
  const counts = job.status_counts || {};

  const edgePath = (from, to) => {
    const x1 = from === 0 ? 44 : pos[from].x + W;
    const y1 = from === 0 ? midY : pos[from].y;
    const x2 = pos[to].x;
    const y2 = pos[to].y;
    const mx = (x1 + x2) / 2;
    return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
  };

  return html`
    <div class="dagwrap">
      <h3><span class="mono">${job.job_id}</span> · trigger ${job.trigger} · started ${job.started_at}
        · ${(job.total_duration_ms / 1000).toFixed(1)}s
        ${job.running ? html` · <span class="dot running"></span> running` : ""}</h3>
      <div class="charter">
        ${allTasks.length} tasks —
        ${["success", "warning", "failure", "running", "info"].filter((s) => counts[s])
          .map((s) => `${counts[s]} ${s}`).join(" · ")}
        · ${allTasks.reduce((a, t) => a + (t.nodes || 0), 0).toLocaleString()} document nodes processed
        in ${(job.total_duration_ms / 1000).toFixed(1)}s — real measured throughput, per stage below
        · click a task for its stage pipeline
      </div>
      <div style=${{ overflowX: "auto" }}>
        <svg width=${width} height=${height} style=${{ display: "block" }}>
          ${job.edges.map(([from, to], i) => {
            const on = (from === 0 || lit.has(from)) && lit.has(to);
            return html`<path key=${i} d=${edgePath(from, to)} fill="none"
              stroke=${on ? "var(--indigo-500)" : "var(--pearl-dark)"} stroke-width="1.8" />`;
          })}
          <circle cx="32" cy=${midY} r="13" fill="var(--indigo-900)" />
          <text x="32" y=${midY + 4} text-anchor="middle" font-size="11" fill="white">▶</text>
          <text x="32" y=${midY + 30} text-anchor="middle" font-size="10.5" fill="var(--muted)">job start</text>
          ${allTasks.map((task) => {
            const p = pos[task.run_id];
            const selected = selectedRun === task.run_id;
            return html`
              <g key=${task.run_id} style=${{ cursor: "pointer" }} onClick=${() => selectRun(task.run_id)}>
                <rect x=${p.x} y=${p.y - H / 2} width=${W} height=${H} rx="10"
                      fill="white" stroke=${statusColor(task)} stroke-width=${selected ? 3.5 : 2.2} />
                <circle cx=${p.x + 14} cy=${p.y - H / 2 + 15} r="4.5" fill=${statusColor(task)} />
                <text x=${p.x + 26} y=${p.y - H / 2 + 19}
                      font-family="ui-monospace, Menlo, monospace" font-size="11" fill="var(--muted)">
                  ${task.fleet} · #${task.run_id}</text>
                <text x=${p.x + 12} y=${p.y + 6} font-size="12" font-weight="700" fill="var(--ink)">
                  ${(task.short_name || task.source || "").slice(0, 26)}</text>
                <text x=${p.x + 12} y=${p.y + 22} font-size="10.5" fill="var(--muted)">
                  ${task.step.slice(0, 30)}${task.coverage != null ? ` · ${(task.coverage * 100).toFixed(1)}%` : ""}${task.duration_ms != null ? ` · ${(task.duration_ms / 1000).toFixed(1)}s` : ""}</text>
              </g>`;
          })}
        </svg>
      </div>
      <button class="playbtn" onClick=${replay}>▶ replay job</button>
    </div>`;
}

function chipStatus(stage, runStatus) {
  if (stage.stage === "salvage" || stage.stage === "llm_repair" || stage.stage === "hints") return "warning";
  if (stage.stage === "gate" && stage.coverage != null && stage.coverage < 0.995) return runStatus === "failure" ? "failure" : "warning";
  return runStatus === "failure" ? "failure" : "success";
}

function RunDag({ run, close, meta }) {
  const [lit, setLit] = useState(run.stages.length); // all lit by default
  const stages = run.stages;
  const W = 148, H = 92, GAP = 26;
  const width = Math.max(600, stages.length * (W + GAP));
  const replay = () => {
    setLit(0);
    const total = Math.max(1, stages.reduce((a, s) => a + (s.ms || 1), 0));
    const scale = Math.min(1, 4000 / total); // compress to <= 4s
    let t = 0;
    stages.forEach((s, i) => {
      t += Math.max(120, (s.ms || 1) * scale);
      setTimeout(() => setLit(i + 1), t);
    });
  };
  const color = (s, i) => {
    if (i >= lit) return "var(--pearl-dark)";
    if (["salvage", "llm_repair", "hints"].includes(s.stage)) return "var(--amber-600)";
    if (s.stage === "gate" && s.coverage != null && s.coverage < 0.995) return "var(--amber-600)";
    return run.status === "failed" && i === stages.length - 1 ? "var(--rose-600)" : "var(--mint-600)";
  };
  return html`
    <div class="dagwrap">
      <h3>run #${run.id} · <span class="mono">${run.fleet}</span> · ${run.status}
        ${run.outputs.coverage != null && html` · coverage ${(run.outputs.coverage * 100).toFixed(2)}%`}
        ${run.outputs.version && html` · <span class="mono">${run.outputs.version}</span>`}
      </h3>
      <div class="charter">
        trigger ${run.trigger} · ${run.created_at} · ${(run.duration_ms / 1000).toFixed(1)}s total
        ${run.outputs.llm_assisted ? " · LLM-assisted repair (ratification pending)" : ""}
        ${run.outputs.hints_used ? ` · ${run.outputs.hints_used.length} learned hint(s) applied` : ""}
      </div>
      <div style=${{ overflowX: "auto" }}>
        <svg width=${width} height=${H + 40} style=${{ display: "block" }}>
          ${stages.map((s, i) => {
            const x = i * (W + GAP);
            const attemptLoop = i > 0 && STAGE_ORDER.indexOf(s.stage) <= STAGE_ORDER.indexOf(stages[i - 1].stage);
            return html`
              <g key=${i}>
                <title>${meta && meta.stages ? meta.stages[s.stage] || s.stage : s.stage}</title>
                ${i > 0 && html`
                  <line x1=${x - GAP} y1=${H / 2} x2=${x} y2=${H / 2}
                        stroke=${i < lit ? "var(--indigo-500)" : "var(--pearl-dark)"} stroke-width="2" />
                  <polygon points=${`${x},${H / 2} ${x - 7},${H / 2 - 4} ${x - 7},${H / 2 + 4}`}
                           fill=${i < lit ? "var(--indigo-500)" : "var(--pearl-dark)"} />`}
                ${attemptLoop && html`
                  <path d=${`M ${x + W / 2} ${H - 6} C ${x + W / 2 - 40} ${H + 28}, ${x - GAP - W / 2 + 40} ${H + 28}, ${x - GAP - W / 2} ${H - 6}`}
                        fill="none" stroke="var(--amber-600)" stroke-width="1.5" stroke-dasharray="4 3" />`}
                <rect x=${x} y=${H / 2 - 32} width=${W} height="64" rx="10"
                      fill="white" stroke=${color(s, i)} stroke-width="2.5" />
                <text x=${x + W / 2} y=${H / 2 - 8} text-anchor="middle"
                      font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700"
                      fill="var(--ink)">${s.stage}${s.attempt > 1 ? ` #${s.attempt}` : ""}</text>
                <text x=${x + W / 2} y=${H / 2 + 12} text-anchor="middle" font-size="11" fill="var(--muted)">
                  ${s.coverage != null ? `${(s.coverage * 100).toFixed(2)}% · ` : ""}${s.nodes ? `${s.nodes} nodes · ` : ""}${s.ms}ms
                </text>
                ${s.stage === "diff" && html`
                  <text x=${x + W / 2} y=${H / 2 + 26} text-anchor="middle" font-size="10.5" fill="var(--muted)">
                    +${s.added || 0} ~${s.amended || 0} −${s.removed || 0}
                  </text>`}
                ${s.stage === "persist" && s.version && html`
                  <text x=${x + W / 2} y=${H / 2 + 26} text-anchor="middle" font-size="10.5" fill="var(--muted)">
                    ${String(s.version).slice(0, 22)}
                  </text>`}
              </g>`;
          })}
        </svg>
      </div>
      <button class="playbtn" onClick=${replay}>▶ replay run</button>
      ${" "}
      <button class="playbtn" onClick=${close}>close</button>
    </div>`;
}

function SearchView({ q, open, back }) {
  const [results, setResults] = useState(null);
  const [category, setCategory] = useState(null);
  const [scope, setScope] = useState(null);
  const [families, setFamilies] = useState([]);
  const [meta, setMeta] = useState(_meta);
  useEffect(() => { getMeta().then(setMeta); api("/api/clhear/sources").then(setFamilies).catch(() => {}); }, []);
  useEffect(() => {
    setResults(null);
    const params = new URLSearchParams({ q });
    if (category) params.set("category", category);
    if (scope) params.set("scope", scope);
    api(`/api/clhear/search?${params}`).then(setResults);
  }, [q, category, scope]);
  if (results === null) return html`<div class="spin">Searching “${q}”…</div>`;
  const groups = [];
  for (const r of results) {
    if (!groups.length || groups[groups.length - 1].key !== r.source_key)
      groups.push({ key: r.source_key, name: r.short_name || r.source_name, items: [] });
    groups[groups.length - 1].items.push(r);
  }
  return html`
    <div>
      <div class="crumbs"><a onClick=${back}>Library</a> / search</div>
      <h2>“${q}” — ${results.length} hit${results.length === 1 ? "" : "s"} in public clause text</h2>
      <div class="readerbar">
        <span class="count">scope:</span>
        ${families.map((f) => html`
          <button key=${f.key} class=${"catchip" + (scope === f.key ? " on" : "")}
                  onClick=${() => setScope(scope === f.key ? null : f.key)}>${f.name.split(" (")[0]}</button>`)}
        <span class="count">type:</span>
        ${(meta ? meta.annotation_categories : []).map((c) => html`
          <button key=${c} class=${"catchip" + (category === c ? " on" : "")}
                  onClick=${() => setCategory(category === c ? null : c)}>${c}</button>`)}
      </div>
      ${results.length === 0 && html`<div class="empty">No public clause matches.</div>`}
      ${groups.map((g) => html`
        <div key=${g.key}>
          <div class="dayhead">${g.name} · ${g.items.length} hit${g.items.length === 1 ? "" : "s"}</div>
          ${g.items.map((r, i) => html`
            <div class="result" key=${i} onClick=${() => open(r.source_key, r.ref, r.doc_node_id)}>
              <div class="where">
                <span class="mono">${r.ref || r.grain}</span>
                ${r.context ? ` · ${r.context}` : ""}
              </div>
              <div dangerouslySetInnerHTML=${{ __html: highlight(r.snippet, q) }} />
            </div>`)}
        </div>`)}
    </div>`;
}

function ChangesView({ open }) {
  const [changes, setChanges] = useState(null);
  useEffect(() => { api("/api/clhear/changes").then(setChanges); }, []);
  if (changes === null) return html`<div class="spin">Loading changes…</div>`;
  return html`
    <div>
      <h2>Change events</h2>
      ${changes.length === 0 && html`<div class="empty">No changes detected yet.</div>`}
      ${changes.map((c) => html`
        <div class="change" key=${c.id}>
          <a onClick=${() => open(c.source_key)}>${c.source_name}</a> —
          <span class=${"kind-" + c.kind}>${c.kind}</span>
          ${c.old_version ? ` ${c.old_version} → ` : " → "}${c.new_version}
          <span style=${{ color: "var(--muted)" }}> · detected ${c.detected_at}</span>
          ${c.clause_refs.length > 0 && html`
            <div class="refs">${c.clause_refs.length} clause(s): ${c.clause_refs.slice(0, 30).join(", ")}${c.clause_refs.length > 30 ? " …" : ""}</div>`}
        </div>`)}
    </div>`;
}

const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function highlight(snippet, q) {
  const safe = esc(snippet);
  return safe.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
