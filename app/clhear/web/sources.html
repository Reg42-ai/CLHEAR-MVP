function workflowStepTable(recorded, emptyText) {
  if (!recorded.length) return html`<p class="charter">${emptyText}</p>`;
  const maxDuration = Math.max(1, ...recorded.filter((step) => Number.isFinite(step.duration_ms)).map((step) => step.duration_ms));
  return html`<div style=${{ overflowX: "auto" }}><table class="members"><thead><tr><th>Step / attempt</th><th>Status</th><th>Recorded dependencies</th><th>Started / finished</th><th>Measured duration</th></tr></thead>
    <tbody>${recorded.map((step) => html`<tr key=${step.step_id}>
      <td><b>${evidenceLabel(step.stage)}</b><div class="mono">${step.step_id} · attempt ${step.attempt ?? "not recorded"}</div></td>
      <td><span class=${"badge " + evidenceTone(step.status)}>${evidenceLabel(step.status)}</span></td>
      <td class="mono">${Array.isArray(step.depends_on) ? (step.depends_on.length ? step.depends_on.join(", ") : "No dependencies") : "not recorded"}</td>
      <td class="mono">${step.started_at || "not recorded"}<br />${step.finished_at || "not recorded"}</td>
      <td><span class="mono">${measuredDuration(step.duration_ms)}</span>
        ${Number.isFinite(step.duration_ms) && step.duration_ms >= 0 && html`<div aria-hidden="true" style=${{ marginTop: "4px", height: "5px", width: `${Math.max(1, step.duration_ms / maxDuration * 100)}%`, background: "var(--indigo-500)", borderRadius: "3px" }}></div>`}
      </td></tr>`)}</tbody></table></div>`;
}

function WorkflowBrowser({ jobId, sourceKey }) {
  const [offsets, setOffsets] = useState({jobs: 0, tasks: 0, steps: 0});
  const [data, setData] = useState(null), [error, setError] = useState(null);
  useEffect(() => {
    let cancelled = false;
    const query = new URLSearchParams({job_offset: offsets.jobs, job_limit: 10, task_offset: offsets.tasks, task_limit: 100, step_offset: offsets.steps, step_limit: 200});
    if (jobId) query.set("job_id", jobId);
    if (sourceKey) query.set("source_key", sourceKey);
    setData(null); setError(null);
    api(`/api/clhear/l1/workflow?${query}`).then(value => { if (!cancelled) setData(value); }).catch(value => { if (!cancelled) setError(value); });
    return () => { cancelled = true; };
  }, [jobId, sourceKey, offsets]);
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (!data) return html`<p>Loading measured workflow…</p>`;
  return html`<div>
    <div class="recordbar">${["jobs", "tasks", "steps"].map(kind => {
      const page = (data.pagination || {})[kind], total = data[kind.slice(0, -1) + "_total"];
      if (!page) return null;
      const move = delta => setOffsets({...offsets, [kind]: Math.max(0, page.offset + delta * page.limit), ...(kind === "jobs" ? {tasks: 0, steps: 0} : {})});
      return html`<span key=${kind}>${kind}: ${total || 0} total · ${page.offset + (total ? 1 : 0)}–${Math.min(page.offset + page.limit, total || 0)}
        <button disabled=${!page.offset} onClick=${() => move(-1)} aria-label=${`Previous ${kind}`}>Previous</button>
        <button disabled=${!page.has_more} onClick=${() => move(1)} aria-label=${`Next ${kind}`}>Next</button></span>`;
    })}</div>
    <${WorkflowEvidence} report=${data} />
    <details><summary>Exact records on this page</summary><pre tabindex="0">${JSON.stringify(data, null, 2)}</pre></details>
  </div>`;
}

function ProgressStrip() {
  /* Four states kept apart — deployment, technical corpus verification, publisher
     permissions, nightly validation — from the small record L0 publishes between
     full snapshots (or composed live when none is published). */
  const [data, setData] = useState(null), [error, setError] = useState(null);
  useEffect(() => { api("/api/clhear/l1/progress").then(setData).catch(setError); }, []);
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (!data) return html`<div class="notice">Loading progress record…</div>`;
  const states = data.states || {}, ready = data.ready_for_private_review || {}, deferred = data.deferred_messages || {};
  const tone = (state) => ({passed: "open", observed: "open", candidate_verified: "open", failed: "restricted"}[state] || "guidance");
  const row = (label, state, extra) => html`<div class="meta-grid" key=${label}><span>${label} <b><span class=${"badge " + tone(state.state)}>${evidenceLabel(state.state || "unknown")}</span></b></span>${extra}</div>`;
  return html`<section class="family" aria-label="Progress">
    <h3 style=${{ marginTop: 0 }}>Progress <span class="charter">· ${data.served_from === "l0_published_record" ? "L0 record" : "live database"} · ${data.generated_at}</span></h3>
    ${row("Deployment", states.deployment || {}, html`<span class="charter">${(states.deployment || {}).label || "deployment verification"}${(states.deployment || {}).verification_id ? " · " + states.deployment.verification_id : ""}</span>`)}
    ${row("Technical corpus verification", states.corpus_verification || {}, html`<span class="charter">${(states.corpus_verification || {}).cycle_id ? "cycle " + states.corpus_verification.cycle_id + " · verified " + (states.corpus_verification.verified ?? "—") + " · unresolved " + (states.corpus_verification.unresolved ?? "—") : "no cycle recorded"}</span>`)}
    ${row("Publisher permissions", states.publisher_permissions || {}, html`<span class="charter">awaiting L0 binding ${data.binding_waits || 0} · permission blocked ${(states.publisher_permissions || {}).permission_blocked || 0} · denied ${(states.publisher_permissions || {}).ledger ? states.publisher_permissions.ledger.denied : 0}</span>`)}
    ${row("Nightly validation", states.nightly_validation || {}, html`<span class="charter">${(states.nightly_validation || {}).reason || (states.nightly_validation || {}).cycle_id || ""}</span>`)}
    <p class="charter">Deferred messages ${deferred.total || 0}${deferred.by_status ? " (" + Object.entries(deferred.by_status).map(([k, v]) => k + " " + v).join(", ") + ")" : ""} · never executed while L2–L8 are held.</p>
    <p class=${ready.ready ? "charter" : "notice"}>${ready.ready
      ? html`Ready for private review · <a href=${ready.viewer_url}>${ready.viewer_url}</a> · revision <span class="mono">${ready.deployed_revision}</span> · snapshot ${ready.snapshot_generated_at}`
      : html`Not ready for private review: ${ready.reason || "pending"}`} · corpus acceptance ${ready.corpus_acceptance || "not claimed"}</p>
  </section>`;
}

function CycleBoard() {
  const [offset, setOffset] = useState(0), [selected, setSelected] = useState(() => new URLSearchParams(location.search).get("cycle") || "");
  const [data, setData] = useState(null), [error, setError] = useState(null), [revision, refresh] = useState(0);
  const [jobId, setJobId] = useState("");
  useEffect(() => {
    let cancelled = false;
    const query = new URLSearchParams({offset, limit: 10});
    if (selected) query.set("cycle_id", selected);
    setError(null); setData(null);
    api(`/api/clhear/l1/cycles?${query}`).then(value => { if (!cancelled) setData(value); }).catch(value => { if (!cancelled) setError(value); });
    return () => { cancelled = true; };
  }, [offset, selected, revision]);
  return html`<section>
    <h2>Verification cycles</h2>
    <p class="charter">L0 coordinates discovery, freezes the inventory and dispatches the normal L1 workers. Only genuine EventBridge occurrences count toward nightly validation. Completed execution can still have unresolved corpus gaps.</p>
    <${ProgressStrip} />
    <div class="recordbar"><label>Cycle ID <input aria-label="Filter cycle ID" value=${selected} onChange=${e => { setSelected(e.target.value); setOffset(0); }} /></label><button onClick=${() => refresh(revision + 1)}>Refresh recorded evidence</button></div>
    ${error && html`<${ErrorNotice} error=${error} />`}
    ${data && data.status !== "available" && html`<div class="notice">No cycle evidence has been published by the deployed workers.</div>`}
    ${data && data.status === "available" && html`<p>${data.total} recorded cycles <button disabled=${offset === 0} onClick=${() => setOffset(Math.max(0, offset - 10))}>Previous cycles</button><button disabled=${!data.has_more} onClick=${() => setOffset(offset + 10)}>Next cycles</button></p>`}
    ${data && (data.cycles || []).map(cycle => html`<article class="family" key=${cycle.cycle_id}>
      <h3 class="mono">${cycle.cycle_id}</h3>
      <p><span class="badge">${cycle.origin}</span> · ${evidenceLabel(cycle.status)} · ${cycle.created_at} → ${cycle.finished_at || "unfinished"}</p>
      ${(data.queue || []).filter(item => item.cycle_id === cycle.cycle_id).map(item => html`<p class="charter" key=${item.cycle_id}>
        Queue order ${item.position} · queued ${item.queued_at} · started ${item.started_at || "waiting"}<br />
        Last worker heartbeat ${item.heartbeat_at || "not started"} · recovery attempts ${item.recovery_count}
      </p>`)}
      <p class="charter">Worker revision <span class="mono">${cycle.code_revision || "not recorded"}</span><br />Image <span class="mono">${cycle.worker_image_digest || "not recorded"}</span><br />Parser configuration <span class="mono">${cycle.parser_configuration_digest || "not recorded"}</span></p>
      <div style=${{overflowX: "auto"}}><table class="members"><thead><tr><th>Adapter lane</th><th>Execution</th><th>Expected documents</th><th>Occurrence</th><th>Workflow</th></tr></thead><tbody>
      ${(data.children || []).filter(c => c.cycle_id === cycle.cycle_id).map(child => html`<tr key=${child.child_id}><td>${child.adapter_key}</td><td>${evidenceLabel(child.status)}</td><td>${(child.source_keys || []).length}</td><td class="mono">${child.event_id || "No event ID"}<br />${child.event_time || "No scheduler timestamp"}</td><td>${child.job_id ? html`<button onClick=${() => setJobId(child.job_id)}>Steps and durations</button>` : "Not dispatched"}</td></tr>`)}</tbody></table></div>
      <details><summary>Frozen inventory and acceptance findings</summary><pre tabindex="0">${JSON.stringify({manifest: cycle.manifest, result: cycle.result}, null, 2)}</pre></details>
      ${cycle.result && cycle.result.english && html`<p>English views: ${cycle.result.english.ready || 0} ready / ${cycle.result.english.total || 0} evaluated.
        ${cycle.result.english.job_id && html`<button onClick=${() => setJobId(cycle.result.english.job_id)}>English worker steps</button>`}
      </p>`}
    </article>`)}
    ${jobId && html`<section class="family"><h3>Selected worker workflow</h3><${WorkflowBrowser} key=${jobId} jobId=${jobId} /></section>`}
  </section>`;
}

function WorkflowEvidence({ report }) {
  if (!report || report.status !== "available") return html`<div class="notice">Workflow evidence unavailable. ${report && report.reason || "No worker task and step records have been published."}</div>`;
  const tasks = report.tasks || [], steps = report.steps || [], jobs = report.jobs || [];
  return html`<div>
    <p class="charter">Durations come from completed worker measurements. Missing times and dependencies stay unrecorded; retries retain separate attempt records.</p>
    ${!(tasks.length || jobs.length) && html`<div class="empty">No worker workflow has been recorded for this selection.</div>`}
    ${(report.workflow_stages || []).length > 0 && html`<p class="charter">Configured stage order: ${report.workflow_stages.map(evidenceLabel).join(" → ")}. This order alone does not prove that a step ran.</p>`}
    ${jobs.map((job) => {
      const result = job.summary && job.summary.result;
      const coordination = steps.filter((step) => step.job_id === job.job_id && step.task_id == null);
      return html`<section class="family" key=${job.job_id}>
      <h3 style=${{ marginTop: 0 }}><span class=${"badge " + evidenceTone(job.status)}>${evidenceLabel(job.status)}</span> Job <span class="mono">${job.job_id}</span></h3>
      <div class="meta-grid"><span>Trigger <b>${job.trigger || "not recorded"}</b></span><span>Created <b>${job.created_at || "not recorded"}</b></span>
        <span>Started <b>${job.started_at || "not recorded"}</b></span><span>Finished <b>${job.finished_at || "not recorded"}</b></span>
        <span>Measured duration <b>${measuredDuration(job.duration_ms ?? (result && result.duration_ms))}</b></span></div>
      <div class="mono">Event ${job.event_key || "not recorded"} · adapter ${job.adapter_key || "not recorded"}</div>
      ${result && result.nightly_schedule_validation === "pending" && html`<p class="notice">Manual verification · nightly schedule validation pending</p>`}
      ${result && html`<details class="rolecard" style=${{ marginTop: "12px" }}><summary>Persisted job result</summary><pre tabindex="0">${JSON.stringify(result, null, 2)}</pre></details>`}
      ${coordination.length > 0 && html`<details class="rolecard" style=${{ marginTop: "12px" }} open><summary><b>Job coordination steps</b> · ${coordination.length} recorded</summary>
        ${workflowStepTable(coordination, "No measured job coordination steps recorded.")}</details>`}
      ${tasks.filter((task) => task.job_id === job.job_id).map((task) => {
        const recorded = steps.filter((step) => step.task_id === task.task_id && step.job_id === task.job_id);
        return html`<details class="rolecard" key=${task.task_id} style=${{ marginTop: "12px" }} open>
          <summary><b>${task.source_key || "Job coordination"}</b> · ${evidenceLabel(task.status)} · attempt ${task.attempt ?? "not recorded"}${task.max_attempts != null ? ` / ${task.max_attempts}` : ""}</summary>
          <div class="meta-grid"><span>Task <span class="mono">${task.task_id}</span></span><span>Worker <span class="mono">${task.worker || "not recorded"}</span></span>
            <span>Queue wait <b>${measuredDuration(task.queue_wait_ms)}</b></span><span>Heartbeat <b>${task.heartbeat_at || "not recorded"}</b></span>
            <span>Lease until <b>${task.lease_until || "not recorded"}</b></span><span>Next attempt <b>${task.next_attempt_at || "not scheduled"}</b></span></div>
          <div class="charter">Started ${task.started_at || "not recorded"} · finished ${task.finished_at || "not recorded"}</div>
          ${task.error && html`<div class="notice">${typeof task.error === "string" ? task.error : JSON.stringify(task.error)}</div>`}
          ${workflowStepTable(recorded, "No measured steps recorded for this task.")}
        </details>`;
      })}
    </section>`; })}
    ${tasks.some((task) => !jobs.some((job) => job.job_id === task.job_id)) && html`<div class="notice">Some task records have no matching job in this response. Workflow evidence is incomplete.</div>`}
  </div>`;
}

function FleetView({ open }) {
  const [board, setBoard] = useState(null);
  const [job, setJob] = useState(null);
  const [mode, setMode] = useState("cycles");
  const [runId, setRunId] = useState(null);
  const [run, setRun] = useState(null);
  const [meta, setMeta] = useState(_meta);
  const [stageLegend, setStageLegend] = useState(false);
  const [boardError, setBoardError] = useState(null);
  const [jobError, setJobError] = useState(null);
  const [runError, setRunError] = useState(null);

  useEffect(() => { getMeta().then(setMeta).catch(() => {}); }, []);

  const load = () => {
    api("/api/clhear/fleet").then((value) => { setBoard(value); setBoardError(null); }).catch(setBoardError);
    api("/api/clhear/l1/workflow").then((value) => { setJob(value); setJobError(null); }).catch(setJobError);
  };
  useEffect(() => { load(); }, []);
  useEffect(() => {
    // real-time: poll while the latest job (or any run) is executing
    const active = (job && (job.tasks || []).some((task) => ["running", "queued", "retry_wait"].includes(task.status))) || (board && board.some((r) => r.last_run && r.last_run.status === "running"));
    if (!active) return;
    const t = setInterval(load, 2500);
    return () => clearInterval(t);
  }, [board, job]);
  useEffect(() => {
    setRunError(null);
    if (runId) { setRun(null); api(`/api/clhear/runs/${runId}`).then(setRun).catch(setRunError); }
    else setRun(null);
  }, [runId]);

  return html`
    <div>
      <h2 style=${{ margin: "0 0 4px" }}>Fleet · L1 team and runs</h2>
      <div class="charter">Meet the named roles, inspect their execution bindings, then follow recorded jobs through fetch, parse, validation, persistence and change detection. A persona describes a responsibility; the worker and run records show what executed.</div>
      ${meta && meta.schedules && html`
        <details class="schedbar">
          <summary>Configured schedules (UTC)</summary>
          ${Object.entries(meta.schedules).map(([k, s]) => html`
            <span class="scheditem" key=${k} title=${s.covers}>
              <span class="mono">${k}</span> ${s.cadence} · ${s.utc_time}
            </span>`)}
          <div class="charter" style=${{ margin: "4px 0 0" }}>
            Schedule configuration does not establish that a worker ran. Compare it with recorded runs and timestamps below.
          </div>
        </details>`}
      <div class="tabs mode">
        <button class=${mode === "cycles" ? "active" : ""} onClick=${() => setMode("cycles")}>Verification cycles</button>
        <button class=${mode === "team" ? "active" : ""} onClick=${() => setMode("team")}>Team roles</button>
        <button class=${mode === "canvas" ? "active" : ""} onClick=${() => setMode("canvas")}>Workflow</button>
        <button class=${mode === "table" ? "active" : ""} onClick=${() => setMode("table")}>Source runs</button>
        <button class=${mode === "activity" ? "active" : ""} onClick=${() => setMode("activity")}>Activity</button>
        <button class=${stageLegend ? "active" : ""} onClick=${() => setStageLegend(!stageLegend)}>stages ⓘ</button>
      </div>
      ${stageLegend && html`<${StageLegend} meta=${meta} />`}
      ${mode === "cycles" && html`<${CycleBoard} />`}
      ${mode === "team" && html`<${TeamRoles} selectRun=${(id) => { setRunId(id); }} />`}
      ${mode === "activity" && html`<${ActivityView} open=${open} />`}
      ${mode === "canvas" && html`<${WorkflowBrowser} />`}
      ${runError && html`<${ErrorNotice} error=${runError} />`}
      ${run && html`<${RunDag} run=${run} close=${() => setRunId(null)} meta=${meta} />`}
      ${mode === "table" && (boardError ? html`<${ErrorNotice} error=${boardError} />` : board === null ? html`<div class="spin">Loading recorded source runs…</div>` : html`<${FleetTable} board=${board} open=${open} setRunId=${setRunId} meta=${meta} />`)}
    </div>`;
}

function TeamRoles({ selectRun }) {
  const [team, setTeam] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => { api("/api/clhear/team?layer=L1").then(setTeam).catch(setError); }, []);
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (!team) return html`<div class="spin">Loading L1 team roles…</div>`;
  return html`<div>
    <div class="charter">Role metadata checked ${team.as_of || "at an unrecorded time"}. Tool lists describe supported capabilities; recorded use appears only when execution evidence is available.</div>
    <div class="rolegrid">${(team.fleets || []).map((role) => html`<article class="rolecard" key=${role.id}>
      <h3>${role.name} <span class="badge">${role.layer}</span></h3>
      <div class="mono">${role.execution_kind || "descriptive role"}</div>
      <p>${role.mission}</p>
      <dl>
        <dt>Execution binding</dt><dd class="mono">${role.fleet || "not supplied"}${role.task_id ? ` · task ${role.task_id}` : ""}</dd>
        ${role.evidence_state && html`<dt>Execution evidence</dt><dd>${role.evidence_state === "recorded_run" ? "Recorded run available" : role.evidence_state === "no_recorded_run" ? "No recorded run" : role.evidence_state}</dd>`}
        ${role.implemented != null && html`<dt>Implementation</dt><dd>${role.implemented ? "Implemented" : "Not implemented"}</dd>`}
        ${role.enabled != null && html`<dt>Enabled</dt><dd>${role.enabled ? "Enabled by configuration" : "Disabled by configuration"}</dd>`}
        <dt>${role.tools_basis === "configured" ? "Configured tools" : "Supported tools"}</dt><dd>${(role.tools || []).join(" · ") || "Not supplied"}</dd>
        <dt>Last recorded run</dt><dd>${role.last_run ? html`${role.last_run.status} · ${role.last_run.ts || "timestamp unavailable"}${role.last_run.run_id && html` <button class="catchip" onClick=${() => selectRun(role.last_run.run_id)}>Run #${role.last_run.run_id}</button>`}` : "No execution recorded for this binding"}</dd>
        <dt>Model routing record</dt><dd>${role.model ? `${role.model.model || "No model selected"}${role.model.tier ? ` · ${role.model.tier}` : ""}` : "No model routing record supplied"}</dd>
      </dl>
      <details><summary>Role details and recorded metadata</summary>
        ${role.model && role.model.reason && html`<p>${role.model.reason}</p>`}
        <p>Configuration is separate from observed model use. Missing tool, model or prompt version evidence is not inferred from the role name.</p>
        <pre tabindex="0">${JSON.stringify(role, null, 2)}</pre>
      </details>
    </article>`)}</div>
    ${!(team.fleets || []).length && html`<div class="empty">No L1 roles are configured.</div>`}
  </div>`;
}

function FleetTable({ board, open, setRunId, meta }) {
  return html`
      <table class="fleet">
        <thead><tr>
          <th>source</th><th>adapter</th><th>version</th><th>last run</th><th>coverage</th><th>stages</th><th>schedule</th>
        </tr></thead>
        <tbody>
        ${board.map((r) => html`
          <tr key=${r.source_key}>
            <td><a href=${sourceUrl(r.source_key, r.current_version)} onClick=${(e) => { e.preventDefault(); open(r.source_key, null, null, r.current_version); }} title=${r.source_name}>${r.short_name || r.source_name}</a><div class="mono">${r.source_key}</div></td>
            <td class="mono">${r.adapter}</td>
            <td>
              ${r.current_version_kind && html`<span class="kindbadge ${r.current_version_kind}">${r.current_version_kind.replace("_", " ")}</span>`}
              <div class="mono">${r.current_version || "—"}</div>
              ${r.previous_version && html`<div class="mono" style=${{ opacity: 0.6 }}>prev: ${r.previous_version}</div>`}
              <div class="mono" style=${{ opacity: 0.6 }}>${r.versions} version${r.versions === 1 ? "" : "s"}</div>
            </td>
            <td>
              ${r.last_run ? html`
                <span class=${"dot " + r.last_run.status}></span>
                <span class="runlink" onClick=${() => setRunId(r.last_run.run_id)}>run #${r.last_run.run_id}</span>
                <div class="mono">${r.last_run.raw_status === "unchanged" || r.last_run.raw_status === "up-to-date" ? "probed, unchanged" : (r.last_run.note || r.last_run.raw_status || r.last_run.status)}</div>
                ${r.last_run.freshness === "stale" ? html`<div class="mono" style=${{ color: "var(--amber-600)" }}>stale last-good</div>` : ""}
                ${r.last_run.error ? html`<div class="mono" style=${{ color: "var(--rose-600)" }}>${r.last_run.error}</div>` : ""}
                <div class="mono">${r.last_run.ts}</div>` : html`<span class="mono" style=${r.library_status === "schedule-missed" ? { color: "var(--rose-600)" } : {}}>${r.library_status === "schedule-missed" ? "schedule missed — no run in 24h" : "never-fetched"}</span>`}
              ${!r.last_run && r.next_run_utc ? html`<div class="mono">next: ${r.next_run_utc.slice(0, 16)}Z</div>` : ""}
            </td>
            <td class="mono">${r.last_run && r.last_run.coverage != null ? (r.last_run.coverage * 100).toFixed(2) + "%" : "—"}</td>
            <td>${r.last_run ? r.last_run.stages.map((s, i) => html`
                <span key=${i} class=${"stagechip " + chipStatus(s, r.last_run.status)}
                      title=${meta && meta.stages ? meta.stages[s.stage] : ""}>${s.stage}${s.attempt > 1 ? `#${s.attempt}` : ""}</span>`) : "—"}</td>
            <td class="mono">${r.schedule}</td>
          </tr>`)}
        </tbody>
      </table>`;
}

/* Legacy run records remain inspectable without inventing step dependencies. */
function RunDag({ run, close, meta }) {
  const outputs = run.outputs || {};
  const stages = outputs.stages || [];
  return html`<div class="dagwrap">
    <h3>Run #${run.id} · <span class="mono">${run.fleet}</span> · ${run.status || "unverified"}</h3>
    <p class="charter">Trigger ${run.trigger || "not recorded"} · recorded ${run.created_at || "not recorded"} · measured duration ${measuredDuration(run.duration_ms)}.</p>
    <p class="charter">This legacy run lists recorded stages. Step dependencies, heartbeats and worker leases were not recorded here; use Workflow for current task evidence.</p>
    <p class="mono" style=${{ overflowWrap: "anywhere" }}>${outputs.version || "Version not recorded"} · SHA-256 ${outputs.content_hash || "not recorded"}</p>
    ${!stages.length && html`<div class="empty">No measured stage records.</div>`}
    <table class="members"><thead><tr><th>Recorded stage</th><th>Attempt</th><th>Measured duration</th><th>Recorded result</th></tr></thead>
      <tbody>${stages.map((stage, i) => html`<tr key=${i}>
        <td title=${meta && meta.stages && meta.stages[stage.stage] || ""}>${stage.stage}</td>
        <td>${stage.attempt ?? "not recorded"}</td><td>${measuredDuration(stage.ms)}</td>
        <td>${stage.status || "status not recorded"}${stage.coverage != null ? ` · reported coverage ${(stage.coverage * 100).toFixed(2)}%` : ""}</td>
      </tr>`)}</tbody></table>
    <button class="playbtn" onClick=${close}>Close run</button>
  </div>`;
}

/* --------------------------------- search ----------------------------------- */
function SearchView({ q, open, back }) {
  const [results, setResults] = useState(null);
  const [category, setCategory] = useState(null);
  const [scope, setScope] = useState(null);
  const [families, setFamilies] = useState([]);
  const [meta, setMeta] = useState(_meta);
  const [error, setError] = useState(null);
  useEffect(() => { getMeta().then(setMeta).catch(() => {}); api("/api/clhear/sources").then(setFamilies).catch(() => {}); }, []);
  useEffect(() => {
    let cancelled = false;
    setResults(null); setError(null);
    const params = new URLSearchParams({ q });
    if (category) params.set("category", category);
    if (scope) params.set("scope", scope);
    api(`/api/clhear/search?${params}`).then((data) => { if (!cancelled) setResults(data); }).catch((err) => { if (!cancelled) setError(err); });
    return () => { cancelled = true; };
  }, [q, category, scope]);
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (results === null) return html`<div class="spin">Searching “${q}”…</div>`;
  const groups = [];
  for (const r of results) {
    if (!groups.length || groups[groups.length - 1].key !== r.source_key)
      groups.push({ key: r.source_key, name: r.short_name || r.source_name, items: [] });
    groups[groups.length - 1].items.push(r);
  }
  return html`
    <div>
      <div class="crumbs"><a onClick=${back}>Library</a> / search</div>
      <h2>“${q}” — ${results.length} hit${results.length === 1 ? "" : "s"} in public clause text</h2>
      <div class="readerbar">
        <span class="count">scope:</span>
        ${families.map((f) => html`
          <button key=${f.key} class=${"catchip" + (scope === f.key ? " on" : "")}
                  onClick=${() => setScope(scope === f.key ? null : f.key)}>${f.name.split(" (")[0]}</button>`)}
        <span class="count">type:</span>
        ${((meta && meta.annotation_categories) || []).map((c) => html`
          <button key=${c} class=${"catchip" + (category === c ? " on" : "")}
                  onClick=${() => setCategory(category === c ? null : c)}>${c}</button>`)}
      </div>
      ${results.length === 0 && html`<div class="empty">No public clause matches.</div>`}
      ${groups.map((g) => html`
        <div key=${g.key}>
          <div class="dayhead">${g.name} · ${g.items.length} hit${g.items.length === 1 ? "" : "s"}</div>
          ${g.items.map((r, i) => html`
            <div class="result" key=${i} onClick=${() => open(r.source_key, r.ref, r.doc_node_id, r.version_label)}>
              <div class="where">
                <span class="mono">${r.ref || r.grain}</span>
                ${r.context ? ` · ${r.context}` : ""}
              </div>
              <div dangerouslySetInnerHTML=${{ __html: highlight(r.snippet, q) }} />
            </div>`)}
        </div>`)}
    </div>`;
}

function ChangesView({ open }) {
  const [changes, setChanges] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => { api("/api/clhear/changes").then(setChanges).catch(setError); }, []);
  if (error) return html`<${ErrorNotice} error=${error} />`;
  if (changes === null) return html`<div class="spin">Loading changes…</div>`;
  return html`
    <div>
      <h2>Change events</h2>
      ${changes.length === 0 && html`<div class="empty">No changes detected yet.</div>`}
      ${changes.map((c) => html`
        <div class="change" key=${c.id}>
          <a href=${sourceUrl(c.source_key, c.new_version)} onClick=${(e) => { e.preventDefault(); open(c.source_key, null, null, c.new_version); }}>${c.source_name}</a> —
          <span class=${"kind-" + c.kind}>${c.kind}</span>
          ${c.old_version ? ` ${c.old_version} → ` : " → "}${c.new_version}
          <span style=${{ color: "var(--muted)" }}> · detected ${c.detected_at}</span>
          ${c.clause_refs.length > 0 && html`
            <div class="refs">${c.clause_refs.length} clause(s): ${c.clause_refs.slice(0, 30).join(", ")}${c.clause_refs.length > 30 ? " …" : ""}</div>`}
        </div>`)}
    </div>`;
}

const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function highlight(snippet, q) {
  const safe = esc(snippet);
  return safe.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
