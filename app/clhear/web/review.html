<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLHEAR · Review Console</title>
<link rel="stylesheet" href="/static/theme.css" />
<style>
  /* Page-specific styles; shared tokens + chrome live in /static/theme.css.
     Alias block: legacy token names → dark-glass tokens (identical in both themes;
     the underlying tokens flip via [data-theme="light"] in theme.css). */
  :root, [data-theme="light"] {
    --indigo-900: var(--ind-900); --indigo-700: var(--accent); --indigo-500: var(--ind-500);
    --indigo-100: rgba(129,140,248,0.16);
    --pearl: var(--panel); --pearl-dark: var(--edge);
    --mint-100: rgba(52,211,153,0.14); --rose-100: rgba(251,113,133,0.14); --amber-100: rgba(251,191,36,0.14);
    --mint-600: var(--ok); --rose-600: var(--bad); --amber-600: var(--warn);
  }
  main { position: relative; z-index: 1; max-width: 980px; margin: 28px auto; padding: 0 20px 60px; }
  .identity { display: flex; gap: 10px; align-items: center; margin-bottom: 22px; }
  .identity input { border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px;
                    font-size: 14px; width: 280px; background: var(--panel-strong); color: var(--ink); }
  .identity input::placeholder { color: var(--faint); }
  .identity label { font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button { border: 1px solid var(--edge); background: var(--panel); border-radius: 999px;
                 padding: 6px 16px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .tabs button.active { background: linear-gradient(92deg, var(--ind-700), var(--ind-500));
                        border-color: var(--ind-500); color: white; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
          padding: 18px 20px; margin-bottom: 14px; }
  .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .kind { font-weight: 600; color: var(--accent); }
  .subject { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); }
  .rationale { margin: 8px 0 4px; }
  pre.draft { background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 8px;
              padding: 10px 12px; font-size: 12px; overflow-x: auto; max-height: 180px; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .badge.proposed { background: var(--indigo-100); color: var(--accent); }
  .badge.approved { background: var(--mint-100); color: var(--ok); }
  .badge.rejected { background: var(--rose-100); color: var(--bad); }
  .actions { display: flex; gap: 8px; }
  .actions button { border: none; border-radius: 8px; padding: 8px 18px; font-size: 14px;
                    cursor: pointer; font-weight: 600; }
  .actions button:disabled { opacity: 0.45; cursor: not-allowed; }
  .approve { background: linear-gradient(92deg, #059669, #10b981); color: white; box-shadow: var(--glow); }
  .reject { background: transparent; color: var(--bad); border: 1px solid var(--bad) !important; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .error { background: var(--rose-100); color: var(--bad); border: 1px solid rgba(251,113,133,0.35);
           border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- no-build frontend: React 18 + htm, per repo convention -->
<script type="module">
import React, { useState, useEffect } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(React.createElement);
const STATUSES = ["proposed", "approved", "rejected"];

function useTheme() {
  const [theme, setTheme] = useState(localStorage.getItem("clhear_theme") || "dark");
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem("clhear_theme", theme);
  }, [theme]);
  return [theme, () => setTheme(theme === "dark" ? "light" : "dark")];
}

function App() {
  const [user, setUser] = useState(localStorage.getItem("reg42_user") || "");
  const [status, setStatus] = useState("proposed");
  const [items, setItems] = useState([]);
  const [error, setError] = useState(null);
  const [theme, toggleTheme] = useTheme();

  const load = () =>
    fetch(`/api/clhear/proposals?status=${status}`)
      .then((r) => r.json()).then(setItems).catch((e) => setError(String(e)));

  useEffect(() => { load(); }, [status]);
  useEffect(() => { localStorage.setItem("reg42_user", user); }, [user]);

  const decide = async (id, action) => {
    setError(null);
    const r = await fetch(`/api/clhear/proposals/${id}/${action}`, {
      method: "POST",
      headers: { "X-Reg42-User": user },
    });
    if (!r.ok) { setError((await r.json()).detail || r.statusText); return; }
    load();
  };

  return html`
    <div>
      <header class="appbar">
        <div class="wordmark">
          <b>CLHEAR</b><span>Review console — agents propose, humans ratify</span>
        </div>
        <div class="spacer"></div>
        <a class="navlink" href="/">Stack</a>
        <a class="navlink" href="/sources">Sources Explorer</a>
        <span class="navlink active">Review</span>
        <button class="themebtn" onClick=${toggleTheme}>${theme === "dark" ? "◐ pearl" : "◑ dark"}</button>
      </header>
      <main>
      ${error && html`<div class="error">${error}</div>`}
      <div class="identity">
        <label>Acting as</label>
        <input placeholder="maintainer identity (e.g. avner@reg42.ai)"
               value=${user} onInput=${(e) => setUser(e.target.value)} />
      </div>
      <div class="tabs">
        ${STATUSES.map((s) => html`
          <button class=${s === status ? "active" : ""} onClick=${() => setStatus(s)}>${s}</button>`)}
      </div>
      ${items.length === 0 && html`<div class="empty">No ${status} proposals.</div>`}
      ${items.map((p) => html`
        <div class="card" key=${p.id}>
          <div class="row">
            <div>
              <span class="kind">${p.layer} · ${p.kind}</span>
              <span class="badge ${p.status}">${p.status}</span>
              <div class="subject">${p.subject_ref}</div>
              ${p.rationale && html`<div class="rationale">${p.rationale}</div>`}
              <pre class="draft">${JSON.stringify(p.draft, null, 2)}</pre>
              <div class="meta">
                confidence ${p.confidence ?? "—"} · created ${p.created_at}
                ${p.approver && html` · decided by <b>${p.approver}</b> at ${p.decided_at}`}
              </div>
            </div>
            ${p.status === "proposed" && html`
              <div class="actions">
                <button class="approve" disabled=${!user} onClick=${() => decide(p.id, "approve")}>Approve</button>
                <button class="reject" disabled=${!user} onClick=${() => decide(p.id, "reject")}>Reject</button>
              </div>`}
          </div>
        </div>`)}
      </main>
    </div>`;
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
