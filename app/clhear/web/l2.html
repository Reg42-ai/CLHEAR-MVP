<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLHEAR · L2 Obligation registry</title>
<link rel="stylesheet" href="/static/theme.css" />
<style>
  /* L2 browser (HLD v2 §4.2): registry by jurisdiction / regulator / type,
     obligation page with highlighted source spans, equivalents, history,
     why-trail, request-a-modification, cross-jurisdiction compare. */
  main { position: relative; z-index: 1; max-width: 1500px; margin: 22px auto; padding: 0 20px 70px; }
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 18px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .facets { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 16px; align-self: start; position: sticky; top: 74px; }
  .facets h4 { margin: 14px 0 6px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  .facets h4:first-child { margin-top: 0; }
  .facets input, .facets select, .form input, .form select, .form textarea { width: 100%; border: 1px solid var(--edge); border-radius: 8px; padding: 7px 10px; font-size: 13px; background: var(--panel-strong); color: var(--ink); box-sizing: border-box; }
  .chip { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--edge); font-size: 12px; cursor: pointer; color: var(--muted); background: var(--panel-strong); }
  .chip.on { color: var(--ink); border-color: var(--edge-bright); background: rgba(129,140,248,0.18); }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--edge); background: var(--panel); border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .tabs button.on { color: var(--ink); border-color: var(--edge-bright); background: var(--panel-strong); }
  table.reg { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.reg th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--edge); }
  table.reg td { padding: 8px; border-bottom: 1px solid var(--edge); vertical-align: top; }
  .name { color: var(--accent); font-weight: 600; cursor: pointer; }
  .mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; white-space: nowrap; border: 1px solid transparent; }
  .badge.type { background: var(--ind-800); color: var(--ind-100); border-color: var(--edge); }
  .badge.st-derived { background: rgba(129,140,248,0.16); color: var(--accent); }
  .badge.st-validated { background: rgba(52,211,153,0.14); color: var(--ok); }
  .badge.st-stale, .badge.st-rejected { background: rgba(251,113,133,0.14); color: var(--bad); }
  .badge.kind-added { background: rgba(52,211,153,0.14); color: var(--ok); }
  .badge.kind-updated { background: rgba(251,191,36,0.14); color: var(--warn); }
  .badge.kind-revoked { background: rgba(251,113,133,0.14); color: var(--bad); }
  .badge.explicit { background: rgba(52,211,153,0.14); color: var(--ok); }
  .badge.implied { background: rgba(251,191,36,0.14); color: var(--warn); }
  .badge.human { background: rgba(251,113,133,0.14); color: var(--bad); }
  .panelx { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
  .panelx h2 { margin: 0 0 6px; font-size: 17px; }
  .panelx h3 { margin: 18px 0 8px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  .meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .field { background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
  .field span { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
  .timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--edge); }
  .timeline li { position: relative; margin: 0 0 14px; font-size: 13.5px; }
  .timeline li::before { content: ""; position: absolute; left: -24px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .timeline .when { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .score { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .score .kpi { background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; }
  .score .kpi b { display: block; font-size: 20px; }
  .score .kpi span { font-size: 11.5px; color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .crumbs a { cursor: pointer; }
  pre.clause { white-space: pre-wrap; background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; font: 13px/1.5 var(--mono); }
  pre.clause mark { background: rgba(251,191,36,0.35); color: inherit; border-radius: 3px; padding: 0 1px; }
  .withheld { color: var(--warn); font-size: 13px; }
  .spin { color: var(--muted); padding: 30px; text-align: center; }
  .btn { border: 1px solid var(--edge-bright); background: rgba(129,140,248,0.16); color: var(--ink); border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
  .btn.quiet { background: var(--panel); border-color: var(--edge); color: var(--muted); }
  .form { display: grid; gap: 8px; max-width: 640px; }
  .why { font-size: 13px; }
  .why code { font-family: var(--mono); font-size: 12px; }
  .cmp { display: grid; gap: 10px; }
  .cmp .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .cmp .cell { background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .cmp .cell.gap { border-style: dashed; color: var(--warn); }
  .cmp .cell h5 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="root"></div>
<!-- no-build frontend: React 18 + htm, per repo convention -->
<script type="module">
import React, { useState, useEffect } from "/static/vendor/react-18.3.1.2f6da27083.mjs";
import { createRoot } from "/static/vendor/react-dom-client-18.3.1.8a9d10e816.mjs";
import htm from "/static/vendor/htm-3.1.1.81a9a8dee7.mjs";

const html = htm.bind(React.createElement);
const api = (p, opts = {}) =>
  fetch(p, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } }).then(async (r) => {
    if (!r.ok) throw new Error((await r.text()) || r.statusText);
    return r.json();
  });
const qs = (o) => Object.entries(o).filter(([, v]) => v !== "" && v != null && v !== false).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");
const fmt = (d) => (d ? String(d).slice(0, 10) : "—");
const pct = (v) => (v == null ? "—" : `${Math.round(v * 1000) / 10}%`);

function useTheme() {
  const [theme, setTheme] = useState(localStorage.getItem("clhear_theme") || "dark");
  useEffect(() => { document.documentElement.dataset.theme = theme; localStorage.setItem("clhear_theme", theme); }, [theme]);
  return [theme, () => setTheme(theme === "dark" ? "light" : "dark")];
}

const Status = ({ s }) => html`<span class=${"badge st-" + s}>${s}</span>`;
const Kind = ({ k }) => html`<span class=${"badge kind-" + k}>${k}</span>`;

function Facets({ facets, filters, setFilters }) {
  const set = (k, v) => setFilters({ ...filters, [k]: filters[k] === v ? "" : v });
  const chips = (k, values) => html`<div>${(values || []).map((v) => html`<span key=${v} class=${"chip" + (filters[k] === v ? " on" : "")} onClick=${() => set(k, v)}>${v}</span>`)}</div>`;
  return html`<aside class="facets">
    <h4>Search</h4>
    <input aria-label="Search obligations" placeholder="who must do what…" value=${filters.q} onInput=${(e) => setFilters({ ...filters, q: e.target.value })} />
    <h4>Jurisdiction</h4>${chips("jurisdiction", facets.jurisdictions)}
    <h4>Regulator</h4>
    <select aria-label="Filter by regulator" value=${filters.regulator} onChange=${(e) => setFilters({ ...filters, regulator: e.target.value })}>
      <option value="">any regulator</option>${(facets.regulators || []).map((r) => html`<option key=${r} value=${r}>${r}</option>`)}
    </select>
    <h4>Obligation type</h4>${chips("obligation_type", facets.types)}
    <h4>Status</h4>
    ${["live", "stale", "all"].map((s) => html`<span key=${s} class=${"chip" + (filters.status === s ? " on" : "")} onClick=${() => setFilters({ ...filters, status: s })}>${s}</span>`)}
    <h4>Duplicates</h4>
    <span class=${"chip" + (filters.canonical_only ? " on" : "")} onClick=${() => setFilters({ ...filters, canonical_only: !filters.canonical_only })}>canonical only</span>
  </aside>`;
}

function Registry({ filters, open }) {
  const [data, setData] = useState(null);
  useEffect(() => { setData(null); api(`/l2/obligations?${qs({ ...filters, limit: 300 })}`).then(setData).catch(() => setData({ items: [], total: 0 })); }, [JSON.stringify(filters)]);
  if (!data) return html`<div class="spin">Loading registry…</div>`;
  if (!data.items.length) return html`<div class="empty">No obligations match.</div>`;
  return html`<div>
    <div class="meta"><span><b>${data.total}</b> obligations</span></div>
    <table class="reg"><thead><tr><th>Id</th><th>Determination</th><th>Type</th><th>Jurisdiction</th><th>Regulator</th><th>Source</th><th>Effective</th><th>Status</th></tr></thead>
    <tbody>${data.items.map((o) => html`<tr key=${o.derivation_key}>
      <td class="mono"><span class="name" onClick=${() => open(o.id)}>${o.id}</span></td>
      <td>${o.determination || o.title}${o.canonical_id && o.canonical_id !== o.id ? html` <span class="badge type" title="merged duplicate">→ ${o.canonical_id}</span>` : ""}</td>
      <td>${o.obligation_type ? html`<span class="badge type">${o.obligation_type}</span>` : "—"}</td>
      <td>${o.jurisdiction}</td><td>${o.regulator || "—"}</td>
      <td class="mono">${o.source_key} #${o.clause_ref}</td>
      <td>${fmt(o.effective_from)}${o.effective_to ? ` → ${fmt(o.effective_to)}` : ""}</td>
      <td><${Status} s=${o.status} /></td></tr>`)}</tbody></table></div>`;
}

function Highlighted({ text, span }) {
  if (!text) return null;
  if (!span || span.start == null) return html`<pre class="clause">${text}</pre>`;
  return html`<pre class="clause">${text.slice(0, span.start)}<mark>${text.slice(span.start, span.end)}</mark>${text.slice(span.end)}</pre>`;
}

function ModificationForm({ id, onDone }) {
  const [field, setField] = useState("determination");
  const [value, setValue] = useState("");
  const [why, setWhy] = useState("");
  const [state, setState] = useState(null);
  const submit = async () => {
    setState("busy");
    try {
      const r = await api(`/l2/obligations/${id}/modification-requests`, { method: "POST", body: JSON.stringify({ field, proposed_value: value, rationale: why }) });
      setState(`Submitted — proposal ${r.proposal_id} is in the approval queue.`); onDone && onDone(r);
    } catch (e) { setState("Error: " + e.message); }
  };
  return html`<div class="form">
    <select aria-label="Field to change" value=${field} onChange=${(e) => setField(e.target.value)}>
      ${["determination", "subject", "action", "condition", "object", "obligation_type", "effective_from", "effective_to", "status"].map((f) => html`<option key=${f} value=${f}>${f}</option>`)}
    </select>
    <textarea aria-label="Proposed value" rows="3" placeholder="proposed value" value=${value} onInput=${(e) => setValue(e.target.value)}></textarea>
    <textarea aria-label="Rationale" rows="2" placeholder="why (at least 10 characters — cite the clause text)" value=${why} onInput=${(e) => setWhy(e.target.value)}></textarea>
    <div><button class="btn" disabled=${state === "busy" || !value || why.length < 10} onClick=${submit}>Request a modification</button></div>
    ${state && state !== "busy" ? html`<div class=${state.startsWith("Error") ? "bad" : "ok"}>${state}</div>` : ""}
  </div>`;
}

function ObligationPage({ id, back, open, openCompare }) {
  const [o, setO] = useState(null);
  const [showForm, setShowForm] = useState(false);
  useEffect(() => { setO(null); api(`/l2/obligations/${id}`).then(setO).catch((e) => setO({ error: e.message })); }, [id]);
  if (!o) return html`<div class="spin">Loading obligation…</div>`;
  if (o.error) return html`<div class="empty">${o.error}</div>`;
  const h = o.history || {};
  return html`<div>
    <div class="crumbs"><a onClick=${back}>Registry</a> › ${o.id}</div>
    <div class="panelx">
      <h2>${o.determination || o.title} ${o.needs_human ? html`<span class="badge human">needs human review</span>` : ""}</h2>
      <div class="meta">
        <span><${Status} s=${o.status} /></span>
        <span>type <b>${o.obligation_type || "—"}</b></span>
        <span>modality <b>${o.modality}</b></span>
        <span>jurisdiction <b>${o.jurisdiction}</b></span>
        <span>regulator <b>${o.regulator || "—"}</b></span>
        <span>effective <b>${fmt(o.effective_from)}${o.effective_to ? ` → ${fmt(o.effective_to)}` : ""}</b></span>
        <span>confidence <b>${o.confidence ?? "—"}</b>${o.review_confidence != null ? html` · review <b>${o.review_confidence}</b>` : ""}</span>
        <span>version <b>${o.version}</b></span>
        <span class="mono">${o.derivation_key}</span>
      </div>
      <div class="grid2">
        ${[["subject", o.subject], ["action", o.action], ["condition", o.condition], ["object", o.object]].map(([k, v]) => html`<div key=${k} class="field"><span>${k}</span>${v || html`<i class="mono">not extracted</i>`}</div>`)}
      </div>
      <h3>Sources (asserted by)</h3>
      ${(o.sources || []).map((s) => html`<div key=${s.assert_id} style=${{ marginBottom: "10px" }}>
        <div class="meta"><span class="mono">${s.source_key} #${s.clause_ref}</span><span><span class=${"badge " + s.strength}>${s.strength}</span></span>
          <span>${s.instrument || ""} ${s.version ? `· ${s.version}` : ""}</span>
          ${s.live ? html`<span class=${s.basis_current ? "ok" : "bad"}>${s.basis_current ? "basis current" : "basis drifted — re-derivation pending"}</span>`
                   : html`<span class="warn">superseded edge (valid to ${fmt(s.valid_to)})</span>`}
          ${s.clause_id ? html`<a class="name" href=${"/l1#clause-" + s.clause_id}>L1 clause ${s.clause_id}</a>` : ""}</div>
        ${s.text ? html`<${Highlighted} text=${s.text} span=${s.span} />` : html`<div class="withheld">${s.text_withheld_reason || "text not available"} · hash <code class="mono">${(s.text_hash || "").slice(0, 16)}</code>${s.span ? ` · span ${s.span.start}–${s.span.end}` : ""}</div>`}
      </div>`)}
      ${!(o.sources || []).length ? html`<div class="withheld">No asserts edge recorded yet.</div>` : ""}

      <h3>Equivalents in other jurisdictions</h3>
      ${(o.equivalents || []).length ? html`<table class="reg"><tbody>${o.equivalents.map((e) => html`<tr key=${e.equivalence_id}>
        <td class="mono"><span class="name" onClick=${() => open(e.obligation.id)}>${e.obligation.id}</span></td>
        <td>${e.obligation.jurisdiction}</td><td>${e.obligation.determination}</td>
        <td><span class="badge type">${e.basis}${e.similarity != null ? ` ${Math.round(e.similarity * 100)}%` : ""}</span></td></tr>`)}</tbody></table>`
        : html`<div class="withheld">No equivalence edges yet.</div>`}
      ${(o.concepts || []).length ? html`<div class="meta">${o.concepts.map((c) => html`<span key=${c.id}>concept <b>${c.name}</b> <a class="name" onClick=${() => openCompare(c.name)}>compare →</a></span>`)}</div>` : ""}
      ${(o.merged_with || []).length ? html`<div class="meta"><span>merged duplicates:</span>${o.merged_with.map((m) => html`<span key=${m.id} class="name" onClick=${() => open(m.id)}>${m.id}</span>`)}</div>` : ""}

      <h3>History</h3>
      <ul class="timeline">
        ${(h.changes || []).slice().reverse().map((c) => html`<li key=${c.change_id}>
          <${Kind} k=${c.kind} /> effective <b>${fmt(c.effective_date)}</b> <span class="mono">(${c.effective_date_basis})</span>
          ${c.cause_l1_change_event_id ? html` · caused by L1 change <span class="mono">#${c.cause_l1_change_event_id}</span>` : ""}
          <div class="when">detected ${fmt(c.detected_at)} · ${c.change_id}${c.detail && c.detail.reasons ? ` · ${c.detail.reasons.join("; ")}` : ""}</div></li>`)}
        ${(h.supersessions || []).map((s) => html`<li key=${s.supersession_id}><span class="badge type">${s.direction.replace("_", " ")}</span> <span class="name" onClick=${() => open(s.obligation_id)}>${s.obligation_id}</span> <span class="when">${fmt(s.effective_date)} · ${s.note || ""}</span></li>`)}
        ${!(h.changes || []).length && !(h.supersessions || []).length ? html`<li>No change events recorded.</li>` : ""}
      </ul>
      ${(h.reviews || []).length ? html`<h3>Reviews</h3><table class="reg"><tbody>${h.reviews.map((r, i) => html`<tr key=${i}><td>${r.reviewer_kind}</td><td class="mono">${r.reviewer}</td><td><span class=${r.verdict === "correct" ? "ok" : r.verdict === "incorrect" ? "bad" : "warn"}>${r.verdict}</span></td><td>${r.confidence ?? "—"}</td><td>${r.notes}</td><td class="when">${fmt(r.reviewed_at)}</td></tr>`)}</tbody></table>` : ""}

      <h3>Why (derivation trail)</h3>
      ${(o.why || []).length ? o.why.map((w) => html`<div key=${w.id} class="why" style=${{ marginBottom: "8px" }}>
        <div><b>${w.agent_id}</b> · ${w.reasoning_summary}</div>
        <div class="mono">confidence ${w.confidence ?? "—"} · model ${w.model_manifest && w.model_manifest.model ? w.model_manifest.model : "deterministic"} · inputs ${(w.inputs_hash || "").slice(0, 12)} · ${fmt(w.created_at)} · <code>${w.id}</code></div>
      </div>`) : html`<div class="withheld">No why-trail recorded (pre-HLD-v2 row).</div>`}

      <h3>Request a modification</h3>
      ${showForm ? html`<${ModificationForm} id=${o.id} />` : html`<button class="btn quiet" onClick=${() => setShowForm(true)}>Propose a change to this obligation</button>`}
    </div></div>`;
}

function ChangesPage({ open }) {
  const [feed, setFeed] = useState(null);
  const [since, setSince] = useState("");
  const [kind, setKind] = useState("");
  useEffect(() => { setFeed(null); api(`/l2/changes?${qs({ since, kind, limit: 300 })}`).then(setFeed).catch(() => setFeed({ items: [] })); }, [since, kind]);
  return html`<div class="panelx">
    <h2>Registry change feed</h2>
    <div class="meta"><span>since <input aria-label="Changes since date" type="date" value=${since} onChange=${(e) => setSince(e.target.value)} /></span>
      ${["", "added", "updated", "revoked"].map((k) => html`<span key=${k} class=${"chip" + (kind === k ? " on" : "")} onClick=${() => setKind(k)}>${k || "any kind"}</span>`)}</div>
    ${!feed ? html`<div class="spin">Loading…</div>` : !feed.items.length ? html`<div class="empty">No obligation changes in range.</div>` :
      html`<table class="reg"><thead><tr><th>Kind</th><th>Obligation</th><th>Determination</th><th>Jurisdiction</th><th>Effective</th><th>Basis</th><th>Cause</th><th>Detected</th></tr></thead><tbody>
        ${feed.items.map((c) => html`<tr key=${c.change_id}><td><${Kind} k=${c.kind} /></td>
          <td class="mono"><span class="name" onClick=${() => open(c.obligation_id)}>${c.obligation_id}</span></td>
          <td>${c.determination}</td><td>${c.jurisdiction}</td><td>${fmt(c.effective_date)}</td><td class="mono">${c.effective_date_basis}</td>
          <td class="mono">${c.cause_l1_change_event_id ? `L1 #${c.cause_l1_change_event_id}` : "—"}</td><td class="when">${fmt(c.detected_at)}</td></tr>`)}</tbody></table>`}
  </div>`;
}

function ComparePage({ initialQ, open }) {
  const [jur, setJur] = useState("uk,eu");
  const [q, setQ] = useState(initialQ || "");
  const [data, setData] = useState(null);
  const run = () => { setData(null); api(`/l2/compare?${qs({ jurisdictions: jur, q })}`).then(setData).catch((e) => setData({ error: e.message, groups: [] })); };
  useEffect(run, []);
  const juris = jur.split(",").map((j) => j.trim().toLowerCase()).filter(Boolean);
  return html`<div class="panelx">
    <h2>Compare across jurisdictions</h2>
    <div class="meta"><span>jurisdictions <input aria-label="Jurisdictions to compare" value=${jur} onInput=${(e) => setJur(e.target.value)} placeholder="uk,eu,il" /></span>
      <span>filter <input aria-label="Concept or wording" value=${q} onInput=${(e) => setQ(e.target.value)} placeholder="concept or wording" /></span><button class="btn" onClick=${run}>Compare</button></div>
    ${!data ? html`<div class="spin">Comparing…</div>` : data.error ? html`<div class="bad">${data.error}</div>` : !data.groups.length ? html`<div class="empty">No concept or equivalence spans two of these jurisdictions yet.</div>` :
      html`<div class="cmp">${data.groups.map((g) => html`<div key=${g.group}>
        <div class="meta"><b>${g.name}</b><span class="badge type">${g.basis}</span>${g.gaps.length ? html`<span class="warn">gaps: ${g.gaps.join(", ")}</span>` : html`<span class="ok">covered in all</span>`}</div>
        <div class="row">${juris.map((j) => html`<div key=${j} class=${"cell" + (g.members[j] ? "" : " gap")}><h5>${j}</h5>
          ${(g.members[j] || []).map((m) => html`<div key=${m.id}><span class="name" onClick=${() => open(m.id)}>${m.id}</span> ${m.determination}</div>`)}
          ${!g.members[j] ? "no equivalent obligation found" : ""}</div>`)}</div></div>`)}</div>`}
  </div>`;
}

function Scorecard() {
  const [card, setCard] = useState(null);
  useEffect(() => { api("/l2/scorecard").then(setCard).catch((e) => setCard({ error: e.message })); }, []);
  if (!card) return html`<div class="spin">Loading scorecard…</div>`;
  if (card.error) return html`<div class="empty">${card.error}</div>`;
  const gate = card.gate || {};
  const suites = { ...(gate.suites || {}) };
  (gate.missing || []).forEach((s) => { if (!suites[s]) suites[s] = { passed: null, ran_at: null, scores: {} }; });
  const ob = card.obligations || {};
  return html`<div>
    <div class="panelx"><h2>L2 publication gate <span class=${gate.passed ? "ok" : "bad"}>${gate.passed ? "passing" : "not passing"}</span></h2>
      <div class="meta">${Object.entries(card.thresholds || {}).map(([k, v]) => html`<span key=${k}>${k} <b>${v}</b></span>`)}</div>
      <table class="reg"><thead><tr><th>Suite</th><th>Result</th><th>Last run</th><th>Key scores</th></tr></thead><tbody>
        ${Object.entries(suites).map(([name, r]) => html`<tr key=${name}><td class="mono">${name}</td>
          <td class=${r.passed === null ? "warn" : r.passed ? "ok" : "bad"}>${r.passed === null ? "not yet run" : r.passed ? "pass" : "fail"}</td>
          <td class="when">${r.ran_at ? fmt(r.ran_at) : "—"}</td>
          <td class="mono">${Object.entries(r.scores || {}).filter(([, v]) => typeof v !== "object").slice(0, 6).map(([k, v]) => `${k}=${v}`).join("  ")}</td></tr>`)}</tbody></table></div>
    <div class="panelx"><h2>Registry</h2>
      <div class="score">
        <div class="kpi"><b>${ob.live ?? 0}</b><span>live obligations</span></div>
        <div class="kpi"><b>${(ob.by_status || {}).stale ?? 0}</b><span>stale (revoked)</span></div>
        <div class="kpi"><b>${card.asserts}</b><span>asserts edges</span></div>
        <div class="kpi"><b>${card.equivalences}</b><span>equivalences</span></div>
        <div class="kpi"><b>${card.supersessions}</b><span>supersessions</span></div>
        <div class="kpi"><b>${pct(card.precision && card.precision.precision)}</b><span>review precision (${(card.precision || {}).judged || 0} judged)</span></div>
        <div class="kpi"><b>${pct(card.duplicates && card.duplicates.rate)}</b><span>unmerged duplicate rate</span></div>
        <div class="kpi"><b>${Object.values(card.changes || {}).reduce((a, b) => a + b, 0)}</b><span>change events (${Object.entries(card.changes || {}).map(([k, v]) => `${k} ${v}`).join(", ") || "none"})</span></div>
      </div>
      <h3>By type</h3><div class="meta">${Object.entries(ob.by_type || {}).map(([k, v]) => html`<span key=${k}>${k} <b>${v}</b></span>`)}</div>
      <h3>By jurisdiction</h3><div class="meta">${Object.entries(ob.by_jurisdiction || {}).map(([k, v]) => html`<span key=${k}>${k} <b>${v}</b></span>`)}</div>
    </div></div>`;
}

function App() {
  const [theme, toggleTheme] = useTheme();
  const [tab, setTab] = useState("registry");
  const [view, setView] = useState({ page: "list" });
  const [filters, setFilters] = useState({ q: "", jurisdiction: "", regulator: "", obligation_type: "", status: "live", canonical_only: false });
  const [facets, setFacets] = useState({});
  const [compareQ, setCompareQ] = useState("");
  useEffect(() => { api("/l2/obligations?limit=1").then((d) => setFacets(d.facets)).catch(() => {}); }, []);
  const open = (id) => { setTab("registry"); setView({ page: "obligation", id }); history.replaceState(null, "", "#" + id); };
  const openCompare = (q) => { setCompareQ(q || ""); setTab("compare"); history.replaceState(null, "", "#compare"); };
  const back = () => { setView({ page: "list" }); history.replaceState(null, "", "#"); };
  // Deep links: /l2#OBL-000001 opens an obligation; #changes / #compare / #scorecard open a tab.
  useEffect(() => {
    const apply = () => {
      const h = decodeURIComponent(location.hash.slice(1));
      if (/^OBL[-:]/.test(h)) { setTab("registry"); setView({ page: "obligation", id: h }); }
      else if (["changes", "compare", "scorecard", "registry"].includes(h)) { setTab(h); if (h === "registry") setView({ page: "list" }); }
    };
    apply(); window.addEventListener("hashchange", apply);
    return () => window.removeEventListener("hashchange", apply);
  }, []);

  let body;
  if (tab === "changes") body = html`<${ChangesPage} open=${open} />`;
  else if (tab === "compare") body = html`<${ComparePage} initialQ=${compareQ} open=${open} />`;
  else if (tab === "scorecard") body = html`<${Scorecard} />`;
  else if (view.page === "obligation") body = html`<${ObligationPage} id=${view.id} back=${back} open=${open} openCompare=${openCompare} />`;
  else body = html`<div class="layout"><${Facets} facets=${facets} filters=${filters} setFilters=${setFilters} /><${Registry} filters=${filters} open=${open} /></div>`;

  return html`<div>
    <header class="appbar">
      <div class="wordmark" onClick=${() => (location.href = "/")}><b>CLHEAR</b><span>the compliance stack</span></div>
      <div class="spacer"></div>
      <nav class="primarynav" aria-label="Layers"><a class="navlink" href="/">Start</a><a class="navlink" href="/l1">L1</a><a class="navlink active" href="/l2">L2</a><a class="navlink" href="/l3">L3</a><a class="navlink" href="/l4">L4</a><a class="navlink" href="/l5">L5</a><a class="navlink" href="/l6">L6</a><a class="navlink" href="/l7">L7</a><a class="navlink" href="/l8">L8</a></nav>
      <button class="themebtn" onClick=${toggleTheme}>${theme === "dark" ? "◐ pearl" : "◑ dark"}</button>
    </header>
    <main id="main"><h1 class="visually-hidden">L2 · obligation registry</h1>
      <div class="tabs">
        ${[["registry", "Registry"], ["changes", "Change feed"], ["compare", "Compare"], ["scorecard", "Scorecard"]].map(([k, label]) =>
          html`<button key=${k} class=${tab === k ? "on" : ""} onClick=${() => { setTab(k); if (k === "registry") back(); else history.replaceState(null, "", "#" + k); }}>${label}</button>`)}
      </div>
      ${body}
    </main></div>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
