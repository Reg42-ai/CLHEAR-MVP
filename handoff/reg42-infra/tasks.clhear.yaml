# CLHEAR task classes for Reg42 Infer — generated from
# app/clhear/platform/task_classes.py (CLHEAR-MVP). Do not hand-edit.
# Derivation classes: procurement-clean (US/EU origin) Bedrock models only.
employee: clhear  # one Infer employee for every CLHEAR fleet; the token is bound to it
tasks:
  l1_parse:
    layer: L1
    shape: extraction
    derivation: true
    quality_threshold: 0.9
    data_class_default: public
    description: 'Extractive parse repair hints; output must byte-match publisher text'
    ladder:
      - amazon.nova-lite-v1:0  # origin=US
      - amazon.nova-pro-v1:0  # origin=US
      - openai.gpt-oss-120b-1:0  # origin=US
  l1_change:
    layer: L1
    shape: extraction
    derivation: true
    quality_threshold: 0.9
    data_class_default: public
    description: 'Effective-date extraction and clause-level change classification'
    ladder:
      - openai.gpt-oss-120b-1:0  # origin=US
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
  l2_extract:
    layer: L2
    shape: extraction
    derivation: true
    quality_threshold: 0.9
    data_class_default: public
    description: 'Clause -> candidate obligations with span offsets'
    ladder:
      - openai.gpt-oss-120b-1:0  # origin=US
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
  l2_consolidate:
    layer: L2
    shape: structured_drafting
    derivation: true
    quality_threshold: 0.88
    data_class_default: public
    description: 'Dedupe/merge into canonical obligations; equivalence detection'
    ladder:
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
      - openai.gpt-oss-120b-1:0  # origin=US
  l2_change:
    layer: L2
    shape: extraction
    derivation: true
    quality_threshold: 0.9
    data_class_default: public
    description: 'L1 clause change -> which obligations change how'
    ladder:
      - openai.gpt-oss-120b-1:0  # origin=US
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
  l3_decompose:
    layer: L3
    shape: structured_drafting
    derivation: true
    quality_threshold: 0.85
    data_class_default: public
    description: 'Obligation -> building blocks (8 kinds)'
    ladder:
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
      - openai.gpt-oss-120b-1:0  # origin=US
  l3_characterize:
    layer: L3
    shape: extraction
    derivation: true
    quality_threshold: 0.88
    data_class_default: public
    description: 'Fill fixed characteristic schema from obligation text'
    ladder:
      - openai.gpt-oss-120b-1:0  # origin=US
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
  l4_enumerate:
    layer: L4
    shape: extraction
    derivation: true
    quality_threshold: 0.9
    data_class_default: public
    description: 'Licences, products, client types, channels from regulator registers'
    ladder:
      - openai.gpt-oss-120b-1:0  # origin=US
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
  l5_map:
    layer: L5
    shape: mapping
    derivation: true
    quality_threshold: 0.85
    data_class_default: public
    description: 'Activities <-> blocks / products with obligation refs'
    ladder:
      - openai.gpt-oss-120b-1:0  # origin=US
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
  l6_explain:
    layer: L6
    shape: long_reasoning
    derivation: true
    quality_threshold: 0.9
    data_class_default: public
    description: 'Per-item explanation citing blueprint ids only'
    ladder:
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
      - openai.gpt-oss-120b-1:0  # origin=US
  l7_score:
    layer: L7
    shape: extraction
    derivation: true
    quality_threshold: 0.85
    data_class_default: public
    description: 'Enforcement case -> breached obligations; dimension inputs'
    ladder:
      - openai.gpt-oss-120b-1:0  # origin=US
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
  l8_fill:
    layer: L8
    shape: structured_drafting
    derivation: true
    quality_threshold: 0.85
    data_class_default: members
    description: 'Best-practice fills for blocks'
    ladder:
      - mistral.mistral-large-3-675b-instruct  # origin=EU
      - us.anthropic.claude-opus-4-5-20251101-v1:0  # origin=US
      - openai.gpt-oss-120b-1:0  # origin=US
  judge:
    layer: L0
    shape: judging
    derivation: false
    quality_threshold: 0.85
    data_class_default: public
    description: 'Second-model review / rubric judging (non-derivation)'
    ladder:
      - amazon.nova-lite-v1:0  # origin=US
      - us.meta.llama3-3-70b-instruct-v1:0  # origin=US
      - openai.gpt-oss-120b-1:0  # origin=US
  embed:
    layer: L0
    shape: embedding
    derivation: false
    quality_threshold: 0.0
    data_class_default: public
    description: 'Clause embeddings (1024 dims) for the pgvector index; rebuildable, never enters the record'
    ladder:
      - amazon.titan-embed-text-v2:0  # origin=US
      - cohere.embed-multilingual-v3  # origin=US
policy:
  derivation_classes_forbid_origins: [CN]
  hosting: aws-bedrock
  frozen_per_release: true
