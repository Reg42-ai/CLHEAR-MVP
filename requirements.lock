# requirements.txt states the minimums developers need; this file is what builds run:
#   pip install -r requirements.lock
# Regenerate from a clean venv on Python 3.12 (the CI interpreter):
#   python -m venv .venv && . .venv/bin/activate && pip install -r requirements.txt \
#     && pip freeze --exclude-editable | grep -v -E '^(pip|setuptools|wheel)==' | sort -f > requirements.lock  (keep this header)
# tests/test_supply_chain.py fails when a requirement is not pinned here or a pin is not exact.
