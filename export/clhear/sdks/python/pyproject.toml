[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clhear"
version = "0.1.0"
description = "Python SDK for the CLHEAR open compliance standard API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://clhear.org"
Documentation = "https://clhear.org/build"

[tool.setuptools.packages.find]
where = ["."]
include = ["clhear*"]
